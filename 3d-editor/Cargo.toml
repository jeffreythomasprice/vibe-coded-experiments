[workspace]
resolver = "3"
members = [
    "crates/editor-schema",
    "crates/editor-schema-gen",
    "crates/editor-core",
    "crates/editor-geom",
    "crates/editor-cmd",
    "crates/editor-fmt",
    "crates/editor-sim",
    "crates/editor-render",
    "crates/editor-proto",
    "crates/editor-host",
    "crates/editor-server",
    "crates/editor-mcp",
    "crates/editor-cli",
    "crates/editor-app",
    "crates/editor-game",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
editor-schema = { path = "crates/editor-schema" }
editor-schema-gen = { path = "crates/editor-schema-gen" }
editor-core = { path = "crates/editor-core" }
editor-geom = { path = "crates/editor-geom" }
editor-cmd = { path = "crates/editor-cmd" }
editor-fmt = { path = "crates/editor-fmt" }
editor-sim = { path = "crates/editor-sim" }
editor-render = { path = "crates/editor-render" }
editor-proto = { path = "crates/editor-proto" }
editor-host = { path = "crates/editor-host" }

glam = { version = "0.34", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
schemars = "1"
jsonschema = { version = "0.56", default-features = false }
toml = "1"
typify = "0.6"
regress = "0.11"
prettyplease = "0.2"
syn = "2"
thiserror = "2"
proptest = "1"

wgpu = "30"
winit = "0.30"
egui = "0.36"
egui-wgpu = "0.36"
egui-winit = "0.36"
egui_dock = "0.21"
ab_glyph = "0.2"
epaint_default_fonts = "0.36"
bytemuck = { version = "1", features = ["derive"] }
pollster = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tga", "bmp"] }
rfd = "0.18"

clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std"] }
base64 = "0.23"
rmcp = { version = "3.9", features = ["server", "transport-io"] }
