[package]
name = "raytracing-voxels"
version = "0.1.0"
edition = "2024"

[dependencies]
wgpu = "28.0.0"
winit = "0.30.13"
pollster = "0.4"
env_logger = "0.11"
log = "0.4"
bytemuck = { version = "1", features = ["derive"] }
anyhow = "1.0.102"
ab_glyph = "0.2"
noise = "0.9"
glam = { version = "0.32.1", features = ["bytemuck"] }
tokio = { version = "1", features = ["rt", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
