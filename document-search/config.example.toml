# Copy this file to ~/.config/document-search/config.toml,
# or pass `--config <path>` on the command line.

# Path to the SQLite/turso database file. Relative paths are resolved
# against the directory containing this config file.
db_path = "document-search.db"

[ollama]
url = "http://localhost:11434"

# The embedding model used to generate vectors for the chunks table.
# Pull it once with: ollama pull <model>
# The model's vector length is probed on first run and cached in the DB.
embedding_model = "qwen3-embedding:8b"

# Chat model used for summarization when [llm].provider = "ollama".
# Pull it once with: ollama pull <model>.
chat_model = "qwen2.5:14b"

# Let thinking-capable chat models (qwen3, qwen3.5, deepseek-r1, …) reason
# before answering. Reasoning tokens count against [llm].max_output_tokens,
# so a low cap can leave no room for the summary itself. Models that don't
# support thinking are retried automatically without it. If a summary call
# spends its whole budget thinking (common on noisy OCR text), that group is
# retried with a terser fallback prompt at a quarter of the budget, then with
# thinking off. Set false for faster (but usually shallower) summaries.
think = true

# Context window (in tokens) requested for every chat call. Ollama's own
# default is only a few thousand tokens and it silently drops the *start* of
# any longer prompt, system prompt included. This must hold the summary input
# (about one token per CJK character, or per ~4 bytes of Latin text) plus the
# output budget; [llm].max_output_tokens is shrunk per call to fit, and a
# prompt that doesn't fit at all fails the call. Larger values cost VRAM.
num_ctx = 32768

[anthropic]
# Endpoint for Anthropic Messages API. Override only if proxying.
base_url = "https://api.anthropic.com"

# Name of the env var that holds the Anthropic API key. The key value itself
# is read from the environment at request time, never stored in config.
api_key_env = "ANTHROPIC_API_KEY"

# Chat model used for summarization when [llm].provider = "anthropic".
model = "claude-haiku-4-5-20251001"

[llm]
# Which provider to use for chat/summarization. "ollama" uses [ollama] above;
# "anthropic" uses [anthropic] above and requires the configured env var to be
# set. Embeddings always come from Ollama regardless of this setting.
provider = "ollama"

# Max tokens to ask the model to emit per summarization call. With
# [ollama].think = true this budget covers the model's reasoning as well as
# the summary, so keep it generous.
max_output_tokens = 20000

[summarize]
# Settings for the hierarchical summary tree built as the final phase of
# every `ingest` (skip per-ingest with `--no-summary`; override max_depth
# per-ingest with `--max-depth N`).
#
# Number of consecutive level-(k-1) nodes summarized into one level-k node.
# Level 0 groups chunks; higher levels group prior-level summaries.
group_size = 6

# Hard cap on tree depth. Building stops sooner if a level produces a single
# (root) summary.
max_depth = 4

# Languages to write summaries in. One summary tree is built per entry, so
# each extra language roughly doubles summarization cost. Entries are ISO
# 639-1 codes ("en", "ja", "zh", "ko", "fr", …) or "source", which resolves
# to the document's detected language (falling back to "en" when detection
# was inconclusive). Duplicates after resolution are collapsed, so
# ["en", "source"] on an English document builds a single tree.
# Override per-ingest with `--summary-lang <code>` (repeatable).
languages = ["en"]

[chunking]
# Target chunk size in bytes. The chunker steps back to the nearest UTF-8
# char boundary, so actual chunks may be a few bytes smaller.
chunk_size_bytes = 5000
# How many bytes each chunk overlaps with the previous one. Must be less
# than chunk_size_bytes.
overlap_bytes = 1000

[server]
# Path to the Unix domain socket the server listens on. Clients auto-spawn
# the server if this socket is missing.
socket_path = "/tmp/document-search.sock"
# Server auto-exits after this many seconds with no connected clients,
# no in-flight job, and an empty queue.
idle_timeout_secs = 15

[logging]
# All processes (server and clients) append to this file. The parent
# directory is created on startup if missing. Point at /dev/null to
# disable file logging.
file = "/tmp/document-search.log"

[search]
# Top-matching chunks to return per in-scope document by default.
# Override per-call with `search --limit N`.
default_results_per_document = 5

# Drop matches whose similarity (1.0 - cosine_distance) falls below this.
# Range [0.0, 1.0]. Override per-call with `search --cutoff F`.
relevancy_cutoff = 0.3

# Preferred language for the region summary shown next to each hit by
# `search --include-summaries`. Falls back to any available language for
# that region. Unset means the first resolved entry of [summarize].languages.
# summary_language = "en"

[ocr]
# Re-extract pages that pdftotext garbled (typically PDFs with CID fonts
# and no ToUnicode CMap) by rasterizing them and running OCR via tesseract.
# When false, ingests fail loudly on unreadable PDFs instead of falling back.
enabled = true

# Per-page decodability threshold. Pages from pdftotext scoring below this
# get OCR'd; pages still below this after OCR fail the ingest. Range
# [0.0, 1.0]. The score allowlist is ASCII plus whichever scripts
# `language` names (jpn/chi_*/kor add CJK/Hangul ranges; "auto" adds all
# of them), so heavily-accented European PDFs may score lower than expected.
# Rare CID fonts can emit garbage that happens to land in CJK ranges and
# passes this check; `ingest --force-ocr` is the escape hatch.
min_decodable_ratio = 0.7

# Skip the decodability check on pages with fewer non-whitespace chars
# than this. Avoids false positives on title pages, dividers, etc. Pages
# under this count are also what the sparse-page trigger below calls
# "sparse".
min_chars_for_check = 40

# Scanned-PDF trigger: when a document has at least `sparse_min_pages`
# pages and at least this fraction of them are sparse (see
# min_chars_for_check), OCR every sparse page. Catches image-only scans,
# whose pages come back from pdftotext empty rather than garbled. Pages
# that are still near-empty after OCR are kept as legitimately blank.
# `ingest --force-ocr` OCRs every page regardless.
sparse_page_ratio = 0.5
sparse_min_pages = 3

# Tolerance for pages that are still below min_decodable_ratio after OCR
# (covers, art plates, colophons). When at most this fraction of the
# document's pages stay undecodable, the ingest keeps their best-effort OCR
# text and logs a warning per page; above it, the ingest fails. 0.0 makes
# any undecodable page fatal.
max_undecodable_page_ratio = 0.05

# Rasterization DPI for pdftoppm. 300 is standard for OCR; higher is
# slower with diminishing returns.
dpi = 300

# Tesseract language (must be installed: tesseract-data-<lang> on Arch,
# tesseract-ocr-<lang> on Debian). Combine multiple as e.g. "eng+fra" or
# "jpn+jpn_vert+eng". "auto" runs tesseract's script detection (needs
# osd.traineddata) on the first page that needs OCR and picks matching
# packs. Override per-ingest with `--ocr-language <codes>`.
language = "eng"

# Tesseract page segmentation mode. 3 = auto (no OSD); 1 = auto with OSD
# (requires osd.traineddata, not always installed); 6 = single uniform
# block. See `tesseract --help-psm`.
psm = 3

# Engine for pages whose OCR language (above, or the --ocr-language override,
# or the script "auto" detects) includes Japanese (jpn / jpn_vert):
#   "ensemble"  - NDLOCR-Lite and YomiToku both read the page; where they
#                 disagree, arbiter_model looks at the page image and picks
#                 one reading per disagreement. Most faithful.
#   "ndlocr"    - NDLOCR-Lite alone.
#   "yomitoku"  - YomiToku alone.
#   "tesseract" - tesseract with `language`, as for other languages.
# The Python engines are installed on first use; see [ocr_tools].
japanese_engine = "ensemble"

# Vision-capable Ollama model for the ensemble's arbitration pass. With
# [llm].provider = "anthropic", [anthropic].model is used instead.
arbiter_model = "qwen3.5:9b"

[ocr_tools]
# Where the Python OCR engines are checked out and installed. Unset means
# ~/.local/share/document-search/ocr-tools. Needs `uv` and `git` on PATH and
# about 6 GB (YomiToku pulls in torch). `document-search ocr-tools install`
# installs ahead of time; `ocr-tools status` shows what's there.
# dir = "~/.local/share/document-search/ocr-tools"

# Install missing engines the first time an ingest needs them. When false,
# such an ingest fails and asks you to run `ocr-tools install`.
auto_install = true

# Python version for the engines' virtualenvs (uv downloads it if needed).
python = "3.12"

# NDLOCR-Lite source, pinned to a commit. Changing either reinstalls it.
ndlocr_repo = "https://github.com/ndl-lab/ndlocr-lite"
ndlocr_rev = "d001dad2013ceabb5736ff8d637474e443eb73c2"

# YomiToku release from PyPI. Changing it reinstalls it. YomiToku is licensed
# CC BY-NC-SA 4.0 (non-commercial use).
yomitoku_version = "0.15.0"

# "auto" uses CUDA when the install found a usable GPU, else CPU (slow).
yomitoku_device = "auto"

# Pages rendered and passed to each engine per run. Larger amortizes model
# load time; smaller uses less temp disk and updates progress more often.
batch_pages = 32
