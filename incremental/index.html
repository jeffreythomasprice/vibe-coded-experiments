<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Incremental</title>
    <style>
        * { margin: 0; padding: 0; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
        canvas { display: block; width: 100vw; height: 100vh; }
        [hidden] { display: none; }
        .panel { position: fixed; border: 1px solid; padding: 10px 12px; font: 13px/1.4 system-ui, sans-serif; }
        #tooltip { pointer-events: none; z-index: 2; max-width: 240px; }
        #sidebar { top: 0; right: 0; bottom: 0; width: 280px; overflow-y: auto; z-index: 1; border-width: 0 0 0 1px; }
        #sidebar h2 { font-size: 16px; margin-bottom: 8px; }
        #sidebar p { margin-bottom: 2px; display: flex; justify-content: space-between; }
        #sidebar .label { opacity: 0.7; }
        #sidebar .resource { margin-bottom: 14px; }
        .icon { display: inline-block; width: 16px; height: 16px; vertical-align: middle; }
        #sidebar .icon { width: 32px; height: 32px; margin-bottom: 4px; }
        #sidebar .icon { cursor: pointer; }
        .title { font-weight: bold; margin-bottom: 4px; }
        .bar { position: relative; flex: 1; min-width: 140px; height: 16px; background: var(--bar-background); border-radius: 2px; overflow: hidden; }
        .fill { position: absolute; left: 0; top: 0; bottom: 0; }
        .fill.generate { background: var(--bar-generate); }
        .fill.overfill { background: var(--bar-overfill); }
        .bar-text { position: relative; display: block; text-align: center; font-size: 11px; line-height: 16px; text-shadow: 0 0 2px #000; }
        #toasts { position: fixed; inset: 0; pointer-events: none; z-index: 3; overflow: hidden; }
        .toast { position: absolute; display: flex; align-items: center; gap: 4px; white-space: nowrap; font: bold 18px system-ui, sans-serif; paint-order: stroke fill; transform: translate(-50%, -100%); }
        .toast .icon { width: 1.2em; height: 1.2em; filter: drop-shadow(0 0 1px #000) drop-shadow(0 0 1px #000); }
        .row { display: flex; align-items: center; gap: 6px; }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div id="tooltip" class="panel" hidden></div>
    <div id="toasts"></div>
    <aside id="sidebar" class="panel" hidden></aside>
    <link data-trunk rel="rust" data-target-name="incremental_game" />
</body>
</html>
