[package]
name = "incremental-game"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
console_error_panic_hook = "0.1"
console_log = { version = "1", features = ["color"] }
js-sys = "0.3"
rand = { version = "0.9", default-features = false, features = ["std"] }
rand_pcg = "0.9"
log = "0.4"
thiserror = "2"
wasm-bindgen = "0.2"

[dependencies.web-sys]
version = "0.3"
features = [
    "CanvasRenderingContext2d",
    "Document",
    "AddEventListenerOptions",
    "Element",
    "Event",
    "EventTarget",
    "CssStyleDeclaration",
    "HtmlCanvasElement",
    "HtmlElement",
    "Node",
    "KeyboardEvent",
    "MouseEvent",
    "WheelEvent",
    "Window",
]

[profile.release]
opt-level = "s"
lto = true
