[package]
name = "robowar-shared"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
ariadne = "0.4"
chumsky = "0.9"
clap = { version = "4", features = ["derive"] }
dirs = "6"
glob = "0.3"
glam = "0.29"
rand = "0.8"
rapier2d = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
