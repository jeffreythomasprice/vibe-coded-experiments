[package]
name = "robowar-visualizer"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "robowar-viz"
path = "src/main.rs"

[dependencies]
anyhow = "1"
bevy = "0.15"
clap = { version = "4", features = ["derive"] }
robowar-shared = { path = "../shared" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
