[package]
name = "dungeon-crawl-game"
version = "0.1.0"
edition = "2024"

[dependencies]
rig-core = "0.32.0"
tokio = { version = "1.50.0", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
jsonschema = "0.28"
anyhow = "1.0.102"
rand = "0.9"
bevy = "0.16"

[build-dependencies]
serde_json = "1"
