[workspace]
resolver = "2"
members = ["crates/common", "crates/gameboy", "crates/emulator", "crates/video", "crates/audio", "crates/ui"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Jeff Price <jeffrey.thomas.price@gmail.com>"]

[workspace.dependencies]
common = { path = "crates/common" }
gameboy = { path = "crates/gameboy" }
video = { path = "crates/video" }
audio = { path = "crates/audio" }
ui = { path = "crates/ui" }

# Rendering / windowing
wgpu = "22.1"
winit = "0.30"
pollster = "0.3"
bytemuck = { version = "1.16", features = ["derive"] }

# UI (egui 0.29 tracks wgpu 22.1 / winit 0.30)
egui = "0.29"
egui-wgpu = "0.29"
egui-winit = "0.29"

# Audio
cpal = "0.15"

# Input
gilrs = "0.11"

# Diagnostics
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1.0"
anyhow = "1.0"

# Serialization / config
serde = { version = "1.0", features = ["derive"] }
postcard = { version = "1.1", default-features = false, features = ["use-std"] }
toml = "0.8"
directories = "6"

# Ctrl+C / SIGTERM handling, so the game is saved on the way out
ctrlc = { version = "3.4", features = ["termination"] }

# Local time for save-state dates
chrono = { version = "0.4", default-features = false, features = ["clock"] }

# Image encoding (save-state screenshots and the test-ROM harness)
png = "0.17"

# Build-time workspace introspection (used by the `common` crate's build.rs)
glob = "0.3"
