[package]
name = "diffusion"
version = "0.1.0"
edition = "2024"

[features]
default = ["vulkan"]
cuda = ["diffusion-rs/cuda"]
vulkan = ["diffusion-rs/vulkan"]

[dependencies]
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
diffusion-rs = "0.1.20"
diffusion-rs-sys = "0.1.20"
dirs = "6.0.0"
hf-hub = { version = "0.4.3", default-features = false, features = ["ureq"] }
image = "0.25.10"
serde = { version = "1.0.229", features = ["derive"] }
tempfile = "3.27.0"
thiserror = "2.0.20"
toml = "1.1.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
viuer = { version = "0.11.0", features = ["icy_sixel"] }

[patch.crates-io]
diffusion-rs-sys = { path = "vendor/diffusion-rs-sys" }
