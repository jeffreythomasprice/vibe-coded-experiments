[package]
name = "diffusion"
version = "0.1.0"
edition = "2024"

[features]
default = ["vulkan"]
cuda = ["diffusion-rs/cuda"]
vulkan = ["diffusion-rs/vulkan"]
ollama-tests = []

[dependencies]
async-trait = "0.1.89"
base64 = "0.22.1"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
diffusion-rs = "0.1.20"
diffusion-rs-sys = "0.1.20"
dirs = "6.0.0"
hf-hub = { version = "0.4.3", default-features = false, features = ["ureq"] }
image = "0.25.10"
indicatif = "0.17"
reqwest = { version = "0.12.24", default-features = false, features = ["json", "rustls-tls"] }
schemars = "1.0.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3.27.0"
thiserror = "2.0.20"
tokio = { version = "1.48.0", features = ["rt-multi-thread", "macros"] }
toml = "1.1.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ureq = { version = "2.12.1", features = ["json"] }
viuer = { version = "0.11.0", features = ["icy_sixel"] }

[dev-dependencies]
wiremock = "0.6.5"

[patch.crates-io]
diffusion-rs-sys = { path = "vendor/diffusion-rs-sys" }
