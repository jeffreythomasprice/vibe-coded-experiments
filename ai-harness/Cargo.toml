[workspace]
resolver = "2"
members = ["client", "server", "lib", "shared"]
# `client` is wasm-only — exclude it from host builds so a bare `cargo build`
# or `cargo test` doesn't try to compile it for the native target.
default-members = ["shared", "lib", "server"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shared = { path = "shared" }
lib = { path = "lib" }
anyhow = "1"
toml = "1"
dirs = "6"
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "time"] }
time = { version = "0.3", features = ["formatting", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
reqwest = { version = "0.13", features = ["json", "stream"] }
futures-util = "0.3"
async-stream = "0.3"
async-trait = "0.1"
thiserror = "2"
base64 = "0.22"
