[workspace]
resolver = "2"
members = ["shared", "server", "client"]
# `client` is a wasm-only crate; don't try to build it for the host target by default.
default-members = ["shared", "server"]

[workspace.package]
edition = "2021"
version = "0.1.0"

[workspace.dependencies]
shared = { path = "shared" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures-util = "0.3"
