[package]
name = "client"
edition.workspace = true
version.workspace = true

[dependencies]
shared = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
futures-util = { workspace = true }
leptos = { version = "0.8", features = ["csr"] }
gloo-net = { version = "0.6", features = ["http", "websocket"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"
tracing-web = "0.1"
leptos_router = "0.8"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlElement", "HtmlCanvasElement", "CanvasRenderingContext2d", "Path2d", "DomRect", "MouseEvent", "WheelEvent", "KeyboardEvent", "EventTarget", "CssStyleDeclaration", "CanvasWindingRule", "DomRectReadOnly"] }
geo = "0.33.1"

[build-dependencies]
# Bakes `client/.env` values in as compile-time env vars (see build.rs).
dotenvy = "0.15"
