# The 11 Arts of Thaumaturgy (Exalted 2e core pp.139-142; Books of Sorcery
# Vol. 3 - Oadenol's Codex, Ch. 3, pp.129-160).
#
# Thaumaturgy is neither a Charm nor a Merit: the only universal entry
# requirement is Occult >= 1. Each Art advances through three Degrees --
# Initiate (+1), Adept (+2), Master (+3) -- gated by the universal Occult
# ladder (Initiate = Occult 1, Adept = Occult 3, Master = Occult 5), which is a
# code constant, not repeated here. `requirements` lists only the EXTRA Ability
# minimums an individual Art imposes on top of that ladder.
#
# ArtRequirement = { ability, min, degree, focus? }
#   "to hold Degree >= `degree` in this Art, need `ability` >= `min`."
#   A per-Degree requirement (scales with degree) is written as one entry per
#   Degree level. `focus` (Craft only) names the craft focus that satisfies it.

[[art]]
id = "alchemy"
name = "Alchemy"
source = "Oadenol's Codex"
pages = "129"
description = """
Pharmacy, metallurgy, and other transformative crafts: brewing magical \
medicines, transmuting base materials into noble ones, and temporarily \
granting mortals Exalted-like qualities. An alchemist needs Lore 2 to gain a \
Degree and Lore 4 to become an Adept. Beyond that, most formulas also require \
one dot of Craft (Water) per Degree (some formulas call for a different Craft), \
except healing formulas, which require one dot of Medicine per Degree instead \
-- these are per-formula constraints rather than a fixed Art-Degree gate, so \
only the Lore minimums are enforced here (Oadenol's Codex p.129)."""
requirements = [
    { ability = "Lore", min = 2, degree = 1 },
    { ability = "Lore", min = 4, degree = 2 },
]

