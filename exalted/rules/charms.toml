[[charm]]
id = "first-ability-excellency"
name = "First (Ability) Excellency: Essence Overwhelming"
exalt_type = "solar"
ability = "(any)"
cost = "1m per die"
mins_ability = 1
mins_essence = 1
charm_type = "Reflexive"
type_detail = "Step 1 for attacker, Step 2 for defender"
keywords = ["Combo-OK"]
duration = "Instant"
prerequisites = []
source = "Exalted 2E"
pages = "183"
effect = "+1 die per mote (cap A+A)"
description = """
Lawgivers with this Charm are known for their moments of brilliance. The Exalt's player can invoke this Charm when making a roll based on the relevant Ability. This Charm then adds one die to that roll for each mote spent. This Charm is the paradigmatic dice adder. The rule that Solars are prohibited from increasing a dice pool by more than their (Attribute + Ability) almost always refers to the purchase of dice through the use of this Charm.

Characters can also use this Charm to enhance unrolled uses of the relevant Ability, usually to increase a Defense Value, for example, by increasing (Dexterity + Dodge) to protect against a physical attack. When enhancing static values, her player rolls one die for each mote spent on the First Excellency. Each success increases her effective (Attribute + Ability) rating for the task by two. Therefore, each success on the First Excellency roll increases an applicable static value by one.

Characters cannot use this or other Excellencies or dice-adding Charms to "create" actions. This Charm can be part of a Combo or used together with the Second Excellency, but it is incompatible with the Third Excellency.
"""

[[charm]]
id = "second-ability-excellency"
name = "Second (Ability) Excellency: Essence Triumphant"
exalt_type = "solar"
ability = "(any)"
cost = "2m per success"
mins_ability = 1
mins_essence = 1
charm_type = "Reflexive"
type_detail = "Step 1 for attacker, Step 2 for defender"
keywords = ["Combo-OK"]
duration = "Instant"
prerequisites = []
source = "Exalted 2E"
pages = "184"
effect = "+1 success per 2m"
description = """
Solar Exalted with this Charm are known for their unwavering perfection. The Exalt's player can invoke this Charm when making a roll based on the relevant Ability. The Exalt then spends up to (Attribute + Ability) in motes. This Charm adds one success to a roll for every two motes spent. Each success purchased with Essence Triumphant is the equivalent of purchasing two dice with the First Excellency or some other dice adder.

The Exalt can also use this Charm to enhance unrolled uses of the relevant Ability. Each two motes spent increases his effective (Attribute + Ability) rating for one task by two. This means that every two motes spent on this Excellency increase a static value like a DV by one.

This Charm can be Comboed or used together with the First Excellency, but it is incompatible with the Third Excellency.
"""

