The Essence of the Solar Exalted flows through them and brings their intentions and their actions into perfect harmony. Purchasing this Charm allows the Solar to invoke the First, Second and Third Excellencies for the relevant Ability as innate powers rather than Charms. This means that the character can use them even with a Combo that does not contain them or when she has already used a Charm for an action. However, she cannot use them out of place on the order of combat actions, nor may she apply the same Charm repeatedly to a single roll.

The character must abide by the dice pool maximums as normal. The Third Excellency remains incompatible with the first two, even if some or all of them are invoked as natural Abilities. The character must first buy the relevant Excellency to use it with this Charm. This Charm is incompatible with any effect that reduces the mote cost of the first three Excellencies.
