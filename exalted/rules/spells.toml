description = """
Silur herself devised this variation on the older Wheel of the Turning Heavens. The sorcerer pours violet Essence into the sky and makes the Sign of Battle's End. The Essence forms a great wheel of light. The edges of the slowly spinning wheel bear mystic sigils of peace and harmony, while the center holds the symbol of the Maiden of Endings. This wheel lasts for (Essence x 20) ticks and covers an area (Essence x 100) yards wide. The wheel's center can be up to 50 yards from the sorcerer.

All combat stops below the violet wheel, as soldiers stare into the sky, their minds filled with the compulsion of quietude. Mortals simply stand entranced. Exalts and other Essence wielders may spend two Willpower to break free from the unnatural mental influence. Anyone who resists the spell's effect can snap everyone else out of their trance just by yelling a bit, but those people still cannot fight. They can do anything else they want, though, and they remember their actions from then on. If anyone who spent Willpower performs an act of violence, however, she shatters the spell as a whole. Moreover, if the caster himself breaks the peace, he immediately loses three points of temporary Willpower as a heavenly punishment for invoking the Sign of Saturn falsely.

When used in war, this spell stops an engagement between two combat units whose Magnitude does not exceed the sorcerer's own. Both sides lose their action unless a commander or other special character spends Willpower to break the spell-created truce.
