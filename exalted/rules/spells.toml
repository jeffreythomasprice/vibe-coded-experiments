While so covered, targets can breathe water without difficulty and may walk or swim at their normal movement rate. They may also apply the make haste bonus from Exalted p. 267 underwater. The tough fronds also grant a +1L/+2B bonus to the creature's soak. This is considered a natural soak and slides beneath armor. Creatures who wear armor that is too restricting to permit this (i.e., those with mobility penalties exceeding -1 from armor) cannot be targets of this spell.

