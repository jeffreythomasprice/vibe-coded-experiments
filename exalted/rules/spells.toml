cost = "40m"
keywords = []
duration = "Up to 1 hour"
target = "Recently dead creature"
source = "The Books of Sorcery, Vol II"
pages = "142-143"
effect = "Seal a tomb beyond opening"
description = """
Barred Tomb functions like Denying the Call (see pp. 39-40), except that its binding is stronger. Souls are bound back to life for up to one hour (or until slain again). They also possess a number of unwounded health levels equal to the caster's Essence, each of which is vulnerable only to aggravated damage. Barred Tomb cannot be cast on someone who was previously revived by this spell or Denying the Call. Likewise, Denying the Call doesn't work on someone who was once revived by Barred Tomb. Ghosts that rise after being targeted by this spell have only a single health level.
Barred Tomb is the utmost limit to necromantic attempts to deny death. Even the Obsidian Circle cannot truly return the dead to life.
"""

[[spell]]
id = "birth-of-sanitys-sorrow"
name = "Birth of Sanity's Sorrow"
circle = "void"
cost = "10m, 1 permanent wp"
keywords = []
duration = "Scene"
target = "Caster"
source = "The Books of Sorcery, Vol II"
pages = "149-150"
effect = "Birth sorrow that breaks minds"
description = """
Only the Neverborn themselves can tutor a necromancer in this spell. All other attempts to teach it result in failure, and committing it to paper results in gibberish. The character must have the insanity, influence and raw power to approach the tombs of the Neverborn that drift within the Mouth of the Void in Stygia, constantly devoured by the Abyss but never diminishing. There, the necromancer communes with one of the chthonic entities, and together, they devise her personal expression of this spell.
Birth of Sanity's Sorrow has special timing rules. The character can cast it as three reflexive Shape Void Circle Necromancy actions that take 0 ticks, regardless of previous actions or Charms used. She may do so, however, only when she is reduced to the Incapacitated health level—not before. When she does, her body swells and becomes the monster she and her Neverborn master devised. That creature has these qualities:
• Attributes as determined in the spell Links Born of Tumult (see pp. 42-43), adding (Essence) again to Strength and Stamina.
• (Essence x 6) -0 health levels and a single Incapacitated level.
• The cost of any Charm she knows becomes 1m; she may also substitute 1m for 1wp when invoking Charms or Combos.
• Three great powers. These should cost between 5m and 10m and be vastly impressive. Imitating existing Labyrinth Circle and Void Circle spells are possibilities, as are unique powers devised between a player and Storyteller.
A necromancer destroyed while wearing her Birth of Sanity's Sorrow form dies in a remarkable explosion (or series of explosions) of Essence and gore. Oblivion swallows her soul irrevocably and without exception. Should the character survive the battle, she returns to her original shape at the end of the scene, and the spell burns itself from her memory. She can never cast it again.
"""

[[spell]]
id = "black-faith"
name = "Black Faith"
circle = "void"
cost = "30m, 1lhl"
keywords = []
duration = "Instant"
target = "Caster"
source = "The Books of Sorcery, Vol II"
pages = "143-144"
effect = "Bestow undying black faith"
description = """
A necromancer who casts this spell places all his trust in the Neverborn. He must believe they value him and his dedicated service. The character carves his prayer to dead gods into the corpus of a ghost, hurls this sacrifice into the Mouth of the Void, then spills his own blood into the vast emptiness.
And after the paired sacrifices of death and life, he leaps in himself!
The necromancer hopes that the Neverborn notice his sacrifice and crystallize their dreaming power around him before the end of his descent. As he nears the Void, his clothes, his tools and artifacts, his body itself dissolves to less than dust. Only the corpus of his soul remains as it plummets past the floating tombs of the Neverborn, and it boils excruciatingly away until the necromancer becomes nothing.
One moment stands between the necromancer's loss of spirit and his final dissolution, and it serves as judgment. If he has somewhat roused and greatly pleased the mighty Neverborn, one of them hurls the meager concept of the caster's death into the Void before him. Never having died, the necromancer appears at whatever location he desired to appear. Occasionally, he comes to a place that his unknowable masters consider more appropriate. Regardless, he can appear anywhere that exists, from the Labyrinth to Yu-Shan to a lost realm in Elsewhere or the best-protected spirit sanctum. His method of appearance—literally not-existing and then existing—allows him to completely ignore all wards or safeguards against such travel.
Few necromancers master the Void Circle without the layered blessings of the Neverborn, but some madman might try to use Black Faith while in bad odor with the Underworld's dead gods. In such a case, the necromancer's Exaltation flees him as his consciousness is obliterated at the end of an inspired and very complete suicide. This spell is a Storyteller device, and players should discuss it with their Storyteller before actually using it.
"""

[[spell]]
id = "blackstorm-coffle"
name = "Blackstorm Coffle"
circle = "void"
cost = "48m"
keywords = ["Obvious"]
duration = "Essence months"
target = "Area"
source = "The Books of Sorcery, Vol II"
pages = "150"
effect = "Chain souls in black storm"
description = """
This spell summons a rain of arrows like that created by Clamoring Shackles (see pp. 37-38). On his Cast Necromancy action, the caster's player makes a single (Perception + Archery) attack roll that applies to all targets within a 100-yard radius of a point the necromancer picks within 500 yards. Any arrow that misses dissolves into a foul black smoke. Each ghost slain by an arrow suffers the same effects as in Clamoring Shackles, and the chains thus created latch onto the nearest surviving ghost. Two sets of chains will not latch onto the same ghost; one instead finds a new target.
These chains cannot be made permanent, but they last for a number of months equal to the caster's Essence, at which point they dissolve into acrid smoke.
Used in war, the caster makes the attack against a unit and, if he's commanding another unit, adds its Ranged Combat rating as bonus successes. If the attack succeeds and reduces the target unit's Magnitude at all, it doubles that Magnitude reduction (reducing by one point of Magnitude becomes two, two becomes four, and so on) as the slain spirits imprison the surviving spirits. Against units that don't consist solely of ghosts (or in which ghosts are, at least, the vast majority), the attack inflicts only half raw damage and does not have any special effect.
"""

[[spell]]
id = "blood-from-the-slaughter"
name = "Blood from the Slaughter"
circle = "void"
cost = "35m"
keywords = ["Obvious"]
duration = "Scene"
target = "Caster"
source = "The Books of Sorcery, Vol II"
pages = "150"
effect = "Conjure blood from past slaughter"
description = """
As the necromancer's anima bursts into its full iconic form, insubstantial serpents of Essence erupt from its edges and vanish. For the remainder of the scene, a bloody haze and the sound of distant death agonies surround the necromancer. Every time someone within a league of the sorcerer dies a violent death, a phantom snake appears coiled around the body as it falls, then withdraws to the caster in a dark blaze. Each death heals the necromancer of a health level of bashing or lethal damage, to a maximum of her Essence in health levels per action.
"""

[[spell]]
id = "blood-monsoon"
name = "Blood Monsoon"
circle = "void"
cost = "50m + 1lhl"
keywords = ["Obvious"]
duration = "Stamina hours"
target = "Area"
source = "The Books of Sorcery, Vol II"
pages = "150-151"
effect = "Monsoon of blood, lethal area"
description = """
The necromancer cuts her own palm and cups the blood in her hand. She raises her hand, and her anima blasts the blood into the sky in a growing, rising fountain. At a mile's height, the blood-geyser spreads into a huge, disk-shaped cloud that is a number of miles wide equal to the necromancer's Essence. The necromancer can take other actions once she casts the spell, though the cloud takes an hour to reach its full extent. And then it rains blood.
The sun is blotted out. For a number of hours equal to the caster's Stamina, the sanguine rain falls and the affected area is considered part of the Underworld. Ghosts, for example, are material. Abyssal Exalted also respire Essence naturally, while spirits and other Exalted do not. In addition, even the most peaceful or inoffensive animals kill each other and cannibalize the remains—or commit suicide in any way they can. The stench of gore makes people sick. Every character's player rolls (Stamina + Resistance) for each hour of action, to resist a -1 external penalty to all actions while the rain lasts. For a year and a day afterward, outbreaks of every possible disease haunt the area, impregnated in the water and crops that grow there, while the stench of rotting blood attracts all the undead for miles.
"""

[[spell]]
id = "the-clay-of-warped-dreams"
name = "The Clay of Warped Dreams"
circle = "void"
cost = "60m (committed)"
keywords = []
duration = "Until released or a Neverborn reclaims it"
target = "Area (Labyrinth)"
source = "The Books of Sorcery, Vol II"
pages = "151"
effect = "Warp reality through dream-clay"
description = """
As she stands in the damned grandeur of the Labyrinth, with not a living thing around her, the caster utters a 10-minute prayer to the black will of the Neverborn. As she finishes, the whitest Essence seeps from the walls and floors around the three sacrificial ghosts she brought with her. They fade from existence and become nothing, swallowed by white Oblivion to appease the fickle dreaming of the Neverborn that is the Labyrinth.
Once cast, the character gains complete control over (Essence x 10) cubic miles of the Labyrinth, in any configuration she desires. Landscapes appear as she imagines them, becoming her playground instead of the expression of the Neverborn's nightmares.
Controlling the area's shape gives the caster the following abilities:
• Her player can make a (Perception + Occult) roll for the caster to notice any space within the affected area than she cannot normally see. Using this ability adds to her attempts to detect concealed entities a number of automatic successes equal to her Essence.
• She can manifest physical attacks on creatures within the Labyrinth, such as scythes of sharpened bone or needles of crystallized bile. Her player rolls (Wits + [appropriate combat Ability]) for the attack, which has Rate 1, and adds a number of automatic successes equal to her Occult rating.
• She always has 90% hard cover as sheathes of petrified flesh slide between her and her foes and ropes of wire-strong intestines interfere with their attacks.
• She can create poisonous gases using (Intelligence + Craft [Water]) and introduce dangerous creatures into her section of the Labyrinth at will. Creating an original, dangerous creature this way requires an (Intelligence + relevant Craft) roll, and doing so is time-consuming.
• Trapping others in her creation, such as in a featureless room of impenetrable teeth or a vast maze of slavering tongues, is possible without too much difficulty. It is hard to contain the Exalted, however.
The caster retains her control as long as she commits the Essence or until a Neverborn stirs enough to reclaim it. Neverborn rarely care enough to do so, and never sooner than a day after the spell has been cast. Once the spell has been relinquished, whether the area changes rapidly or slowly depends entirely on the flows of the Labyrinth. Deathlords use this spell to provide a suitably grandiose location for their rare convocations. Only the wariness they feel about their peers and the spell's Essence cost prevent hosts from abusing their powers.
"""

[[spell]]
id = "empty-night-future"
name = "Empty Night Future"
circle = "void"
cost = "32m"
keywords = ["Obvious"]
duration = "Instant"
target = "Area"
source = "The Books of Sorcery, Vol II"
pages = "151"
effect = "Force target into empty future"
description = """
The pure and foreboding black of a starless, moonless night flows outward from the caster's eyes over her entire body. As she speaks the forbidden words of the spell, waves of darkness wash from her into the surroundings, highlighting all ghosts less than (Essence x 10) yards away in clotted shadow. For each ghost affected, people nearby hear the faint sound of glass breaking or tears shattering on a hard, unforgiving ground. Ghosts touched by the spell immediately lose all necromantic bonds and any other bindings produced by Charms whose minimum Essence does not exceed the caster's own. Players of affected ghosts must roll their Willpower at difficulty 5, however, to keep the ghosts from being sucked into Oblivion. For each ghost the necromancer consigns to the Void, she regains one mote.
"""

[[spell]]
id = "forsaken-life-engine"
name = "Forsaken Life Engine"
circle = "void"
cost = "50+m"
keywords = ["Obvious"]
duration = "Until shadowland complete or engine destroyed"
target = "Area and conjured automaton"
source = "The Books of Sorcery, Vol II"
pages = "151-153"
effect = "Engine grinds life from area"
description = """
To cast this spell, a necromancer first constructs a scale model of a necromantic mechanism, from components all derived from a single human body. Doing so requires an (Intelligence + Craft [lesser of Fire or Water]) roll at difficulty 5. The caster holds his palm-size invention level with his eyes and pours his Essence into it. When he drops his hand, the forsaken life engine becomes a colossal reality, sitting hundreds of yards away where his perspective put it.
The forsaken life engine's cogs are carved from slices of thigh- and arm-bones and reinforced with iron. Its cables are woven from sinew and spinal cords. None of it would run without bile-tainted blood as lubrication. Twenty feet wide and almost as tall, heavy iron beams raise it even higher so a yeddim could walk beneath it. Its bottom features a gaping black hole ringed with teeth. Smoke trickles upward from the engine's pipes like blood trickling from a dead man's mouth. It is an automaton with the power to make shadowlands.
Putting a living creature beneath the engine brings it to life. Four bone-and-iron claws extrude from the engine's sides and shovel the victim into the hole, where mechanisms hidden within the apparatus devour the sacrifice and its Essence. The smokestacks belch gouts of black steam and crematory ash into the air, forming a spreading cloud. For each point of permanent Essence the engine consumes from its victims, the infernal machine darkens the earth and sky in a wider area, merging Creation with the Underworld. Many deaths are needed to complete the breakthrough and create a shadowland. The engine must consume a number of points of permanent Essence equal to (10 x the number of motes spent on the spell) in order to finish its work. If the engine should be destroyed before the job is done, the region snaps back into Creation.
For 50 motes, the forsaken life engine creates a shadowland 50 miles in radius. For every additional 10 motes spent in the initial casting, the engine increases in size by about 10% and the completed shadowland increases in radius by another 50 miles, to a maximum of (caster's Essence x 50) miles. As the shadowland expands, the engine grows fainter, more transparent. When the shadowland reaches its full size, the engine disappears as if it had never been. Until then, it can be destroyed and the spell aborted.
Obsidian Countermagic ends Forsaken Life Engine instantly, while Adamant Countermagic inflicts 10 levels of damage to the engine with each casting. The engine does not dodge, but it has a Parry DV of 7 that suffers only the lowest of all DV penalties incurred by the claws' actions.
At normal speeds, the creation processes five weak or unresisting creatures each minute (one every two actions or so). When the "herd" begins to fight back, this slows the project by an amount determined by the Storyteller.
This spell has no effect when cast in the Underworld.
"""

[[spell]]
id = "grandmother-void"
name = "Grandmother Void"
circle = "void"
cost = "40+m, 1lhl"
keywords = ["Obvious"]
duration = "Essence consecutive Speed 5 actions"
target = "Caster and spectres"
source = "The Books of Sorcery, Vol II"
pages = "153-154"
effect = "Invoke the Void grandmother"
description = """
The ground shakes with increasing violence as this spell nears its completion, then the caster speaks two words in a rare Old Realm dialect. Her image fades, until she looks like a two-dimensional hole in the universe, one that might lead directly into Oblivion. And out of that hole pour spectres.
Each spectre is uniquely (and horrifyingly) disfigured, but they share some qualities. Their skin looks like obsidian. Their claws and teeth drip blood and shed tatters of flesh and torn plasm when they move. Eminently prepared to kill for the necromancer and the Neverborn, they constantly whisper the insanities they hear from their slumbering masters' dreams.
For this spell, the Cast Necromancy action is Speed 5. Including the Cast Necromancy action, the character takes a number of consecutive Speed 5 actions equal to her Essence, in which time her being two-dimensional renders her an invalid target for all physical and mental attacks. On each action, including the first, she spawns two spectres. These dead creatures are fully material. They have full Essence pools and health levels, and they immediately act as the caster wills. Treat the spectres as nephwracks (see Exalted, pp. 319–320), but on each action that she extrudes a pair of spectres, the character may purchase bonus points (as per character creation) to improve both spectres at the rate of two bonus points per mote. (She may spend each bonus point on different things for each spectre.) After the last action, the character's player may roll Join Battle to refocus, as per a normal Cast Necromancy action.
In addition to the spectres' core traits, any ghost who comes within five yards of such a spectre hears the whispers of Oblivion (see p. 33). Ghosts whose players fail the roll for their characters to resist the whispers also begin the agonizing process of becoming nephwracks.
Targeting the caster with Obsidian or Adamant Countermagic during her period of invulnerability returns her to her three-dimensional form. She immediately joins battle (as her player makes the roll) and creates no more spectres. Once created, spectres are real and permanent and cannot be dispelled by countermagic.
"""

[[spell]]
id = "inauspicious-citadel"
name = "Inauspicious Citadel"
circle = "void"
cost = "60m + 1lhl"
keywords = ["Obvious"]
duration = "Permanent (until caster dies or erects a second)"
target = "Conjured citadel"
source = "The Books of Sorcery, Vol II"
pages = "153-154"
effect = "Raise a void citadel"
description = """
In the gloom of a shadowland, the necromancer stands above a hole so deep that torches cannot light its depths. At his behest, 100 people have been sacrificed, their teeth and eyes lining the pit's edge. At last, he cuts the Last Sign of the Labyrinth over his own heart, spreads his arms and steps off the edge—and his foot comes down on the roof of an iron tower that surges up into the middle of the hole. It keeps rising until five minutes later, an entire fortress of black iron, basalt and obsidian blights the earth. Any onlooker who doesn't run for her life will be crushed as the citadel grows.
Each citadel is unique, but defensible and complete. Its walls bear the mazy marks of the Labyrinth. The eyes of the sacrifices line its halls, glowing brightly enough to illuminate them; mosaics of their teeth adorn the walls, and their skins upholster furniture carved from bone.
The tower has its own perverted geomancy, focused on the necromancer himself. It is like a manse for which he is the hearthstone, and whenever he's there, it behaves like one. Therefore, as long as he's within his inauspicious citadel, the character regains Essence as if he were within a level-3 manse to which he was attuned, and he may also choose a level-3 hearthstone power that he can use within its walls. The necromancer cannot, however, use the hearthstone power or regain Essence at an increased rate when he is not in residence.
The citadel's lowest chamber is a shrine to the Neverborn. Here, the necromancer's pit now leads to the Void, and anything that falls in will be sent there. If the pit is ever blocked off completely, the citadel collapses.
Even when he's not there, the necromancer's energies sustain the fortress, and he cannot support more than one. If the character dies or erects a second inauspicious citadel, then the first crumbles into Oblivion.
"""

