[[spell]]
id = "mirage-of-protective-shelter"
name = "Mirage of Protective Shelter"
circle = "solar"
cost = "40m"
keywords = ["Illusion"]
duration = "Essence months (permanent with focus)"
target = "Area"
source = "The Books of Sorcery, Vol II"
pages = "93"
effect = "Hidden mirage-shelter for all"
description = """
One of the best ways to protect a person or place is to hide it. After taking the Cast Sorcery action, the character must walk around the area she wishes to protect. As she walks, faint silvery Essence falls from her and forms a line on the ground where she has trod. She must return to her point of origin before the moon next crosses the horizon.
Any creatures that intend to harm the area or its inhabitants cannot approach it. When they get close, the spell makes an unnatural mental attack on them. Unless their Dodge MDVs equal or exceed a value equal to double the caster's Essence, they follow a path around the affected region and cannot perceive it. Spending three points of Willpower lets a character ignore this Illusion effect for one scene, but at the end of that scene, the person finds himself lost again. Mirage of Protective Shelter can deflect entire armies or protect whole provinces.
The mirage normally lasts a number of months equal to the caster's Essence. For long-term protection, the caster must craft (or direct a skilled crafter in building) a silver-and-crystal symbol of the region's protection, anything from a statuette of its presiding god to a stele inscribed with a map of the region. Doing so requires a successful difficulty 5 (Intelligence + [Craft or Occult]) roll to design and then a successful (Dexterity + Craft [lower of Air and Fire]) roll to create. Placing this symbol within the protected region and spending a dot of permanent Willpower prevents the spell from failing until the spell's focus is destroyed or removed from the region.
"""

[[spell]]
id = "mystic-travel"
name = "Mystic Travel"
circle = "solar"
cost = "30m"
keywords = ["Shaping"]
duration = "Until destination reached or path broken"
target = "Unit of travelers"
source = "The Books of Sorcery, Vol II"
pages = "93"
effect = "Step across Creation at will"
description = """
A path exists to convey travelers from one end to the other. The sorcerer reaching out his hand and the path she wishes to follow briefly shines silver and gold. Then the sorcerer yanks, pulling the end of the path to her and her companions. The sorcerer then can travel along the path at 10 times her normal speed: The spell does not actually help the sorcerer move faster. Instead, it shrinks the world—at least for the sorcerer, along that particular path. Any clear path is valid, from commonly used ocean trade routes to animal trails through the woods.
A sorcerer can share this spell with other beings. Before casting the spell, the sorcerer performs a 15-minute ceremony in which she anoints herself, the road and the leader of any unit she wishes to affect (the general of an army, the captain of a ship, the messiah of bunch of apostles, or whatever). Units of any size are valid targets for this spell, from a circle of five to a First Age legion of 10,000 or larger, as long as they all travel with the sorcerer.
The spell lasts until the sorcerer reaches her destination. Any physical breach in the path also ends the spell when the unit reaches it. A broken bridge or dammed river accomplishes this, as do temporary obstacles like a fallen tree that completely blocks a road. Waterborne trade routes rarely suffer such obstructions, but when they do, the obstructions tend to consist of living islands peopled by cannibals—which generally merits greater consideration than a log on a road.
Note: Mystic Travel cannot be combined with other travel spells. Use of one spell breaks the other.
"""

[[spell]]
id = "pressed-beyond-the-veil-of-time"
name = "Pressed Beyond the Veil of Time"
circle = "solar"
cost = "60m"
keywords = ["Shaping"]
duration = "Indefinite"
target = "Area"
source = "The Books of Sorcery, Vol II"
pages = "93"
effect = "Force target out of present moment"
description = """
This incredibly powerful spell shoves an entire region from Creation into Elsewhere, rendering it immune to invasion as long as it remains there.
The sorcerer may target any region that goes by a single name, such as a manse, city or mountain. Affected Dominions may not exceed Magnitude (Essence – 2).
Before casting the spell, the sorcerer must create a perfect miniature model of the targeted area out of Malfean porcelain (a difficulty 5 Craft [Fire] roll). When the Solar shapes the spell, the entire model must burn to ash in a supernatural flame. The ritual of burning takes one entire night, at the end of which the sorcerer performs the Cast Sorcery action and identical but ghostly flames consume the target area. When the region disappears, the Shaping of this spell replaces it with something natural for that area. Somewhere in this replacement exists a door, gate or path that leads into Elsewhere and the protected area. Wearing a ring or pendant of Malfean porcelain lets one pass through this invisible door, and the sorcerer herself can enter or leave any time.
Without an appropriate token, other people can enter or leave the affected region only when it reappears, once every hundred years, to join with Creation for a single day and night. Anything in the part of Creation where the hidden realm reappears vanishes for the duration and returns afterward, with no one aware that anything happened. The territory that replaces a location affected by this spell always has an uncanny air that subtly discourages renewed settlement, though, so these places seldom gain significant populations—whether it's a hill no one cares to farm or a lot in Nexus that somehow remained vacant for centuries.
Within Elsewhere, the vanished land fades into misty wastes: Anyone who tries to explore beyond the spell's border finds himself turned around and walking back into the territory in five minutes or less. Time also passes more slowly in Elsewhere. Roughly, for every (caster's Essence x 10) days that pass in Creation, one day passes inside.
A region can stay bound in Elsewhere indefinitely, but the spell can be ended in two ways. A Solar who masters the spell may craft another porcelain model of the hidden place and, destroying it in the same ritual, reshape it back into Creation. At the caster's discretion, doing so may shift the land currently in that location into Elsewhere or merge the two locations as if they had grown up that way.
Adamant Countermagic destroys the spell of displacement suddenly and disastrously. The Storyteller rolls one die: Failure means the hidden land is severed from Creation and drifts free in Elsewhere. Success means that instead of being severed from the land that was shaped to replace it, the two exchange places. Two successes means that, in a stroke of luck, the land in Elsewhere and the land that replaced it in Creation merge, settling around and into one another as if the caster had used another casting of the spell to merge them consciously.
"""

[[spell]]
id = "rune-of-singular-hate"
name = "Rune of Singular Hate"
circle = "solar"
cost = "10m"
keywords = []
duration = "Instant (permanent effect)"
target = "Person"
source = "The Books of Sorcery, Vol II"
pages = "95"
effect = "Curse one target with universal hate"
description = """
This curse is the blackest, foulest one that an Exalt can utter. It sears and twists the soul of the target and of the sorcerer who pronounces it. The Rune of Singular Hate is but a single word, a word so sharp-edged and hateful that a tongue can give it voice but once in a lifetime—a spell that a sorcerer may cast only once. As a result, the casting time is near-instantaneous. This spell has special timing rules. The character can cast it as three reflexive Shape Solar Circle Sorcery actions that take 0 ticks.
To speak the rune, the character must be within earshot of the target, and the character must be able to speak. The target need not hear the word, and magical silence is no protection—the target hears the curse in his heart. The Rune of Singular Hate can target only a single individual, but if that individual is less than a Yozi, a Neverborn or an Incarna, the rune sears him.
The player of the spell's target rolls the value of each of his character's Attributes, Virtues and Abilities—including Essence and Willpower—in which he possesses a score, one at a time. The player cannot botch these rolls, and 10s do not count as two successes. For every success the player rolls testing a trait, his character retains one dot of that trait. Dice on which the player does not roll a success represent a dot that is lost, immediately and forever, from that Attribute, Virtue or Ability. The sorcerer pronouncing the rune suffers a lesser curse—she loses one dot in every Attribute, Virtue and Ability in which she possesses a score.
Characters with Intelligence or Wits scores of 0 are reduced to mindless vegetables. Characters with no dots of Perception are deprived of all senses and cut off from the outside world. Characters reduced to Stamina or Essence 0 have their lives snuffed out. Characters without any Willpower become will-less automatons, similar to what remains after the Fair Folk consume a being's hopes and dreams. In all of these cases, the character can no longer spend experience and has no hope of recovery. Characters who lose a more expendable trait can purchase it back from 0 to 1 at a cost of 10 experience points. This spell cannot, however, reduce a Virtue below the minimum required for the Great Curse.
"""

[[spell]]
id = "solar-sanctuary"
name = "Solar Sanctuary"
circle = "solar"
cost = "70m"
keywords = ["Shaping"]
duration = "Permanent"
target = "Area"
source = "The Books of Sorcery, Vol II"
pages = "95"
effect = "Erect a holy solar refuge"
description = """
The caster must create five jeweled orichalcum statues of himself (Resource cost incalculable) and arrange them around the area he wishes to make his sanctuary. On a day when the sun is high in the sky, five people must simultaneously pray to the caster at each statue. The caster himself must cast the spell at the center of the area demarcated by the five statues. With his Cast Sorcery action, shafts of golden light lance upward from the statues, bursting through any obstacle to reach the sky, where they curve downward to converge above the caster. Sunshine lances briefly through the sorcerer, and a faint transparent dome flickers into and out of visibility over the affected area. This area, which may not exceed a radius of (Essence x 1,000) yards, is now the character's sanctuary, almost arbitrarily under his control. The area acquires the following qualities:
• All demesnes become aspected to the character's Essence, and a manse of the appropriate level spontaneously grows from the ground to cap each demesne. As per Raise the Puissant Sanctum, the sorcerer can control each manse's appearance and function. The sorcerer is automatically attuned to all manses, whose hearthstones appear immediately in his possession. Manses whose aspects do not change continue to produce the same hearthstones; the Solar dictates new and changed manses' hearthstones.
"""

[[spell]]
id = "soul-seal"
name = "Soul Seal"
circle = "solar"
cost = "50m"
keywords = []
duration = "Permanent"
target = "Caster or entity"
source = "The Books of Sorcery, Vol II"
pages = "96"
effect = "Trap a target's soul in object"
description = """
There are many dozens of words and symbols for dealing with souls, but most of them strike or draw or arrange the souls only after they have left the body or only as a part of the person. Only the Inimitable Sign of the Self can command a soul from the body and shift it to another location, and each such sign is specific to the individual it will affect. Each must be discovered or researched separately.
Aside from that annoyance, Soul Seal takes one minute to cast (i.e., three separate Speed 20 Shape Solar Circle Sorcery actions before the sorcerer can perform the Cast Sorcery action). Once finished, gray light lances from fourth-dimensional directions through the target, severing the higher soul from the body and propelling it into another vessel. For willing targets, the effect is automatic death of the body but preservation of the mind. Players of unwilling targets roll the characters' (Essence + Willpower) in an opposed roll against the sorcerer's (Willpower + Occult). A successful target suffers one level of aggravated damage and loses one point of Willpower. Weaker targets suffer the worse fate: immediate death of the body. It is a small blessing that a hostile Solar Circle sorcerer cannot destroy the mind with this spell.
Once the soul leaves the body, an arc of the same gray light conveys the soul to a new vessel of the sorcerer's choice. It may be anything within eyesight. Well-intentioned castings of this spell generally place the soul in a prepared vessel, either an automaton designed for it to control or a special container to hold the soul while an appropriate body is constructed. First Age soul-detainment receptacles typically included a magically simulated pocket reality to entertain the soul during its residence. Some such receptacles may still exist. Any souls they contain, however, are probably quite mad after so long in isolation.
Placing the soul in another living creature traps the affected spirit. Sentient targets of the implantation may resist it. Their players roll (Stamina + [Resistance or Integrity]) at a difficulty equal to the caster's Essence. Success means the caster must select a new target. Once the soul comes to rest, it becomes little more than a passenger in another person's body, experiencing most of the person's senses but able to do little. Some learn to communicate with their hosts or assume control in the host's sleep. A strong-willed soul might take command of an animal host's body. Cast into flora or stone, the victim of Soul Seal has only faint awareness of the surroundings. Creatures made host by this spell gain an extended life span about equal to the remainder of the victim's remaining natural years. Over those years, they begin to take on the resident soul's characteristics: A person begins to look like the soul's old body, a dog has remarkably knowing eyes, a stone or tree slowly develops what looks like a face, and so on. Resourceful sorcerers, thaumaturges or gods might eventually be able to release a trapped soul.
"""

[[spell]]
id = "technique-mirror"
name = "Technique Mirror"
circle = "solar"
cost = "50m"
keywords = []
duration = "Scene"
target = "Caster"
source = "The Books of Sorcery, Vol II"
pages = "97"
effect = "Mirror any technique used vs you"
description = """
The powerful techniques of the Exalted take time to learn and even longer to master. Luckily, a skilled sorcerer need never bother. The Solar traces the Sign of Reversal on a small, ordinary mirror with his finger while reciting a palindrome. With a flip of the wrist, he sets it spinning above his head, where it continues to rotate for the rest of the scene. For an instant when the caster completes this spell, and every time it takes effect, the sorcerer appears to be surrounded by several body-sized distorting mirrors.
Each time someone attacks the sorcerer within the scene, a perfect duplicate of the attacker appears without flash or fanfare and uses the same attack on the sorcerer's foe. The mirrored attacker looks and acts just like the original did while attacking, and it uses the same dice pools. Attacks and other dice pools are rolled again. After attacking, the duplicate disappears.
Example: A soldier runs at the Solar sorceress Arianna, who has invoked Technique Mirror, and swings an axe at her. As the soldier attacks, a duplicate of him appears, runs toward the soldier and attacks him with an identical axe.
More dangerously, Crimson Banner Executioner attacks Arianna with his deadly "Last Wall Shatters" Combo. Whether or not he succeeds, a copy of this great Sidereal warrior appears and invokes the same Combo against the original. The duplicate uses the same attack pool and all the same Charm effects.
When the duplicate disappears, any Charm or attack effects cease if they require the attacker's continued presence. A warrior cannot be grappled if there is no body to grapple him. Victims of a grapple are forced into a single Inactive action before regaining control of their facilities. Destroying the mirror that spins above the sorcerer ends the spell, but such attacks are defended by the sorcerer's normal DVs and mirrored by the spell. The spell incidentally grants the mirror 10L/14B soak and 20 health levels.
"""

[[spell]]
id = "total-annihilation"
name = "Total Annihilation"
circle = "solar"
cost = "65m"
keywords = ["Obvious"]
duration = "Instant"
target = "Area"
source = "The Books of Sorcery, Vol II"
pages = "97"
effect = "Annihilate target utterly"
description = """
Every occult master knows about Ligier the Green Sun, the defining soul of the Demon Prince Malfeas. Ligier once had another name, however, when Malfeas was a Primordial instead of the demons' home and prison. Circling her hands before her chest, the sorcerer closes her eyes and builds herself into a rage. As she whispers the lost, former name of Ligier, a vivid green spark erupts from her heart to collect her Essence into a roiling, fist-sized orb of emerald fire. The sorcerer flings the orb into the air and directs it with her will toward any target within 200 yards. The sphere constitutes a perfect attack unless opposed by magic-enhanced dodges or parries, in which case the sorcerer rolls (Dexterity + [Occult or Thrown]) to hit. If parried, the orb is not destroyed, but is deflected 1,000 yards away in a random direction—from then on, it can't be steered. Attempting to parry the orb with a mundane weapon merely detonates it at once.
When the orb strikes, it explodes into a column of bright green light 50 yards wide and five miles high. It deals 50 levels of lethal damage to everything within that area. Then, for (Essence x 5) ticks, the column of emerald light sweeps outward at a rate of 10 yards per tick, inflicting another 25 levels of lethal damage per action to everyone caught within in it on that action. Creatures near the explosion can try to outrun the all-destroying glare—this had best include the caster herself, since she is not immune to its power. Once the orb has exploded, the outpouring light cannot be parried and may only be dodged or soaked by means of perfect defenses. The devastation is complete: That which can burn, burns; that which can be broken, breaks. Behind it, the light leaves nothing but a scorched, cracked wasteland. In the thunder of the orb's detonation and the crash and crackle of devastation, one might hear the awful, vengeful laughter of a defeated god, laughing that his conquerors now turn his power against Creation.
Total Annihilation may be countered until the moment the sorcerer hurls the orb. After that, Adamant Countermagic can only parry it.
"""

[[spell]]
id = "unity-of-the-closed-fist"
name = "Unity of the Closed Fist"
circle = "solar"
cost = "40m"
keywords = ["Obvious"]
duration = "Scene"
target = "Caster and creatures"
source = "The Books of Sorcery, Vol II"
pages = "98"
effect = "Bind army into a unified weapon"
description = """
As this spell is cast, those affected by it stretch and blur into the sorcerer's body, which shifts and shapes itself into a massive composite being. The anima of each entity included in the casting (if they have one) flares in full, iconic glory. No one can be included in this amalgam identity against his will. If the sorcerer tries to include someone who refuses to join, the spell fails. The composite being has the following qualities:
• Height equal to the tallest member of the composite, plus 25 percent for each additional participant.
• Strength, Dexterity and Stamina equal the highest possessed by any member of the composite, plus one dot for each additional character.
• Health levels equal to the participant with the greatest number, plus one -1 and two -2 levels for each additional character involved. The composite being always forms undamaged.
• Personal and peripheral Essence pools equal to the sums of these pools for all the participating individuals, and the composite entity can use all individuals' Charms, Combos and anima effects. The Dragon-Blooded ability to use reflexive Charms without counting them as the Charm-per-action applies only to Dragon-Blooded reflexive Charms. Adjudicate other abilities specific to particular Exalt types similarly.
• Other Attributes and Abilities equal to the highest held by any member of the composite, and the same with Virtues, effective permanent Essence and permanent and temporary Willpower.
• Motivations and Intimacies equal to the sum of the individual participants' Motivations and Intimacies. This blending occasionally causes some problems.
• A composite hearthstone, which allows the merged entity to use the powers of all hearthstones borne by the individual members.
• Composite armament. The weapon's Accuracy equals the highest of all weapons wielded by the individual members, as do its Damage, Defense and Rate equal the highest of those values. Add the composite's Valor to the weapon's Damage. Its Speed is the lowest of all such weapons. Armor confers bashing soak, lethal soak and Hardness equal to the highest such values among any individual's armor; add the composite's Willpower to both soak values.
The spell ends at the end of the scene or when the composite's incapacitated health level is filled with lethal or aggravated damage. If the composite is "killed," it explodes and ejects the individuals who comprised it with only one health level remaining each. Otherwise, all participants are as healthy as they were when they entered the amalgam. Spent Essence is taken equally from the pools of all participants.
Because of the protection their tattoos afford them, most Lunar Exalted cannot be a part of this spell. Attempting to include a tattooed Lunar in this spell causes it to fail.
"""

[[spell]]
id = "winds-of-confusion"
name = "Winds of Confusion"
circle = "solar"
cost = "45m"
keywords = ["Obvious"]
duration = "Instant"
target = "Area"
source = "The Books of Sorcery, Vol II"
pages = "99"
effect = "Confuse all in area (large)"
description = """
As the sorcerer shapes this spell and invokes the Maiden of Endings, her anima darkens until she looks like a deep purple silhouette backed by waning light. As she releases the spell, onyx winds sweep from behind her to howl across the landscape. They fill a corridor one mile across, five miles long and 20 yards high. Natural cover does nothing to stop the dark wind. Only sheltering entirely behind one of the magical materials prevents a creature from suffering its effects. The dark wind drains one dot of Intelligence and one dot of permanent Willpower every action (or five ticks) unless a victim's player succeeds at an (Intelligence + Integrity) roll at a difficulty equal to the caster's Essence. Naturally, the sorcerer is unaffected. People with Intelligence 0 stand or sit like zombies unless otherwise motivated. Each trait returns at a rate of one dot per hour. The curse fogs memories of whatever happens while a victim is affected, and anyone drained to Intelligence or Willpower 0 remembers only a vague blur.
"""

[[spell]]
id = "wrath-of-the-five-elements"
name = "Wrath of the Five Elements"
circle = "solar"
cost = "45m"
keywords = []
duration = "Instant"
target = "One creature"
source = "The Books of Sorcery, Vol II"
pages = "99"
effect = "All five elements strike target"
description = """
As the sorcerer's anima builds, he gestures and calls the names of the Elemental Dragons. Each dragon's sigil appears, the set forming a pentagram around him. The sorcerer names the target of the spell while holding three arcane links in his upraised hand—a hair, a swatch of clothing and soil from the target's footprint, perhaps. The links can vary (including the presence of friends or relatives), but at least one must come from the victim's body. At last, the sorcerer speaks the Word by which the Unconquered Sun announced his defiance of his Primordial creators. The sigils flare as the Elemental Dragons each vent their wrath on the spell's target, no matter where in Creation she is.
Once the spell is cast, the victim suffers five deadly attacks, one every five ticks. The sorcerer sets their order or lets them happen at random. Each attack requires a separate (Intelligence + Occult) roll to target, with the sorcerer's Essence added as automatic successes, against a difficulty equal to the target's Dodge MDV. A perfect dodge Charm also lets the target evade one attack per action. Treat each attack as environmental damage (15L, Trauma 4). No conceivable external defenses apply, because the attack comes from within the victim's own body. The victim applies nothing but her innate soak from Stamina or Charms.
• The wrath of the Dragon of Air takes the form of cold. The victim's skin blackens with frostbite as he feels the icy winds of the farthest North rush through his flesh.
• The wrath of the Dragon of Earth turns the victim's bones to stone, while razor-sharp crystals grow from them to slice his flesh.
• The wrath of the Dragon of Fire burns the victim from the inside out.
• The wrath of the Dragon of Water pours surging sea water into the target's blood and lungs.
• The wrath of the Dragon of Wood sets lush, flowering vines sprouting through the victim's skin, consuming his flesh as they grow. If this attack fails to kill the target, the vines wither and drop away on the next action.
No single attack is likely to kill a victim, but five in a row present grave danger to anyone who lacks powerful protective Charms. When an attack kills a victim, the elemental effect completely consumes his body to leave frozen shards, a statue of bloodstained crystal, smoldering ash, a pool of mingled blood and water or a tangle of vines. None of the attacks inflict the slightest harm on anyone nearby, even someone who hugs the victim. The wrath of the Elemental Dragons is most selective.
Finally, a person slain by Wrath of the Five Elements is not completely dead. She immediately appears before the sorcerer, transformed into an elemental of the element that killed her, already bound to serve the sorcerer for a year and a day. The elemental is of a sort that has the same permanent Essence as the victim (so un-Exalted mortals become very minor spirits indeed).
"""

[[spell]]
id = "banish-ghost"
name = "Banish Ghost"
circle = "shadowlands"
cost = "12+m"
keywords = []
duration = "Three days"
target = "One ghost"
source = "The Books of Sorcery, Vol II"
pages = "121-124"
effect = "Banish a ghost from Creation"
description = """
The ease of casting this spell displays the sheer power an experienced necromancer can wield over
inhabitants of the Underworld. Banish Ghost has special timing rules. The character can cast it as a
reflexive Shape Shadowlands Circle Necromancy action that takes 0 ticks. Once the spell is cast, the
necromancer and targeted ghost enter a battle of wills. Their players each roll (Essence + Willpower) as a
Speed 3, -1 DV action. This resisted roll must continue until one accumulates three more successes than
the other. The ghost suffers a -1 internal penalty for every three additional motes the necromancer spends
on the spell. If the ghost wins, she ignores the banishment and the necromancer may not try to banish her
again for three days. Should the necromancer win, he may inflict one of the following penalties:
• Banish the ghost from Creation to the analogous point in the Underworld. The ghost may not return to
Creation for three days.
• Banish the ghost into her tomb, corpse or place of death for three days. She may not leave the confines
of her tomb or stray farther than five yards from her body or place of death.
• Banish the ghost from the character's presence for three days. If the necromancer sees the ghost before
the spell's effect ends, the ghost suffers one unsoakable level of bashing damage each action until she
escapes his gaze.
Cruel necromantic masters banish a loyal servant from sight while still expecting flawless service.
"""

[[spell]]
id = "black-candle-visage"
name = "Black Candle Visage"
circle = "shadowlands"
cost = "18m"
keywords = []
duration = "Up to one week (resisted) or indefinite (unresisted)"
target = "One ghost"
source = "The Books of Sorcery, Vol II"
pages = "124-125"
effect = "Conceal face in black candle smoke"
description = """
The character spills drops of blood from both hands, and her Essence spins it into a cat's cradle of
crimson strands. Pulling and tugging at any ghost in line of sight, the character shapes her target's corpus
like an artist shapes wax. Alterations require a (Dexterity + Craft [Moliation]) roll. The necromancer can
cause the following effects, which consume a number of successes as noted:
• Superficial Change to Appearance: One success. The ghost can look like a specific individual or just look
different. Add a number of dice equal to the character's Craft (Moliation) score to the relevant disguise roll.
• Terrifying: Two successes. Players of any characters who see the ghost must attempt Valor rolls.
Failure indicates that the character cannot face the ghost directly. Extras flee, and the ghost enjoys a +2
DV bonus against those who stay and fight.
• Increased/Decreased Appearance: One dot per success. The character cannot increase Appearance beyond
his (Craft [Moliation] + 2) or reduce it below 0.
• Disgustingly Hideous: One success. The player of anyone who sees the ghost attempts a Willpower roll.
Failure indicates that disgust overwhelms the character, placing a -1 external penalty to all physical actions.
• Natural Weapons: One success per weapon. The ghost inflicts lethal damage unarmed and gains either
claws or fangs. Claws: Speed 5, Accuracy +1, Damage +2L, Defense +0, Rate 2. Bite: Speed 6, Accuracy +0,
Damage +4L, Defense -2, Rate 2.
• Thickened Skin: +1L/2B soak per success. The character may also reverse this benefit, spending one success
to reduce the ghost's soak due to Stamina to 0.
• Ruined Form: One success per dot lost. For each success spent thus, the necromancer reduces the ghost's
Strength or Dexterity by one dot as she mangles its form.
The character's player makes a resisted roll of (Essence + Willpower) against the ghost's Conviction.
For each net success, the necromancer binds the ghost into its altered form for as long as a week. Should
the ghost's player win or tie the roll, the ghost snaps back into its normal form on its next action. Ghosts
who choose not to resist or whose players botch the roll may be locked into the form for as long as the
necromancer desires. The corpus of a ghost affected by this spell takes on the slick, glossy look of melted
and remolded wax until it regains its normal form. Ghosts familiar with necromancy might recognize the effect.
"""

[[spell]]
id = "bless-the-rapine-soul"
name = "Bless the Rapine Soul"
circle = "shadowlands"
cost = "16m (or 10m, 1lhl for the linked variant)"
keywords = []
duration = "One month (or indefinite for linked variant)"
target = "One living creature"
source = "The Books of Sorcery, Vol II"
pages = "124-125"
effect = "Bless a sinful soul with power"
description = """
Ghosts who enjoy possessing the bodies of the living love necromancers with this spell. Some even offer
favors or long-term service in exchange for a single casting. Bless the Rapine Soul scourges a living target's
soul, making the victim more likely to submit to another will's driving his body. When a ghost targets the
spell's victim for possession, the player's roll—generally (Dexterity + Compassion) at a difficulty of (target's
Essence x 2)—gains a number of extra successes equal to the necromancer's Essence. Also, double the
possession's duration. Gods and other spirits gain the same benefits.
After a full month without being possessed by any creature, the victim's spiritual resistance returns to normal.
By casting this spell as a one-hour ritual on a living creature that is already possessed by a ghost, the
necromancer can instead create a link between the living and dead individuals. The spell costs only 10 motes,
and the possessing ghost must commit three motes to the effect. Thereafter, without duration, that ghost alone
gains the benefit of Bless the Rapine Soul. Breaking the bond, either through countermagic or the living
target's death, shocks the ghost, who loses a dot of permanent Willpower. Using the spell in this way is often
called Consorting with Devils, but it's the same spell.
"""

[[spell]]
id = "blessed-dead-fools"
name = "Blessed Dead Fools"
circle = "shadowlands"
cost = "13m"
keywords = []
duration = "Until the event begins"
target = "Up to six ghosts"
source = "The Books of Sorcery, Vol II"
pages = "124-125"
effect = "Conjure fool-ghosts as servitors"
description = """
Spending 10 minutes, the caster sings a small pavilion and flag of pale blue flame into existence around her.
Visible for leagues in the Underworld, it tugs at ghosts who see it. Any ghost who steps into the tent
understands the bargain: The spell grants a willing ghost Performance 5 in exchange for the commitment to
appear and perform at a certain place and time. Necromancers use this spell to "hire" trustworthy and skilled
performers for their parties and banquets. Ghosts who accept are bound not to speak of the event or anything
they learn there. When the sixth ghost agrees to the deal or the event begins, whichever comes first, the
blue-flame pavilion gutters out.
Even with the bindings, the ghost gets a bargain. Master necromancers' parties are grandiose affairs, and
a ghost can meet prominent mask-makers and dreamstone merchants. Additionally, the music a ghost plays
at the party is as real and vivid as anything the ghost heard while alive—the dead could even find such a
rare sensation addictive.
"""

