[[spell]]
id = "assassins-fatal-touch"
name = "Assassin's Fatal Touch"
circle = "terrestrial"
cost = "20m"
keywords = ["Poison", "Touch"]
duration = "One day (after casting)"
target = "Touched creature"
source = "The Books of Sorcery, Vol II"
pages = "38-39"
effect = "Touched victim takes 5+ agg dmg"
description = """
The sorcerer renders her touch deadly to one selected victim. To cast this spell, the sorcerer must first make skin contact with either her intended victim or some small object the victim touched in the last hour, such as an article of clothing or jewelry. Shaping this spell is a dramatic action that takes 15 minutes. After the spell is completed, its effects linger on the sorcerer for a full day.

The sorcerer thereafter must touch her victim. If successful, her player rolls (Intelligence + Medicine). Ten ticks later, the victim suffers (5 + successes) levels of aggravated damage. Mortal targets not instantly killed are knocked unconscious for (6 – target's Stamina) miscellaneous actions. This is a Poison effect and a Touch effect. The spell requires a light touch, so it cannot enhance the damage of a regular Martial Arts attack.

Mortals suffer this damage automatically, but an Essence-user can resist. Roll an Essence-using victim's Essence trait when he's subject to Assassin's Fatal Touch. Success indicates he's fought it off. Even if the roll fails, though, the target subtracts his innate lethal soak from the damage inflicted. The spell has no effect against the dead, Abyssals or automata.

With a normal stealth attempt (see Exalted, p. 131), the sorcerer may conceal the eponymous fatal touch so it looks accidental. Two extra successes hide the touch entirely. Either way, the spell leaves no physical evidence. The victim simply drops dead or unconscious. It leaves metaphysical traces, however, which medical thaumaturgy can detect. Diagnosing a victim of Assassin's Fatal Touch calls for a (Perception + Medicine) roll, but the investigator suffers an external penalty equal to (5 – her Occult score).

The sorcerer can cast Assassin's Fatal Touch against only one creature at a time. If she casts the spell again before touching her first target, the first casting is lost.
"""

[[spell]]
id = "becoming-the-wood-friend"
name = "Becoming the Wood Friend"
circle = "terrestrial"
cost = "14m"
keywords = []
duration = "Until next sleep"
target = "Caster"
source = "The Books of Sorcery, Vol II"
pages = "38"
effect = "Move untracked through plants"
description = """
With a swirl of green mist, the sorcerer draws Wood-aspected Essence from her environment. Her skin becomes greenish, her hair like leaves. Until the next time she sleeps, the caster moves unhindered through dense foliage. Her actions take no environmental penalties due to plant life and are not limited by her Athletics when dealing with unstable footing caused by vegetation (see Exalted, p. 155). Indeed, her player adds the character's Essence to her dice pools for moving through any plant-based terrain, from forest canopies to peat bogs. For movement and fatigue, treat heavy vegetation as open terrain.

Mundane tracking cannot follow the sorcerer through vegetation, and she may oppose supernatural tracking. Supernatural trackers have a +2 difficulty penalty to follow the sorcerer in such conditions. This penalty applies even to scent-based tracking, for her scent changes to match the surrounding plants. Becoming the Wood Friend renders useless any other Charm or effect that makes the caster harder to track, however.

Intelligent plants regard the character more favorably, though they know she is not a plant. This empathic bond works both ways, however. While this spell is active, plants are considered the same as human beings for purposes of the Compassion Virtue. If the sorcerer sees people harming plants, she feels a powerful urge to stop them. Attempting to harm a plant herself requires a successful Willpower roll. If this roll succeeds, the act severs the empathic bond, and the sorcerer cannot cast the spell on herself again for three full days. Gathering fruits, nuts or pruning dead branches for campfires is not considered harmful.
"""

[[spell]]
id = "blood-lash"
name = "Blood Lash"
circle = "terrestrial"
cost = "10m, 1lhl"
keywords = []
duration = "One scene"
target = "Caster"
source = "The Books of Sorcery, Vol II"
pages = "39-40"
effect = "Conjure a whip of blood (lethal)"
description = """
Most sorcerers consider the Blood Lash a weapon of last resort, for the spell can be cast only if the sorcerer bears a bleeding wound—at least one unbound, unhealed level of lethal damage. The character may wound himself if he must (this self-inflicted damage does not trigger reflexive Charms of defense). Blood from the sorcerer's wounds surges outward, forming a lash of blood. This effect inflicts another health level of lethal damage, which cannot be healed until the caster ends the spell or the spell's scene-long duration expires.

This whip of blood can make Melee or Martial Arts attacks. Its reach is a number of yards equal to the sorcerer's Willpower. It inflicts dice of lethal damage equal to (caster's Strength + Essence) + the number of lethal health levels the caster currently suffers. Its full traits are as follows:

Speed 5, Accuracy +1, Damage (Varies)L, Defense +1, Rate 2, Tags M, N, R
"""

[[spell]]
id = "burning-eyes-of-the-offender"
name = "Burning Eyes of the Offender"
circle = "terrestrial"
cost = "10m"
keywords = ["Obvious"]
duration = "Until dispelled"
target = "Caster"
source = "The Books of Sorcery, Vol II"
pages = "39"
effect = "Foes attacking you take -Ess to rolls"
description = """
The sorcerer's anima ignites in a colorless fire that refracts and magnifies the hues of her Exaltation. Sorcerers without animas (such as God-Bloods) radiate a blank, white brilliance. All who gaze upon the sorcerer weep uncontrollably, their eyes stung by her blazing halo.

This spell imposes an internal penalty equal to the caster's Essence against all attacks against her that originate within 100 yards, whether the sorcerer's DV applies to such an attack or not. It does not affect allies standing next to her. Opponents who are blind or who avert their eyes do not suffer this penalty (but see Exalted, p. 152, for info on attacking blind). Moreover, combatants who close their eyes run the risk of incoming attacks being considered unexpected attacks (see Exalted, p. 155). The (Perception + Awareness) roll to avoid unexpected attacks receives the normal -4 penalty for being blind, of course.

The sorcerer may dispel Burning Eyes of the Offender as a reflexive action.
"""

[[spell]]
id = "calling-the-stalwart-servitor"
name = "Calling the Stalwart Servitor"
circle = "terrestrial"
cost = "10m"
keywords = []
duration = "Essence hours"
target = "Summoned servitor"
source = "The Books of Sorcery, Vol II"
pages = "39"
effect = "Summon a clay servitor laborer"
description = """
Reaching into the ground, the sorcerer pulls out a servitor of crude clay, five feet tall and nearly as wide, and two feet thick at the chest. If no soil is nearby, the Stalwart Servitor emerges from whatever surface the sorcerer stands upon, and from thin air if there is no surface nearby at all. The servitor can lift up to 10 tons, it obeys no one but the caster, and it can dig holes, transport materials, build crude but sturdy structures and perform other simple tasks on command. If it is not banished by other means, the servitor lasts a number of hours equal to the caster's Essence before vanishing. It does not fight or even try to defend itself.

Stalwart Servitor stats:
Motivation: To serve the sorcerer.
Attributes: Strength 40, Dexterity 4, Stamina 5; Charisma 1, Manipulation 1, Appearance 1; Perception 1, Intelligence 1, Wits 2
Virtues: Automaton: Never fails Valor checks, never makes others.
Abilities: Craft (Earth) 1
Willpower: 10 (0 against caster)
Essence: 1
Other Notes: Will not participate in combat, and vanishes immediately if struck with hostile intent.
"""

[[spell]]
id = "calling-the-winds-kiss"
name = "Calling the Wind's Kiss"
circle = "terrestrial"
cost = "10m + 2m per additional hour (max. 30m expended)"
keywords = ["Obvious"]
duration = "Essence hours (extendable)"
target = "One sailing vessel"
source = "The Books of Sorcery, Vol II"
pages = "40-41"
effect = "Speed/slow a ship for hours"
description = """
The sorcerer completes this spell with the Azure Sign, a glyph that epitomizes the Element of Air. He fills a target ship's sails with a powerful wind sufficient to drive it forward at its maximum speed without sacrificing handling or safety, and also ignoring currents or small storms. He may target any sail-powered vessel (including Haslanti air boats) he can see, up to (Essence x 3) miles away. The sorcerer can always cancel this spell as a reflexive action.

Calling the Wind's Kiss remains in effect for a number of hours equal to the caster's Essence, plus one additional hour for every two additional motes spent. Here, the sorcerer has a choice. He may expend the Essence at the casting and let the spell run by itself. To Essence sight and other magical senses, the additional motes manifest as the Azure Sign glowing on the mainsail. Alternatively, the sorcerer can actively maintain the spell. The character must remain on deck for the spell's duration. Every hour, he traces the Azure Sign again and channels two more motes into the spell. He can perform no other actions, not even meditate. A sorcerer cannot start by investing Essence, then change his mind and add further motes to the spell.

If cast to a ship's benefit, Calling the Wind's Kiss appears as a funnel of blue Essence behind the sails, though on a sunny day it blends with the sky. When using the Complex Travel rules (see Exalted, p. 266), treat difficult terrain (such as seasonal squalls or shifting crosswinds) as open, and the make haste bonus applies for the spell's duration. Heavy storms, unusually strong (or supernatural) currents and obstacles still make sailing difficult, but the spell grants a +3 bonus to all Sail checks to cope with the hazards.

If the spell is cast to oppose a ship, a gray-tinged funnel of Essence swirls in front of the sails, though it blends in with stormy skies. The spell reduces the ship's speed. When using the Complex Travel rules, the terrain type is worsened by one category (i.e., from open terrain to difficult, or from difficult terrain to extreme), and the ship is considered substandard for the duration of the spell. The spell inflicts a -3 internal penalty to all Sail checks to retain control of the ship.

Countermagic or casting an opposing Calling the Wind's Kiss destroys the spell. Additionally, an air elemental or other air spirit whose Essence exceeds the sorcerer's can usurp control of the spell through a successful Willpower roll (difficulty equal to the sorcerer's Essence). If the spirit succeeds, it can let the spell operate as it was, negate its effects or even reverse them. The spirit cannot spend Essence to extend the spell's duration.
"""

[[spell]]
id = "cirrus-skiff"
name = "Cirrus Skiff"
circle = "terrestrial"
cost = "15m"
keywords = []
duration = "Until sorcerer debarks"
target = "Summoned cloud"
source = "The Books of Sorcery, Vol II"
pages = "40-41"
effect = "Conjure a personal cloud-skiff"
description = """
The sorcerer whistles and calls from the sky a white cloud just large enough to carry her and one human-sized passenger. The cloud descends and waits patiently for the sorcerer to step onto it, then it ascends into the sky and travels at the sorcerer's direction. During the scene in which the cirrus skiff is called, the sorcerer may enter and debark the vehicle at will. After the end of the scene, the cloud vanishes back into the sky the moment she steps off, pausing only to dump her baggage or traveling companion beside her.

Some sorcerers prefer the cirrus skiff to the azure chariot (see p. 41) for long journeys, as it allows continuous travel for as long as the sorcerer remains awake and vigilant, but others prefer the azure chariot's sturdier construction and striking appearance. A few sorcerers, proficient at archery, use the cirrus skiff as a mobile archery platform, as it provides perfectly stable footing and does not obscure the sorcerer's view of her surroundings.

Cirrus Skiff stats:
Speed: 45/90 mph
Maneuverability: 4R
Endurance: Until the sorcerer debarks
Crew: 1/1 (Only the sorcerer)
Cargo: 100 lbs. x caster's permanent Essence, or 1 passenger per two dots of Essence
Armor: 2L/5B
Health Levels: Ux10/Mx2/Cx1/Ix1/D
Weapons: None
"""

[[spell]]
id = "coin-of-distant-vision"
name = "Coin of Distant Vision"
circle = "terrestrial"
cost = "10m"
keywords = []
duration = "Indefinite (until destroyed)"
target = "Black ceramic coin"
source = "The Books of Sorcery, Vol II"
pages = "40"
effect = "Scry from a placed ceramic coin"
description = """
The sorcerer spits into her palm and conjures into her hand a black ceramic coin inscribed with arcane sigils. She can place the coin where she likes. Thereafter, she can concentrate and perform a miscellaneous action to project her consciousness to the coin (Speed 5, DV reduced to 0 for the duration of the projection). She sees, hears and smells everything as if she stood at the coin's location. If the coin is in a pocket, pouch or container with at least one opening, she can sense the environment both inside and outside that container. She senses only the inside of a container that's completely enclosed, such as a strongbox. As they occupy the coin's vicinity, her senses are identical to her senses in her body, and she may benefit normally from all sense-enhancing Charms. Because she cannot project her sense of touch, she knows instantly if her body is shaken or injured.

The sorcerer instinctively knows the distance of her senses from her body and the direction to the coin. She can find the coin just by traveling toward it, concentrating periodically to discover if it has moved.

A sorcerer may have only one coin of distant vision at a time. To create a new one, she must first concentrate a moment to reduce her existing coin to dust. Doing so is a miscellaneous action identical to projecting her senses, but it costs five motes of Essence. The coin of distant vision functions as an arcane link to the sorcerer if someone discovers it, but the dust does not.
"""

[[spell]]
id = "commanding-presence-of-fire"
name = "Commanding Presence of Fire"
circle = "terrestrial"
cost = "10m"
keywords = ["Obvious"]
duration = "Up to one scene"
target = "Fiery projection"
source = "The Books of Sorcery, Vol II"
pages = "41-42"
effect = "Huge fiery projection of self"
description = """
From the fiery valor within her, the sorcerer creates above herself a huge projection in her own image, dozens of feet tall and wreathed in flame, high enough to be seen for seven miles. Speaking through the image, the sorcerer's voice is amplified so all who see her, even in the clamor of a storm or a battlefield, can hear her. The projection lasts one minute (or one long tick) at minimum, and up to one scene. For every additional minute or long tick the sorcerer wishes the projection to last, her player must succeed at a reflexive Stamina roll. Failure ends the spell.

Any social attacks made through the commanding presence of fire gain a dice bonus equal to the sorcerer's Occult rating. Additionally, a sorcerer maintaining this spell counts as two relays in mass combat, or three if the sorcerer serves fully in the position of relay rather than the position of sorcerer.
"""

[[spell]]
id = "commanding-the-beasts"
name = "Commanding the Beasts"
circle = "terrestrial"
cost = "10m"
keywords = []
duration = "One scene"
target = "Animals"
source = "The Books of Sorcery, Vol II"
pages = "41-42"
effect = "Charm/command natural animals"
description = """
Glittering streamers from the sorcerer's anima wrap around target animals, carrying sorceries of peace, obedience and understanding. This spell affects only normal animals of Intelligence 1. It can affect a number of animals equal to (caster's Essence x 2), all within 20 yards of the caster. It does not affect Wyld-tainted or otherwise supernatural creatures.

For the rest of the scene, the affected animals obey the sorcerer's commands. The magic enables them able to understand complex commands. Spellbound animals have a control rating of 0 (see Exalted, p. 154) and they never spend Willpower to resist the sorcerer's commands. If the sorcerer successfully uses social combat to build Intimacies, the animals remain tame and obedient for the sorcerer even after the spell ends, but at this point, they are simply tamed animals without any supernatural understanding of the sorcerer's commands. Anyone training the tamed animals gains a +1 bonus to the Survival roll to do so; the sorcerer himself gains a +3 bonus.

When other characters interact with the spellbound animals, the difficulty to do so increases by an amount equal to the caster's Essence. The animals become testy around other people and are not interested in doing what anyone else wants. Charms and sorcery, however, work normally on spellbound animals.

Commanding the Beasts can be used in war. If the sorcerer increases its shaping time to long ticks, the spell can affect a unit of animals equal in Magnitude to her Essence. She may choose to aid her allies, reducing the control rating of their animals by a number equal to her permanent Essence. Alternatively, she may hinder the enemy by increasing the control rating of their animals by a number equal to her permanent Essence (to a maximum of 6). Doing so can severely disrupt cavalry and other forces that rely on animals.
"""

[[spell]]
id = "conjuring-the-azure-chariot"
name = "Conjuring the Azure Chariot"
circle = "terrestrial"
cost = "15m"
keywords = ["Obvious"]
duration = "Until sunset or destination reached"
target = "Caster"
source = "The Books of Sorcery, Vol II"
pages = "89-90"
effect = "Summon a flying chariot for daylight"
description = """
The sorcerer's words of power create a billowing fog bank. Four cerulean horses coalesce from the mist, pulling a coach the hue of the noonday sky behind them. The horses snort steam and trail lightning sparks from their manes. Their hooves freeze the ground where they touch.

When the sorcerer takes the carriage's reins, the steeds launch themselves into the air, pulling the chariot behind them. Once the sorcerer tells the horses his destination, they circle once to get their bearings as they rise and then gallop away, leaving a trail of fog in their wake.

The azure chariot cannot be slowed or turned aside from its designated course. Attackers who cannot match the coach's speed may attack once as it passes (though this attack may take the form of a flurry), and the carriage soon outpaces even the longest-ranged weapons. Passengers in the azure chariot receive 90% cover from attacks. It also protects occupants and cargo from most ranges of temperature or weather, though extreme conditions such as hurricanes or blizzards still endanger both carriage and occupants.

This spell can be cast only during daylight hours. The spell lasts until the coach reaches its destination, the sorcerer lands it prematurely, someone dispels it with countermagic, or sunset. As the sun nears the horizon, the carriage slowly changes hue to match the twilight sky. The horses also gallop lower until the azure chariot lands, and disappears with the last sliver of the sun.

Azure Chariot stats:
Speed: 100/200 mph
Maneuverability: 3R
Endurance: Until sunset
Crew: Only the sorcerer
Cargo: (Essence x 200) lbs., or 4 passengers
Armor: 25L/35B
Health Levels: Ux15/Mx5/Cx3/Ix2/D
Weapons: None
"""

[[spell]]
id = "corrupted-words"
name = "Corrupted Words"
circle = "terrestrial"
cost = "10m"
keywords = []
duration = "Until dispelled or caster dies"
target = "Speaking creature"
source = "The Books of Sorcery, Vol II"
pages = "41"
effect = "Curse silence on a chosen topic"
description = """
This spell helps sorcerers keep their secrets. It also enforces oaths of silence or simply prevents someone from speaking about a given subject. The subject may be as specific as "Mnemon's deal with the Mask of Winters," or as broad as "Solars in Chiaroscuro." It affects any one person the sorcerer can see within 10 yards.

The sorcerer evokes a seething, bilious green ball between his hands. He names the subject matter about which the target cannot speak and releases the ball. The vile green energy rushes toward and into the mouth of the target and down her throat, dissolving into a ward within the target's body. Only Charms or other effects that grant perfect dodges or parries can block the curse. The player of an Essence-channeling target is permitted a (Stamina + Resistance) roll, however, at a difficulty equal to the caster's Occult Ability. Success indicates that the target resists the spell, which the sorcerer knows at once.

Subjects who even think of violating the binding feel nausea. So do subjects who try to devise ways to get past the limitations of the spell, such as by writing or using sign language. Victims who ignore the warning and go ahead with their communication—be it verbal, written, silent or even telepathic—feel wracking pain and vomit dozens of fat, white maggots. The target cannot take any non-reflexive actions that action. He's in too much pain to concentrate on anything but throwing up.

This spell can provoke inconvenient reactions, from uncomprehending fear to immediate knowledge that someone doesn't want the victim to speak of something. The curse lasts until it is broken by countermagic, until the caster dies, or until the caster deliberately ends the spell by reaching into the victim's mouth and speaking the last word of the spell backward. The victim violently disgorges the spell, which manifests as a slimy, egg-like sac filled with tiny, squirming larvae.
"""

[[spell]]
id = "curse-of-slavish-humility"
name = "Curse of Slavish Humility"
circle = "terrestrial"
cost = "10m"
keywords = ["Compulsion"]
duration = "One scene"
target = "One creature within 10 yards"
source = "The Books of Sorcery, Vol II"
pages = "42-43"
effect = "Compel target to worship a chosen"
description = """
The sorcerer ties knots of scarlet Essence as he exhorts the victim to worship one target, which may be the caster himself, another being present or even an object. With the final word, the spell's Essence creeps forward in scintillating ruby tendrils that force the target to his knees.

The spell creates an unnatural mental influence, a Compulsion for the victim to abase himself and worship the target designated by the sorcerer. The sorcerer's player rolls (Manipulation + Occult) as a social attack, with automatic successes equal to his Essence. If the attack overcomes the target's Dodge MDV, the victim feels the Compulsion effect for the rest of the scene.

The victim can resist the spell for a single action by spending a point of Willpower. The spell does not prevent combat, however. The victim may still attack the target of his devotion, though he cringes and begs forgiveness for doing so. All such attacks, whether physical or social, suffer a -3 external penalty due to hesitation and remorse—unless the victim has spent Willpower to act normally. This penalty may also be negated by somehow working the spell-induced groveling into an appropriate stunt.
"""

[[spell]]
id = "curtain-of-quartz"
name = "Curtain of Quartz"
circle = "terrestrial"
cost = "10m"
keywords = ["Obvious"]
duration = "One scene"
target = "Creatures near caster"
source = "The Books of Sorcery, Vol II"
pages = "43-44"
effect = "Glittering shards -2 to nearby foes"
description = """
Essence and the Crystal Rune evoke a globe of shimmering quartz fragments around the sorcerer. These crystal shards float about the sorcerer for the rest of the scene, capturing light and reflecting it back as dazzling and distracting beams and spots. All characters within a three-yard radius of the sorcerer (but not the sorcerer herself) suffer a -2 external penalty to their DVs and to all rolls. The effects of the Curtain of Quartz do not affect characters who cannot see.

Immaterial ranged attacks against the sorcerer (such as Phantom Arrow Technique) suffer an external penalty equal to the caster's permanent Essence. The quartz fragments bleed off the attacks' ambient Essence as beautiful light displays.
"""

[[spell]]
id = "dance-of-the-smoke-cobras"
name = "Dance of the Smoke Cobras"
circle = "terrestrial"
cost = "15m"
keywords = ["Obvious", "Poison"]
duration = "One scene"
target = "One creature within 30 yards"
source = "The Books of Sorcery, Vol II"
pages = "43-44"
effect = "Five poisonous smoke cobras attack"
description = """
Dark, fiery Essence shatters the ground at the target's feet in a star pattern. Streams of thick, gray smoke rise from the points of this star and coalesce into five tall cobras. Poison drips from the fangs to char and blacken the ground.

These serpentine automata of smoke, Essence and fire immediately strike at the target. Because of their placement around the target, these cobras are assumed to gain all the benefits described for multiple attackers who have closed around an opponent (see Exalted, p. 155). The serpents attack only the target chosen when the spell was cast. As a function of the spell, they can automatically find the target regardless of any techniques he uses to conceal himself.

Should the target escape (by leaping over the snakes, or dispersing one of the serpents long enough to squeeze out of the grouping), the serpents can still attack from up to three yards away. If one of the serpents is destroyed, another forms in its place on the group of serpents' next action. When the spell ends, the cracks in the ground close and the smoke cobras fade away.

Smoke Cobra stats:
Motivation: Bite the sorcerer's foe.
Attributes: Strength 3, Dexterity 6, Stamina 4; Charisma 0, Manipulation 0, Appearance 1; Perception 3, Intelligence 1, Wits 4
Virtues: Automaton: Never fails Valor checks, never makes others.
Abilities: Awareness 4, Dodge 6, Martial Arts 6
Join Battle: 8
Attacks: Bite: Speed 5, Accuracy 12, Damage 5L + poison, Parry DV —, Rate 2
Soak: 2L/4B
Health Levels: -0/-0/-0/Incap
Dodge DV: 6
Willpower: 10
Essence: 1
Other Notes: The venom of the smoke cobras has the following traits: Damage 3L/action, Toxicity (caster's Essence), Tolerance —/—, Penalty -6
"""

[[spell]]
id = "disguise-of-the-new-face"
name = "Disguise of the New Face"
circle = "terrestrial"
cost = "15m"
keywords = ["Illusion"]
duration = "Until revealed or dispelled"
target = "Creature"
source = "The Books of Sorcery, Vol II"
pages = "44-45"
effect = "Perfectly disguise as another"
description = """
This spell weaves an illusion that makes the target look like someone else. It transforms not just the person's appearance, but her voice, mannerisms and even anima. Sidereal Exalted favor this spell for its ability to make them appear as someone else entirely. It perfectly complements the false identities they create through resplendent destinies.

The sorcerer ties threads of Essence around the target in the occult knot-pattern of the Hidden Self. The process takes 10 minutes to complete. It's easy if the target remains standing and immobile, but impossible if she does not.

The sorcerer's player rolls (Intelligence + Craft [Fate]) or (Intelligence + Larceny). This roll is not part of the spell casting, so the character may augment it with Excellencies or other Charms. The number of successes indicates the detail of the disguise and its ability to fool observers. (See Exalted p. 128 for details on creating disguises, though the spell does grant mannerisms as well and may be used to mimic someone of much higher Appearance.)

Once the persona-tapestry is woven, it flares briefly with Essence light before it fades, completely remaking the subject's appearance. The spell lasts until the imposture is somehow revealed, the target chooses to remove it (by spending a single mote, or a Willpower point for mortals) or when the caster dispels it, requiring line of sight and a reflexive action.
"""

[[spell]]
id = "dragon-of-smoke-and-flame"
name = "Dragon of Smoke and Flame"
circle = "terrestrial"
cost = "20m"
keywords = ["Obvious"]
duration = "One day (or until destination reached)"
target = "Serpentine guide"
source = "The Books of Sorcery, Vol II"
pages = "44-45"
effect = "Conjure a guide to known place"
description = """
The sorcerer expels a flying, serpentine guide from the center of her chest. It leads her on while she moves, and loops and whorls around her when she's still. By day or in light, the guide is formed of inky black smoke. By night or in darkness, the smoke transforms into heatless white flame visible for miles, illuminating its immediate surroundings as brightly as daylight.

The creature can infallibly guide the sorcerer to any specific location that is well known to her. A lost sorcerer can use the dragon of smoke and flame to find her way to a known location even out of dangerously variable environments, such as the Wyld or the twisting Labyrinth of the Underworld.

Alternatively, the sorcerer can bid the guide to seek a destination with a specific desired property, such as the nearest source of water. In this case, the sorcerer's player rolls (Wits + Occult) during the Cast Sorcery action, with a difficulty set by the property's rarity:
  Difficulty 1: Common properties, such as food or water sources in a forest.
  Difficulty 2: Uncommon properties, such as food or water sources in a desert.
  Difficulty 3: Highly uncommon properties, such as shelter from the elements in a nigh-featureless wasteland or a specific herb in a vast forest.
  Difficulty 4: Rare properties, such as deposits of gold, diamonds or other valuable but non-magical materials.
  Difficulty 5: Very rare properties, such as deposits of jade or safe haven in the Wyld.

The spell cannot locate places with unique or even exceedingly rare properties such as deposits of most magical materials (jade being the exception). Nor can it find specific locations the sorcerer has never visited or locations magically obscured in any fashion (unless the sorcerer herself was the one who magically obscured them). What counts as common or uncommon may vary by Storyteller discretion based on the region where the sorcerer casts the spell. Should the (Wits + Occult) roll fail, the serpent manifests but merely loops around the caster for its duration, providing illumination in the dark but no hint about the direction she should go.

The serpentine lasts for one full day, until the sorcerer reaches her destination, or until she dismisses it, whichever comes first.
"""

[[spell]]
id = "droning-suggestion"
name = "Droning Suggestion"
circle = "terrestrial"
cost = "10m"
keywords = ["Compulsion"]
duration = "One scene"
target = "Area"
source = "The Books of Sorcery, Vol II"
pages = "44-45"
effect = "Mass-Compulsion social attacks (10y)"
description = """
The sorcerer evokes a low droning buzz faintly audible to all in the spell's area. At the moment of casting, the noise rises to a crescendo, the sound of a thousand voices whispering in an unknown tongue. This is the spell's only Obvious quality: Unlike other spells, Droning Suggestion does not flare the sorcerer's anima if the sorcerer uses only her Personal Essence. Thereafter, a single speaking voice can drown out the quiet hum. Whether they hear the sound or not, everyone within 10 yards of the caster becomes susceptible to her suggestions. The spell lasts until the end of the scene.

Droning Suggestion turns the sorcerer's social attacks into unnatural mental influences, though they cost only one point of Willpower to resist. Furthermore, a mortal victim of the spell is magically prohibited from realizing the nature of this effect for as long as the spell endures. An Essence-user may deduce the spell's nature if it imposes on him a mechanical effect that a natural mental influence could not, such as forcing his player to spend more than two Willpower in a scene resisting the sorcerer's social attacks. Deaf characters, including characters who have stopped up their ears with wax, are not affected.
"""

[[spell]]
id = "emerald-circle-banishment"
name = "Emerald Circle Banishment"
circle = "terrestrial"
cost = "10+m"
keywords = []
duration = "Instant"
target = "Demon"
source = "The Books of Sorcery, Vol II"
pages = "45-46"
effect = "Banish a First Circle demon"
description = """
This spell has special timing rules. The character can cast it as a reflexive Shape Terrestrial Circle Sorcery action that takes 0 ticks. It affects one First Circle demon, up to (Essence x 15) yards away.

The sorcerer makes the Victory over Primordials Mudra, the hand-gesture the gods used to seal their victory at the dawn of the First Age. With his Cast Sorcery action, the sorcerer and the demon enter a contest of wills. Their players begin an extended, resisted roll of (Essence + Willpower) as a Speed 3, -1 DV action. The demon suffers a -1 internal penalty for each five additional motes the sorcerer spends in casting the spell. Neither contestant can take any non-reflexive action during this time without forfeiting the contest. The challenge continues until either the sorcerer or the demon accumulates a number of net successes equal to his opponent's Essence. If the sorcerer wins, the demon's form shatters, and it is banished back to Malfeas in a flash of green flame. If the demon wins, it remains in Creation, and the sorcerer cannot attempt to banish it again for five days.
"""

[[spell]]
id = "empathic-wind"
name = "Empathic Wind"
circle = "terrestrial"
cost = "15m"
keywords = []
duration = "Instant"
target = "One individual"
source = "The Books of Sorcery, Vol II"
pages = "45-46"
effect = "Send sense impressions on wind (Ess×50mi)"
description = """
The sorcerer imposes an instant's worth of sensory impressions on a passing gust of wind, then bids the gust to deliver those impressions to a compatriot up to (caster's Essence x 50) miles away. Within a minute, the wind reaches its recipient despite any barrier and delivers the experience.

The sorcerer's player rolls (Perception + Awareness). Each success allows the character to choose one sense to convey. If the roll scores more than five successes, the Empathic Wind delivers the caster's emotions during that instant as well. The target has full access to these sensory impressions for three seconds, after which he remembers them but no longer experiences them. Reading any long text in the sorcerer's field of vision requires success on a (Wits + Linguistics) roll on the part of the recipient. If the sorcerer is in sufficient pain to suffer wound penalties and wishes to transmit the sense of touch, the recipient also suffers those wound penalties for one action.
"""

[[spell]]
id = "the-eye-and-the-mouth"
name = "The Eye and the Mouth"
circle = "terrestrial"
cost = "15m"
keywords = []
duration = "10 minutes"
target = "Summoned eye and mouth"
source = "The Books of Sorcery, Vol II"
pages = "44"
effect = "Conjure eye+mouth to read aloud"
description = """
Drawing from ancient bargains, the sorcerer evokes a disembodied mouth and eye of golden light. The golden eye can read any text (though not codes or ciphers) and the mouth can translate and recite whatever the eye reads. The mouth will pause in its dictation if the sorcerer asks, but it will not translate the same text twice for a single sorcerer, nor repeat itself if the sorcerer mishears or is distracted during the translation. The eye and the mouth consent to only 10 minutes of servitude per day before they return whence they came.
"""

[[spell]]
id = "eye-of-alliance"
name = "Eye of Alliance"
circle = "terrestrial"
cost = "5m per participant"
keywords = []
duration = "One year and a day"
target = "Up to (sorcerer's Essence x 2) people"
source = "The Books of Sorcery, Vol II"
pages = "44-45"
effect = "Crystals link allies' emotions a year"
description = """
Dragon-Blooded sworn brotherhoods, and other Terrestrials who expect to work together for any length of time, favor this spell. The ritual takes 30 minutes to cast. The participants link hands around the sorcerer; if the sorcerer wishes to be included in this link, he joins hands with the rest. A brilliant white glow flows from each participant to the center of the circle and then back again, coalescing before each participant as a crystal to pluck from the air. These crystals have one facet per participant. One mote per crystal remains committed by the sorcerer who cast this spell, and the crystals remain intact for a year and a day. The sorcerer may not decommit these motes unless he decommits them all, destroying the spell and dissolving the crystals.

The crystals serve as arcane links to every member of the ritual, so their owners must guard them carefully. A sorcerer or thaumaturge also gains a number of automatic successes equal to the sorcerer's Essence to attempts to scry upon or gain magical information about the character whose crystal he possesses.

The real purpose of the crystals is to send emotions to other participants or to reflexively sense their emotions. Subjects can use this spell simply to keep tabs on one another from afar. The emotional link can also reveal valuable information in a social situation: Those capable of sensing a character's emotional state can often resist that character's attempts to lie to them, gaining a +2 bonus to Mental DVs against social attacks based on Manipulation. Dynasts sometimes use this aspect of the spell in tense negotiations to keep the other participants honest.

These crystals cannot be used to locate other participants without some other form of divinatory magic or artifact. When he sets his crystal into the hearthstone socket of an artifact, however, the bearer instantly knows the condition of the other participants if they are within one mile. He may also reflexively spend one Willpower to transfer a number of motes of Essence equal to the total number of participants in the ritual to one of the others whose stone is likewise set in an artifact. Any given participant may do so only once per day, and it causes his stone to grow cloudy, rendering it useless for that 24 hour period, though others may still sense him.

If a participant in the spell dies, her crystal dissolves, and one facet of each remaining crystal cracks and turns black. All bearers immediately know who died, though they might not know the circumstances of her death.
"""

[[spell]]
id = "flight-of-separation"
name = "Flight of Separation"
circle = "terrestrial"
cost = "10m"
keywords = []
duration = "Until destination reached or Essence miles traveled"
target = "Caster"
source = "The Books of Sorcery, Vol II"
pages = "46-47"
effect = "Become flock of birds; fly Ess miles"
description = """
The sorcerer speaks the Word of Ten Thousand Birds, part of the song that all the birds of Creation sing when they gather in one place. Because humans cannot speak this word, the caster is suddenly transformed into a flock of birds in a burst of Essence. The birds fly together at a speed of 20 miles per hour and can travel up to a number of miles equal to the caster's Essence. Once the birds reach this distance (or some nearer destination), the birds complete the Word of Ten Thousand Birds, and coalesce to become the sorcerer once more.

This spell has special timing rules. The character can cast it as a reflexive Shape Terrestrial Circle Sorcery action that takes 0 ticks. It follows all of the other normal rules for sorcery actions, except the character takes her Cast Sorcery action as her next normal action after she re-forms.

While transformed into a flock of birds, the sorcerer keeps all of her Attributes, Abilities, Willpower, health levels, Virtues and soak (including armor). Her Dodge DV increases by an amount equal to her permanent Essence. She cannot, however, take any actions other than Move actions. She may not attack, use Charms, communicate or use her Parry DV. Any health levels of damage are reflected by the deaths of several birds until the caster re-forms, whereupon the damage manifests as wounds and the slain birds dissolve into pools of the caster's blood.

Each sorcerer always becomes a particular species of bird. Abyssal sorcerers invariably become carrion-eating birds.
"""

[[spell]]
id = "flight-of-the-brilliant-raptor"
name = "Flight of the Brilliant Raptor"
circle = "terrestrial"
cost = "10m"
keywords = ["Obvious", "Shaping"]
duration = "Instant"
target = "Creature"
source = "The Books of Sorcery, Vol II"
pages = "47-48"
effect = "Diamond bird strike, explodes on hit"
description = """
The sorcerer's Essence coalesces into an eagle-sized bird of prey made of diamond and ruby flame. The bird then streaks with unearthly speed toward any target the caster can see within 1,800 yards. Right before it slams into the target, it gives the shrill victory cry of a garda bird. Should the brilliant raptor succeed in its attack, this briefly lived automaton explodes, consuming the area around the target in a holocaust.

The sorcerer's player rolls an attack of (Wits + Occult), with an Accuracy equal to the sorcerer's Essence, but no range penalties. The attack cannot be parried without a stunt or Charm, though it can be dodged normally. If the target is not on guard, the difficulty to spot the attack coming equals the sorcerer's Essence, due to the brilliant raptor's speed. The bird's impact inflicts a number of dice of lethal damage equal to the sorcerer's (Perception + Occult), with a number of automatic successes equal to the caster's Essence. Successes on the attack roll also add to damage as usual.

When the raptor strikes its target, it also sends fiery Essence coursing through the target's body to cause tremendous pain. If the target takes any damage, he suffers an automatic knockdown and a -1 internal penalty to all Dexterity-based rolls for every two health levels (round up) inflicted by the attack. This penalty fades at a rate of one point per five ticks.

Finally, the brilliant raptor explodes on the tick after it strikes, burning the target and everything else within three yards. The firestorm inflicts four levels of lethal damage (Trauma 3), which may be reduced as normal for environmental damage (see Exalted, p. 131). Everything in that area catches fire—hair, skin, objects and even the ground. Every tick they remain in the area, targets suffer further environmental damage of 1L/tick, Trauma 2.

Fleeing the area still leaves the target on fire (Damage 1L/tick, Trauma 1), which may be extinguished with an action (which may be flurried). These flames burn for 10 ticks before going out, though they may ignite other flammable sources with normal flame.
"""

[[spell]]
id = "floral-ferry"
name = "Floral Ferry"
circle = "terrestrial"
cost = "15m"
keywords = []
duration = "Until destination reached"
target = "Plant"
source = "The Books of Sorcery, Vol II"
pages = "47-48"
effect = "Conjure a sailing boat from a plant"
description = """
The sorcerer causes a nearby plant to grow and change in shape until it becomes a seaworthy vessel. The conjured boat might look like a flower (as the spell's name suggests) or like a curling leaf, a seed pod or even a piece of fruit—whatever's appropriate for the plant that produced it. One person can easily carry the lightweight magical boat by himself.

Once the sorcerer places the Floral Ferry in water and states her desired destination, the boat sails toward that location in as straight a line as possible, maneuvering around obstacles too small to be carried over. Its passengers and cargo stay safe even in the most tempestuous weather. Once the magical boat reaches its destination, it lingers for 10 minutes and then vanishes completely.

Floral Ferry stats:
Speed: 15/30 mph
Maneuverability: 2S
Endurance: (caster's Essence x 100) miles
Crew: 1/1 (only the sorcerer)
Cargo: 1 ton or 10 passengers
Armor: 6L/6B
Health Levels: Ux10/Mx10/Cx10/I/D
Weapons: None
"""

[[spell]]
id = "flying-guillotine"
name = "Flying Guillotine"
circle = "terrestrial"
cost = "10m"
keywords = []
duration = "Instant"
target = "Creature"
source = "The Books of Sorcery, Vol II"
pages = "47-48"
effect = "Spinning chain decapitates a target"
description = """
The sorcerer makes the Sign of the Hooded Headsman. His Essence congeals into a barbed chain two feet long that spins as it arcs toward the target at 170 yards per tick (about 340 miles per hour). The sorcerer can attack anyone he can see within 500 yards.

The sorcerer's player rolls (Perception + Occult) in the Cast Sorcery action, adding the character's Essence as automatic successes to the roll. This attack may not be parried without a stunt or Charm. If this is a surprise attack, the chain's great speed increases the difficulty to spot it by +2. The Flying Guillotine avoids obstacles (negating cover and shield bonuses) and can even turn corners to chase a foe.

The silver weapon wraps about whatever body part it strikes and secures itself into a loop of chain with barbs along the inside. The chain spins with great speed as it tightens, inflicting horrific damage. The spell inflicts 18 levels of lethal damage, plus the successes gained on the attack roll. The chain always aims for the neck of the target. If the Flying Guillotine reduces the victim below Incapacitated, it decapitates the target. Most creatures find this instantly fatal. The chain itself seals shut the severed neck on the head, making it not so messy a trophy.

If the damage does not kill the target, the chain has wraps around a shoulder, chest or limb thrown up as part of the defense, cuts deeply, and then vanishes in a flash of silver light. The chain likewise disappears if the target dodges, parries or otherwise counters the attack.

When used in war, this spell negates the normal penalty for attacking commanders and special characters, as it whips past all soldiers and fortifications on its way to its foe.
"""

[[spell]]
id = "food-from-the-aerial-table"
name = "Food from the Aerial Table"
circle = "terrestrial"
cost = "10+m"
keywords = []
duration = "Essence days (before dissolving)"
target = "Conjured food"
source = "The Books of Sorcery, Vol II"
pages = "48-49"
effect = "Conjure days of bland food"
description = """
The Essence around the sorcerer condenses into a cascade of pink flakes that resemble flower petals. The soft, edible flakes can feed at least five people. For every additional five motes and Shape Terrestrial Circle Sorcery action taken, the spell creates another 10 servings of food. If the spell is interrupted during casting, the food produced up to that point already exists, but no more is conjured. The additional Essence spent is lost, as all the motes used in casting this spell are spent with the first Shape Terrestrial Circle Sorcery action.

The magical food is nourishing and filling, but it lacks flavor. The food keeps for a number of days equal to the sorcerer's Essence before dissolving into ash. The food does not rot, nor can it be poisoned, but it dissolves if it is mixed into other foods or cooked in any way. After a day or two, animals find the food unappetizing, increasing their control ratings +1 per two days with no other viands.

Food from the Aerial Table will not sustain mortal life forever. After one week with no other food, creatures receive a -1 external penalty to all physical actions due to slight weakness and lethargy. After six months with no other victuals, a character requires double the normal amount to nourish him. This is doubled again every six months that a character goes without real food, but the time is reset after consuming a day's worth of actual food.
"""

[[spell]]
id = "fugue-of-truth"
name = "Fugue of Truth"
circle = "terrestrial"
cost = "10m"
keywords = []
duration = "Until botch, wounded, or voluntarily released"
target = "Caster"
source = "The Books of Sorcery, Vol II"
pages = "48-49"
effect = "Trance: see through illusion/lies"
description = """
The sorcerer casts this spell after meditating in a lightless, soundless place for one hour. He attunes himself to truth and the flows of Essence, rather than the tricks that sound and light play on the senses. The meditation enables the sorcerer to see through illusions, to resist glamours, to avoid enchantments and to perceive what is concealed, whether they are things or purposes.

This trance-like state grants four extra successes to all Perception-based rolls to perceive illusions, see through disguises, read motivations (see Exalted, p. 131), and when rolling to find or notice hidden things. Moreover, the sorcerer gains a perfect defense against normal, Manipulation-based social attack rolls, for he sees through the cleverest persuasions. Supernatural attempts to control the caster's mind can be resisted with a reflexive (Perception + Integrity) roll, difficulty of the would-be controller's Essence. Success indicates the sorcerer ignores this effect as well. While the trance lasts, however, treat the sorcerer as stunned (see Exalted, p. 153) for taking physical actions. His stupefied and distracted demeanor also inflicts a -1 external penalty to all social rolls.

Fugue of Truth ends if the sorcerer botches a roll, is wounded, loses consciousness (including going to sleep) or voluntarily chooses to release it. This spell can be countered only during its casting. Once the trance begins, the effect is entirely within the mind of the sorcerer.
"""

[[spell]]
id = "the-horse-that-travels-earth-and-water"
name = "The Horse That Travels Earth and Water"
circle = "terrestrial"
cost = "10m"
keywords = []
duration = "Until next sunrise or sunset"
target = "Conjured automaton"
source = "The Books of Sorcery, Vol II"
pages = "49-50"
effect = "Summon a horse that runs on water"
description = """
As the sorcerer makes the Sign of the Horseman, the winds in his area converge in the bubble of Essence before him. The Essence takes a hue that indicates the nearest Elemental Pole—red in the South, blue in the North, green in the East, black in the West and white nearest the Imperial Mountain—and then forms itself into a horse-shaped automaton. The horse's coat matches the bubble of Essence whence it came, though its mane and tail are either black or white.

The horse lands next to the caster, tossing and stamping, eager to be ridden. It serves as a perfectly trained war-horse (control rating 0). The stallion never tires and gallops over water as easily as land. It can travel at its full speed until the sun next crosses the horizon (whether rising or setting), at which point it dissipates into colored wind and is gone.

When using the "Average Travel Times" table on p. 264 of Exalted, the horse that travels earth and water is considered "horseback, tireless" and treats all water as land of the same terrain type.

In combat, the stallion is fearless. It can carry another rider, but the sorcerer must command it to do so and give it a destination. The horse then moves at full speed toward that destination, regardless of what its passenger wishes. It ignores attempts to redirect it. If the passenger falls or jumps from the stallion's saddle, the horse dissipates, its purpose fulfilled. The automaton does not like being used as a pack mount. Should someone try to use it as such, the creature's control rating increases to 3.

Horse That Travels Earth and Water stats:
Motivation: To carry the sorcerer to his destination.
Attributes: Strength 6, Dexterity 5, Stamina 5; Charisma 2, Manipulation 1, Appearance 4; Perception 3, Intelligence 2, Wits 2
Virtues: Automaton: Never fails Valor checks, never makes others.
Abilities: Athletics 4, Awareness 3, Dodge 2, Martial Arts 3, Presence 2 (Intimidation +1), Resistance 5, War 2
Join Battle: 5
Attacks: Bite: Speed 6, Accuracy 10, Damage 6L, Parry DV —, Rate 1; Kick: Speed 4, Accuracy 8, Damage 8L, Parry DV 4, Rate 2
Soak: 5L/5B (Elemental hide, 3L/0B)
Health Levels: -0/-0/-0/-1/-1/-2/-2/-4/Incapacitated
Dodge DV: 4
Willpower: 10 (0 against sorcerer)
Essence: 2; Essence Pool: 10
Other Notes: The horse that travels earth and water can make a magical flurry of a number of attacks equal to the caster's Essence by spending five motes. It also heals at a rate of 1B/10 ticks and 1L/20 ticks, as long as it can run while doing so. It cannot regain motes on its own. The steed has a finite pool, though it can receive Essence given through Charms such as Essence-Lending Method or artifacts that accomplish that task.
"""

[[spell]]
id = "hound-of-the-five-winds"
name = "Hound of the Five Winds"
circle = "terrestrial"
cost = "15m"
keywords = []
duration = "Eight hours"
target = "Conjured automaton"
source = "The Books of Sorcery, Vol II"
pages = "49-50"
effect = "Summon huge tracker hound (8h)"
description = """
The sorcerer hurls his Essence into the air and makes the Gesture of the Huntsman. Winds from the five elemental poles swirl together and form a massive, horse-sized wolfhound. This magical automaton can scent its prey up to 100 miles away and chase it tirelessly, as long as it has been introduced to the scent already. It can also serve the sorcerer as a bodyguard, warrior or even a riding beast (control rating 1). The creature exists for up to eight hours after its creation.

When tracking prey, the hound can hunt alone, lead the sorcerer or a deputy assigned by the sorcerer or even lead normal hunting beasts. The supernatural hound understands complex instructions and automatically succeeds at tracking mortal prey. The Storyteller may roll (Perception + Survival) against creatures that magically hide their tracks. This roll is opposed by whatever dice pool represents the prey's power, or (Wits + Survival) as a default. The hound adds to this opposed roll a number of automatic successes equal to the sorcerer's Essence. Only perfect effects can throw the hound off the scent. Even then, the hound will know if the target's scent reappears within 100 miles.

This spell can be countered only during casting. Once the hound appears, only killing it gets rid of it. When the duration of the spell ends or the hound is slain, it explodes in a violent eruption of wind that inflicts environmental damage (Damage 5B; Trauma 3) to anyone within three yards of it. Healing magic does not work on the hound.

In war, the hound is so ferocious it is considered a Magnitude 3 solo unit, for the purposes of comparing Magnitude with other war units. Treat packs of the hounds as Magnitude 3 + (1 per additional hound in the pack), to a maximum Magnitude of 8. A hound of the five winds does not receive this bonus when incorporated into a unit of some other sort. It must have the freedom to savage its way through enemy ranks.

Hound of the Five Winds stats:
Motivation: To serve the sorcerer
Attributes: Strength 5, Dexterity 6, Stamina 5; Charisma 1, Manipulation 1, Appearance 2; Perception 5, Intelligence 3, Wits 3
Virtues: Automaton: Never fails Valor checks, never makes others.
Abilities: Athletics 3, Awareness 3, Dodge 3, Martial Arts 5, Presence 5, Resistance 5 (Running +3), Stealth 2 (Stalking +2), Survival 5 (Tracking +3), War 2
Join Battle: 6
Attacks: Bite: Speed 4, Accuracy 12, Damage 7L, Parry DV —, Rate 2
Soak: 7L/7B (Rough hide, 5L/2B)
Health Levels: -0/-0/-1/-1/-2/-2/-4/Incapacitated
Dodge DV: 4
Willpower: 10 (0 against sorcerer)
Essence: 1
Other Notes: The hound of the five winds can perform a Move action of 20 yards and a Dash action of 60 yards. In war situations, hound of the five winds units have a long tick movement of 200 yards per tick.
"""

[[spell]]
id = "impervious-sphere-of-water"
name = "Impervious Sphere of Water"
circle = "terrestrial"
cost = "15m"
keywords = ["Obvious"]
duration = "Concentration"
target = "Area"
source = "The Books of Sorcery, Vol II"
pages = "50-51"
effect = "Globe of breathable water (or air)"
description = """
The sorcerer's anima flashes blue and green as it transforms the air in a 10-foot radius around her heart into a globe of fresh, magically breathable water. Its surface functions as a barrier with a soak of 20L/20B and 35 health levels. (See Exalted p. 153 for rules on attacking inanimate targets.) People inside the sphere cannot launch physical attacks against the world outside.

The water lasts as long as the sorcerer concentrates. While concentrating, she operates under the same restrictions as she did while shaping and releasing the spell—she may not move, speak or take actions except for activating her anima power. Others within the radius of effect have their actions constrained as they normally would when submerged, though they can still breathe. If the sphere is destroyed by countermagic, it is breached by damage or the sorcerer ceases concentrating, the water loses its magical properties and falls to the ground. As such, this spell sees another use during journeys through deserts or other areas where water is scarce.

This spell can also be cast underwater, in which case the water around the sorcerer becomes an impervious sphere of air.
"""

[[spell]]
id = "incantation-of-effective-restoration"
name = "Incantation of Effective Restoration"
circle = "terrestrial"
cost = "15m"
keywords = []
duration = "Permanent (repair)"
target = "One item"
source = "The Books of Sorcery, Vol II"
pages = "51-52"
effect = "Repair a damaged item to new"
description = """
Through a one-minute ritual, the sorcerer returns one damaged item to a pristine state by recalling its original form from the patterns in its Essence. This spell only restores items small enough for the sorcerer to lift, such as the fragments of a rotting book or the rusted remains of a suit of armor. The sorcerer also needs more than half of the decayed item's remains to restore it. Anything repaired by the spell appears as it did when it was new, and the effects are permanent.

Splitting an object in half and casting the spell on each does not result in two copies: One half regenerates and the other disappears.

The Incantation of Effective Restoration works in a limited fashion on magic items. It can instantly repair artifacts that require no maintenance, such as hearthstone bracers. Anything magical that requires maintenance is built of multiple components that must be repaired separately, and the spell does not aid in separating the components before repair or reassembling them afterward. Additionally, the spell reverses the effects of wear and damage but does not replace expended reagents or exotic fuels. Regular castings of the Incantation of Effective Restoration can halve the time necessary to perform maintenance on warstriders and other magitech, but the spell does not negate the need for maintenance entirely, nor does it allow a would-be scavenger lord to repair an item with skill requirements beyond her abilities. See Wonders of the Lost Age for full rules on magitech and its maintenance. The Incantation of Effective Restoration affects magitech items that require no maintenance as if they were damaged mundane items.
"""

[[spell]]
id = "incantation-of-spiritual-discretion"
name = "Incantation of Spiritual Discretion"
circle = "terrestrial"
cost = "20+m"
keywords = []
duration = "Indefinite (while maintained)"
target = "Area"
source = "The Books of Sorcery, Vol II"
pages = "51-52"
effect = "Ward area vs spirit travel"
description = """
In Yu-Shan, the gods wear solid bodies. This rite mimics that condition, forbidding dematerialized beings from entering an area with a radius equal in yards to the caster's (Occult + Essence), and forcing materialized spirits to remain so. The ritual takes six hours to cast. It uses salt, small mirrors and talismans engraved with symbols of the five cardinal points (Resources 2 and the mirrors and talismans may be reused). This spell may not be cast within an area that includes a godly sanctum or spirits of greater Essence than the sorcerer's own.
"""

[[spell]]
id = "internal-flame"
name = "Internal Flame"
circle = "terrestrial"
cost = "15m"
keywords = ["Shaping"]
duration = "Occult actions (environmental damage)"
target = "Creature"
source = "The Books of Sorcery, Vol II"
pages = "50-51"
effect = "Cause molten bone marrow (env. dmg)"
description = """
Molten rock flows within the bones of the earth. Volcanic gods use a certain gesture to call that magma to their mountains. As the sorcerer makes the Mudra of Burning Earth at any creature he can see within 300 yards, streamers of red and gray Essence-flame wash over the target's body. They seep past armor and clothing to enter his body. The sorcerer's player rolls (Wits + Occult) and adds a number of successes equal to the caster's Essence to the attack. This attack cannot be dodged, though it may be parried using stunts, magic weapons or Charms.

If this attack is not parried, the spell gives the target's bone marrow the qualities of molten iron. This Shaping effect inflicts environmental damage (Damage 2L/action, Trauma [sorcerer's permanent Essence]). The damage continues for a number of actions equal to the sorcerer's Occult or until the victim receives medical attention.

Internal Flame inflicts agony beyond belief. The target suffers a -2 internal penalty to all actions for the rest of the scene. This wound penalty stacks with all other active wound or pain-based penalties. Without supernatural healing, mortals remain wounded after the scene and slowly die over the next few weeks (generally holding on for one week per dot in Stamina before expiring). Exalts, spirits and other supernatural creatures heal normally from this attack.
"""

[[spell]]
id = "invocation-of-the-living-ship"
name = "Invocation of the Living Ship"
circle = "terrestrial"
cost = "20m"
keywords = []
duration = "Until next dawn or dusk"
target = "Ship"
source = "The Books of Sorcery, Vol II"
pages = "52-53"
effect = "Crew-less ship pilots itself"
description = """
The sorcerer lays her hand upon the figurehead of a ship and calls it to awaken—and it opens sea-green eyes. The entire ship comes to life, working every mechanical aspect—wheel, rudder, sail, rope, oars and all—without the need for a crew. Loyal and loving, the figurehead will even lead the ship in pursuit of the sorcerer, should she move more than 100 yards away—at least until the next dawn or dusk, when its eyes close and the ship becomes inert once more.

Invocation of the Living Ship cannot be used on a ship without a figurehead or on an Essence-powered ship. Occasionally, the spirit of the figurehead grows in power through repeated use of this spell, to the point where she can challenge the ship's own spirit for dominance. The ensuing conflicts have caused havoc for sailors and passengers, but never destroyed the ship itself... at least, not directly. In RY 353, an enemy sank one unfortunate warship in the Realm's fleet because the ship's own awakened godling and figurehead couldn't agree on how low it ought to sit in the water. The ship rocked so violently with their quarrel that its gunners couldn't aim its Essence cannon, and it became a sitting duck.
"""

[[spell]]
id = "keel-cleaves-the-clouds"
name = "Keel Cleaves the Clouds"
circle = "terrestrial"
cost = "25m"
keywords = []
duration = "12 hours (must be recast)"
target = "Ship"
source = "The Books of Sorcery, Vol II"
pages = "52-53"
effect = "Ship sails on clouds (12h)"
description = """
As fog or clouds touch the sea before her ship, the sorcerer persuades the vessel's spirit that they are true water, and sails forward onto them. This spell works only in misty conditions. The ship travels upon the mist as quickly as it would on water, at the mercy of the wind or the strength of the rowers as usual. If the fog lifts, the ship rises with it until it sails on clouds.

The enchantment depends on the Essence of everything associated with the ship believing it travels on water. Dropping anything over the side or lowering something below the fog disabuses it of that notion, causing the whole ship to descend. The caster must stay on board, too.

After 12 hours, this spell must be recast, lest the ship return downward through the clouds. Even if earth lies below it rather than sea, it will land softly, undamaged (but likely stranded).

Accustomed to their element controlling water, air spirits dislike this invasion. Powerful spirits might attack a cloud-sailing ship if the captain cannot somehow placate them.
"""

[[spell]]
id = "lightning-spider"
name = "Lightning Spider"
circle = "terrestrial"
cost = "10m"
keywords = []
duration = "Scene"
target = "Caster"
source = "The Books of Sorcery, Vol II"
pages = "52-53"
effect = "Eight lightning legs: climb, dash, grapple"
description = """
This spell involves the steps of the Storm Spider Dance, a tribal dance in the Northeast that celebrates the spiders that crawl among the highest, cloud-scraping treetops. As the sorcerer raises his arms like a hunting spider about to strike, eight legs of coherent lightning sprout from his back.

These legs are not solid, though they carry the sorcerer's weight and gain purchase on physical objects themselves. They can touch living flesh without harm, causing only a slight tingle. These legs can carry the sorcerer at her normal movement rates across vertical walls, ceilings or simply rough terrain without penalty. Additionally, the lightning spider legs allow the sorcerer to dash more easily, reducing the DV penalty for the Dash action by one point.

The additional legs grant the sorcerer a +5 bonus for all rolls made to instigate, maintain or escape from a grapple or to resist knockdown. The sorcerer can also create a length of lightning-thread she can tie to or around objects or people. Evoking this dragline requires the sorcerer to reflexively spend one mote per 100 pounds she wants it to support, and she can spend a number of motes equal to her permanent Essence. The dragline has a soak of 10L/10B and can take 15 levels of damage before breaking. Damage against it must be rolled.
"""

[[spell]]
id = "lightning-whip-smites-the-water"
name = "Lightning Whip Smites the Water"
circle = "terrestrial"
cost = "15m"
keywords = ["Obvious"]
duration = "Until dawn (or used)"
target = "Conjured whip"
source = "The Books of Sorcery, Vol II"
pages = "55-56"
effect = "Conjure a thrown lightning whip"
description = """
After the sorcerer casts this spell with a sharp, lashing gesture, a copper whip appears in his hand. Cracking the whip dissolves it into a single bolt of red-streaked copper lightning, which the sorcerer can aim at anything within half a mile using his (Perception + Thrown) pool. Attacking structures, such as ships, is difficulty 1; there are no range penalties.

The eldritch lightning inflicts (5 + successes) dice of piercing aggravated damage to people or structures. Once it hits, the lightning flares out into a ball of sparks that inflicts three dice of piercing aggravated damage on everyone within five yards of the impact who has a Dodge DV lower than the sorcerer's Essence.

The lightning may be dodged normally or parried with a Charm or stunt, but if parried, then the defender automatically suffers the effects of the sparking ball, centered on himself.

As air controls water, so earth shapes air. Should a sorcerer use this spell on land, the lightning grounds itself harmlessly. Only the caster may use the whip, and if she doesn't use it before the next dawn, it falls apart into copper dust.
"""

[[spell]]
id = "malediction-of-the-distorted-compass"
name = "Malediction of the Distorted Compass"
circle = "terrestrial"
cost = "15m"
keywords = []
duration = "Until sunrise (or dismissed)"
target = "Creature"
source = "The Books of Sorcery, Vol II"
pages = "53-54"
effect = "Curse: lose sense of direction"
description = """
The sorcerer makes eye contact with a creature and uses the Spinning Sign to thrust spatial confusion into his brain. Unless the victim's player succeeds at a Willpower roll with a difficulty equal to the sorcerer's Essence, he loses his way. The victim loses all sense of direction until sunrise the following day or until the sorcerer dismisses the spell's effects. Even if the roll succeeds, the target must flurry any other action he takes while moving. The player rolls each time the character moves.

While cursed by the Malediction of the Distorted Compass, the victim misreads maps and confuses travel instructions. He cannot find his way to any destination unless another person leads him there, even destinations as near as the next room. Anyone seeking to guide a victim of this spell had better hold his hand the whole time.
"""

[[spell]]
id = "mast-shattering-spell"
name = "Mast-Shattering Spell"
circle = "terrestrial"
cost = "20m"
keywords = ["Obvious"]
duration = "Instant"
target = "Ship"
source = "The Books of Sorcery, Vol II"
pages = "53-54"
effect = "Explode target ship's mast"
description = """
The sorcerer's anima flares dark blue and solidifies into a hovering, spiked ball of blue-tempered steel. With a tap of the sorcerer's finger, the spiked ball shoots toward the targeted ship in the literal blink of an eye—right into the target ship's mast. It can target any visible ship within one mile.

The resultant explosion of the mast not only cripples a sailing ship, but wooden shards explode in a 10-yard radius around the mast. This explosion inflicts environmental damage (Damage 10L, Trauma 3) to everyone in the area. A (Dexterity + Dodge) roll may substitute for the normal (Stamina + Resistance) as people dive for cover to avoid the splinters.

Masts reinforced through spells or Charms may survive the spell. In such cases, the caster's player attempts a reflexive (Wits + Occult) roll (treat this as part of the spell-casting process), with a difficulty equal to the Essence of the entity that reinforced the mast. Many First Age vessels bear reinforcements that draw on the little god of the vessel itself. For this purpose alone, treat the ship's god as having an Essence of 4. Masts made of the magical materials are immune to this spell.

Attempts to target other parts of the ship fail. The spell attacks only the mast. Sorcerers in the West or working for the Realm navy have devised variations that target oars (to cripple galleys) or the hull—but both pirates and naval officers alike often prefer to capture a ship than to send it to the bottom.
"""

[[spell]]
id = "mists-of-eventide"
name = "Mists of Eventide"
circle = "terrestrial"
cost = "15m"
keywords = []
duration = "15 ticks (sleep lasts until sun crosses horizon twice)"
target = "Area"
source = "The Books of Sorcery, Vol II"
pages = "54-55"
effect = "Sleeping mist (5y radius)"
description = """
The sorcerer focuses her Essence onto a visible point up to 50 yards away and makes the Sign of the Gates of Eventide, the metaphorical "gates of sleep" through which all must pass to reach the lands of dream. Opalescent mist spreads from that point to fill an area five yards in radius. The mists induce a magical slumber. Exalts, spirits and other creatures with active Essence receive a (Stamina + Resistance) roll, difficulty of the caster's permanent Essence, to resist the effects for five ticks. The spell does not affect Fair Folk, the dead, intangible spirits or automata. The mists appear for 15 ticks of combat time, during which they affect any creatures that touch them.

Victims sleep until the sun passes the horizon twice. Sleepers can be awakened forcibly, but they suffer a -3 internal penalty to all actions, as though drugged with a powerful narcotic. The awakened victim still must spend a point of Willpower to remain awake for a number of hours equal to his Stamina.

The magical sleep is not restful. Slumbering creatures regain neither Essence nor Willpower while they sleep, and they find themselves needing normal sleep as if they had spent the time performing light labor. The magical sleep is also dreamless: Its targets are immune to effects that cause nightmares or otherwise rely on dreams to work.
"""

[[spell]]
id = "open-the-spirit-door"
name = "Open the Spirit Door"
circle = "terrestrial"
cost = "15m + 5m per additional target"
keywords = []
duration = "Until sun next crosses horizon (or recast)"
target = "Touched creature(s)"
source = "The Books of Sorcery, Vol II"
pages = "53"
effect = "Step into a spirit's sanctum"
description = """
Tugging on the spiritual Essence that impregnates the world, the character pulls it through herself and anyone else she chooses. As the sorcerer casts this spell, she must stand within three yards of an entrance to a spirit's sanctum. The caster and her allies vanish into her fading anima, and reappear just inside the entrance. They can remain in the sanctum until the sun next crosses the horizon or the sorcerer recasts this spell—if the sanctum's owner doesn't force them out.
"""

[[spell]]
id = "paralyzing-contradiction"
name = "Paralyzing Contradiction"
circle = "terrestrial"
cost = "15m"
keywords = []
duration = "Until scene ends, countered, sorcerer dies, or all targets solve the koan"
target = "Creatures in area"
source = "The Books of Sorcery, Vol II"
pages = "53"
effect = "Koan paralyzes minds in area"
description = """
The sorcerer suffuses one of the Ineffable Koans with magical power, forcing the minds of sentient beings to do nothing else but ponder an impossible riddle. Speaking the koan, the sorcerer releases white Essence. This power forms over the sorcerer's head a sigil that represents the mystery of the koan. The spell affects all sentient creatures within 50 yards (except automata) who see the sigil or hear the caster's words, and have an Intelligence greater than 1. (Stupid people don't realize there's a puzzle.)

Solving this koan requires an extended (Intelligence + Lore) roll with a difficulty equal to the sorcerer's Essence and total successes required equal to the sorcerer's Lore. Characters cannot flurry this miscellaneous action. Each creature must find an answer within himself: Anyone else's solution sounds absurd. A character who struggles to solve the koan still gains the benefits of his DV (with penalties for actions used trying to solve the koan, as appropriate), but is not further penalized.

If a person is attacked while struggling to unriddle the koan, he is freed from the spell. Paralyzing Contradiction otherwise ends when it is countered, when the sorcerer dies, when all targets solve the koan or when the scene ends. When the spell ends, the sigil above the sorcerer's head snuffs out.
"""

[[spell]]
id = "the-parting-of-the-seas"
name = "The Parting of the Seas"
circle = "terrestrial"
cost = "20m"
keywords = []
duration = "Concentration"
target = "Body of water"
source = "The Books of Sorcery, Vol II"
pages = "55-56"
effect = "Part a body of water while concentrating"
description = """
Her arms spread wide and her face held skyward, the sorcerer calls up the behemoth Genai, who appears in his aspect as twin phantom giants. The twins wade into a body of water of the sorcerer's choice and split it in two. Each holds back one wall of water as if it were solid, leaving the ground between them dry. Rivers continue to flow even if Genai seems to block them off—the water mystically flows from one side of the trench to the other without passing through the space in between. This effect does not carry over to things living in the water or boats traversing its surface.

The dry trench is a number of yards wide equal to the sorcerer's Essence and up to (Essence x 100) yards long. The giants hold the water back for as long as the sorcerer concentrates: She may travel and converse, but not engage in any strenuous activity such as combat. If the sorcerer wishes, the giants can walk alongside her, parting the water before her and letting it rejoin behind her. In RY 400, Ragara Kyrol, a then-notable Dragon-Blooded sorcerer, crossed the Inland Sea without a vehicle in this manner, using Charms to negate her need for sleep. Two years later, her twin brother and rival Ragara Disagu attempted the same feat, lost concentration halfway and died, crushed below millions of tons of falling water. Anyone caught in the trench when it collapses is subject to damage, ranging from light in the case of a shallow stream to instantly fatal in the case of an ocean. The actual damage inflicted is up to the Storyteller.
"""

[[spell]]
id = "peacock-shadow-eyes"
name = "Peacock Shadow Eyes"
circle = "terrestrial"
cost = "10m"
keywords = ["Illusion"]
duration = "5 minutes (suggestion) + Illusion"
target = "One sentient being"
source = "The Books of Sorcery, Vol II"
pages = "55"
effect = "Hypnotic Compulsion via eye-lock"
description = """
The sorcerer's eyes glow with iridescent flame that holds the gaze of a target up to 10 yards away, compelling him to stunned silence. The sorcerer's player rolls (Wits + Occult). If the result exceeds the target's Dodge MDV, the hypnotized target believes anything the sorcerer says in the next five minutes and remembers the suggestions as his own memory—an unnatural mental influence. When the five minutes are up, an auxiliary Illusion effect convinces the target he had a normal conversation with the sorcerer, while continuing to believe what the sorcerer told him.

Someone presenting evidence contrary to what the target believes may unravel this spell. This calls for Investigation-based social attacks on the target, as though reducing an Intimacy. Breaking the unnatural mental influence requires a number of successful attempts equal to the sorcerer's permanent Essence.
"""

[[spell]]
id = "personal-tempest"
name = "Personal Tempest"
circle = "terrestrial"
cost = "15m"
keywords = []
duration = "One scene"
target = "Caster"
source = "The Books of Sorcery, Vol II"
pages = "55"
effect = "Wind cover (90%) at half-speed"
description = """
The sorcerer performs the Five Winds Nexus Gesture, making her the center of a confluence of strong winds. Her clothing whips about in winds that only people standing very close to her can feel. These winds last one scene, until dismissed or until the caster is incapacitated.

The magic winds cut the sorcerer's movement rate in half, due to resistance. Yet attacks made against the sorcerer, from archery to grapples, treat her as behind 90% hard cover.

The spell can be used in war. If the sorcerer increases its casting time to long ticks, Personal Tempest can protect a unit with a Magnitude no greater than her Essence as though they were behind 50% hard cover.
"""

[[spell]]
id = "plague-of-bronze-snakes"
name = "Plague of Bronze Snakes"
circle = "terrestrial"
cost = "15m"
keywords = []
duration = "Essence nights"
target = "Conjured automata"
source = "The Books of Sorcery, Vol II"
pages = "55-56"
effect = "Bronze snakes hunt at night, petrify"
description = """
This spell can be cast only at night. Speaking the sibilant Verdigris Serpent Chant, the sorcerer makes the Sign of the Hammer. His Essence coalesces into a great brass mallet, decorated with twining serpents. He strikes the ground once, twice, thrice to cast the sorcery. On the third strike, the hammer opens a hole in the ground and is swallowed up.

Three heartbeats later, a number of bronze serpents equal to (caster's Willpower x 2) wriggle out of the hole, encircle the sorcerer and bow to him. Then they slither away, moving up to as many miles from their hole as the caster has dots of Occult. Motion attracts the serpents, though they bite only livestock and other domesticated animals. Their bite injects magical venom that turns their victims to granite after a period of excruciating pain. The snakes return to their hole after biting one target, or shortly before sunrise, and wait for the following night. They never venture out during the day.

These serpents remain active for a number of nights equal to the caster's Essence. If they have not been destroyed before the spell's duration ends, the snakes return to their den and decompose into tarnished metal segments.
"""

[[spell]]
id = "private-plaza-of-downcast-eyes"
name = "Private Plaza of Downcast Eyes"
circle = "terrestrial"
cost = "20+m"
keywords = []
duration = "Occult + Essence days (renewable)"
target = "Area"
source = "The Books of Sorcery, Vol II"
pages = "55"
effect = "Ward area vs scrying & teleport"
description = """
This spell wards a place against scrying and teleportation. It takes six hours to cast and requires the sorcerer make a procession through all of the areas to be warded, circling the area again and again for the duration of the casting. As he walks, the sorcerer sprinkles ground glass along the boundary and makes the Mudra of Separation. The spell wards an area with a radius equal to the sorcerer's (Occult + Essence) in yards.

Once cast, the spell remains in place for a number of days equal to (Occult + Essence). At any point during the spell's duration, any sorcerer who knows Private Plaza of Downcast Eyes may renew the spell, using a lesser variant of the ritual that takes one hour and another 20 motes. This resets the duration of the spell to the new sorcerer's (Occult + Essence), but the actual effect and area of the spell itself remain set by the original sorcerer.

The completed spell blocks any effect that allows clairvoyance or translocation into or out of the area. This prohibition includes any Charm, spell or supernatural power that enables a user's senses to perceive a location outside the bounds of mundane perception. Likewise, any effects—including spells such as The Faithful Ally or Charms such as Hurry Home—that would allow teleportation into or out of the warded area fail. Subjects are not transported to the border of the warding, they simply never leave their original location without explanation and with full expenditure of Essence. Only Black Faith (see The Black Treatise) can trump this spell.
"""

[[spell]]
id = "purifying-flames"
name = "Purifying Flames"
circle = "terrestrial"
cost = "20m"
keywords = []
duration = "Instant"
target = "Food and drink"
source = "The Books of Sorcery, Vol II"
pages = "56"
effect = "Cleanse food/water/body of poison"
description = """
The sorcerer closes her eyes and flares her anima, forcing it through the strength of her will to assume the form of a blazing white, heatless flame. The flame surges from her body and seeks out any poison, corruption and toxicity that dare offend the sorcerer's presence. Purifying Flames halts all decay and destroys all non-magical poisons within enough food and drink to feed 12 people in one meal or else cleanses a single fouled well or self-contained water source. It neutralizes any non-magical poison already within a creature's body, preventing any further damage or negative effects, but it does not heal damage already taken. Purified characters expel the neutralized poison by vomiting it or by sweating it out through their pores.
"""

[[spell]]
id = "raising-the-earths-bones"
name = "Raising the Earth's Bones"
circle = "terrestrial"
cost = "25m"
keywords = []
duration = "Permanent (structures become mundane)"
target = "Area"
source = "The Books of Sorcery, Vol II"
pages = "56"
effect = "Raise walls & earthworks from ground"
description = """
The military forces of both Lookshy and the Realm make frequent use of this spell, which enables military sorcerers to raise earthworks and stone walls for defensive positions or otherwise to reshape a battlefield to their advantage. The sorcerer first marks out the area he wants to affect by driving cut sapling branches into the ground and infusing them with his anima. He can do so up to ([Intelligence + War + Essence] x 10) yards in any direction. The sorcerer also paces along the line of any berms, mottes, buildings or trenches he wishes to construct. The area must also be cleared of any creature larger than a rabbit.

When the sorcerer casts the spell, he visualizes the structure he wants to create. The paced lines and sapling poles glow ocher-yellow as earth and stone flow like wax to shape themselves into the proper forms. Casting the sorcery is a five-minute dramatic action. No structure raised by this spell can exceed three stories in height or depth, and available materials limit the sorcerer. He cannot raise stone walls in the bottomless sand-seas of the South, for instance. Once the structures exist, countermagic has no effect: They were shaped by sorcery but are not themselves magical.
"""

[[spell]]
id = "the-ravenous-fire"
name = "The Ravenous Fire"
circle = "terrestrial"
cost = "15m"
keywords = []
duration = "Until Essence x 27 cubic feet consumed"
target = "Inanimate object"
source = "The Books of Sorcery, Vol II"
pages = "56-57"
effect = "Burn a chosen material to ash"
description = """
The sorcerer's Essence flares around him, and he makes the sign of Essence Consumed over an object. A jet of blue-white flame leaps up to a yard from his fingertips to ignite the target of the spell. Wood sears to ash. Stone softens and burns like wax, while metals crumble to ash and slag.

The flames consume the material to which they were originally set but leave other substances alone. For example, setting fire thus to the stone in a statue crafted of marble, silver and emerald leaves a pile of melted, seared stone, with undestroyed silver and emeralds among the slag. Nor can the fire consume enchanted objects, the magical materials or anything alive. The flames feel icy cold but cannot harm living flesh.

The Ravenous Fire consumes up to 27 cubic feet of material (about the size of a human-sized statue and its base) per dot of the sorcerer's permanent Essence. The fire gutters out once it devours this amount of material. Only countermagic can extinguish it before then.
"""

[[spell]]
id = "ritual-of-elemental-empowerment"
name = "Ritual of Elemental Empowerment"
circle = "terrestrial"
cost = "30+m"
keywords = []
duration = "Permanent"
target = "Inanimate object"
source = "The Books of Sorcery, Vol II"
pages = "57-58"
effect = "Permanently empower an item w/ element"
description = """
This spell imbues an object with the puissant Essence of one of the elements. This extensive ritual begins at dawn and continues until noon. The sorcerer requires a large quantity of the element being invested: for instance, a grove of trees, a large bonfire or a brisk wind.

The sorcerer purifies the object with incense smoke and salt water, then chants sutras of the appropriate Elemental Dragon over it. Modern sorcerers often draw from the Immaculate Texts but many Sidereals, surviving First Age Lunars and gods prefer epic poetry about the Elemental Dragons' contributions to the overthrow of the Primordials. At the height of the ritual, the caster strikes the item five times—once for each of the Elemental Dragons—while speaking the Words of Elemental Binding over the object.

This lengthy and exhaustive process permanently imbues an object with certain elemental powers. The spell cannot be used on an item already imbued with any other magics. Additional enchantments can replace current benedictions but cannot add to them. The spell can empower objects that weigh up to (Essence x 5) pounds, plus an additional five pounds per five additional motes spent. Clothing, jewelry and weapons are the most common items.

Elementals can help a sorcerer perform this rite. A number of elementals of the appropriate element—up to that equaling the sorcerer's Essence—can assist the caster, though he must spend one point of Willpower during the ritual for every elemental past the first. The sorcerer and elementals add their Essence scores together to determine the maximum weight of the item to be enchanted. The spirits themselves fulfill the need for a large quantity of the desired element, as long as at least one elemental has an Essence of 3 or greater.

Elemental Benedictions by element:
Air: Lightness (weight reduced to one-fifth normal; armor reduces mobility and fatigue penalties by one each; weapons Speed reduced by one) or Coldness (shed cold with committed mote or Willpower; +3 dice to Resistance vs. hot environments; weapons frost over and inflict +2 lethal damage).
Earth: Solidity (items become stronger; cloth resists cutting; glass nearly unbreakable; weapons never rust; armor gains +2L/+2B soak).
Fire: Insulation (item immune to fire) or Radiance (shed heat with committed mote or Willpower; +3 dice to Resistance vs. cold; weapons incandescent and inflict +2 damage).
Water: Fluidity (item can change shape into another form of same substance and mass; activating requires a committed mote or Willpower).
Wood: Rejuvenation (item heals itself; heals one level per hour; superficial damage disappears in minutes; destroyed outright if damage exceeds health levels).
"""

[[spell]]
id = "river-of-blood"
name = "River of Blood"
circle = "terrestrial"
cost = "15+m"
keywords = []
duration = "Willpower days"
target = "Flowing body of water"
source = "The Books of Sorcery, Vol II"
pages = "58"
effect = "Turn river water to blood"
description = """
The caster's anima rises up as a deep vermilion serpent and strikes at a body of water no more than 500 yards away. The water turns into thick, red-black blood that flows downstream for a number of miles equal to the sorcerer's Essence, plus one mile per additional three motes spent in casting this spell. River of Blood may not be cast on ponds, lakes, seas or other bodies of water of which the caster cannot see the other side or that do not flow somewhere else. It can be cast on canals, aqueducts, fountains or even indoor plumbing.

This transmutation lasts a number of days equal to the sorcerer's Willpower. After the first six hours of the transmutations, plants within a mile of the blood-river begin to wither and die, for the blood-curse cannot nourish life. Beasts that live nearby flee for a healthier source of water, and the transformed water is useless as a source of nourishment, save for things that feed upon blood. The area soon reeks of rot and blood. Hungry ghosts and other unwholesome things are drawn to a cursed waterway. Mortals who remain within a mile of the afflicted water are likely to suffer consumption (see Exalted, p. 351).
"""

[[spell]]
id = "the-sacred-tongue"
name = "The Sacred Tongue"
circle = "terrestrial"
cost = "10m"
keywords = []
duration = "Until sun next crosses horizon (or dismissed)"
target = "Caster"
source = "The Books of Sorcery, Vol II"
pages = "58"
effect = "Speak/understand any language"
description = """
The Eternal Word belongs to no known language but is recognizable as a word of power in all tongues. Upon casting this spell, the sorcerer invokes that word and shapes the Essence of this spell into a mask of dusky gold that covers his ears and the lower half of his face.

When the caster speaks, the lips of the mask move to convert his words to the strange, echoing cadences of a mystic language. Everyone who hears the caster understands his words, though no one could mistake them for mundane speech. Likewise, the mask translates words spoken by others into the Sacred Tongue so the sorcerer can understand them.

The power of this spell gives the sorcerer's words some minor magical power in and of themselves. When he makes a social attack using The Sacred Tongue, the MDVs of his listeners decrease by one. Other people treat the sorcerer with respect, awe and fear. This spell lasts until the sun next crosses the horizon or until the caster dispels it.
"""

[[spell]]
id = "shadow-summons"
name = "Shadow Summons"
circle = "terrestrial"
cost = "15m"
keywords = []
duration = "Moonset to sunrise (shadow trapped); penalty lasts one week"
target = "Living creature"
source = "The Books of Sorcery, Vol II"
pages = "58"
effect = "Steal & message via target's shadow"
description = """
This ritual begins at midnight and continues until moonset. The sorcerer paints a pentagram of pitch and bile. He also needs an arcane link to his target. Walking the edge of the pentagram counterclockwise, the sorcerer chants the name of his target with the Dirge of Shadows. This incantation is completed 55 times.

As this is done, the victim's shadow is torn from her body and drawn to the caster. On the 55th repetition of the chant, the caster hurls a knife into the center of the pentagram, just as the shadow passes over that center. The knife pins the writhing shadow to the ground.

The shadow is trapped from moonset to sunrise. The sorcerer may use it in two ways. First, it may be used to deliver a message. The sorcerer speaks as long a message as he desires, provided he finishes by sunrise. Then he snatches up the knife, and the shadow speeds back to its owner, reattaching itself. When this happens, the target hears the full message.

The sorcerer may instead destroy the pinned shadow by mixing his Essence with the light of the rising sun, burning away its substance. This inflicts excruciating pain on the victim, who is immobilized in agony for one minute while the shadow fades away. For the rest of the week, while the shadow reforms, the target receives an internal penalty to all actions equal to the sorcerer's permanent Essence. This wound penalty stacks with all other wound penalties. The pain fades after one week, though the shadow takes a full month to grow back to its full size and darkness.
"""

[[spell]]
id = "shadowy-simulacrums-of-smoke"
name = "Shadowy Simulacrums of Smoke"
circle = "terrestrial"
cost = "15m"
keywords = []
duration = "One scene (or until dispersed)"
target = "Area around caster"
source = "The Books of Sorcery, Vol II"
pages = "59"
effect = "15y cloud: -1 sight, distraction"
description = """
A black, obscuring cloud rises from the sorcerer's anima, extending 15 yards from her person. Shadowy, distracting figures dart about within it. Sounds are muffled within the cloud, and their directions become unclear. Anyone other than the sorcerer within the cloud suffers a -1 external penalty to sight and hearing. Every time an affected character within the cloud attacks, his player must attempt a reflexive (Perception + Awareness) roll at a difficulty equal to the sorcerer's Essence (and the -1 penalty still applies). On a success, he selects his intended target. On a failure, he attacks one of the simulacra and wastes his action. On a botch, he attacks the ally closest to him by mistake. If a character flurries multiple attacks against the same target, every subsequent attack in the flurry hits the same target, be it enemy, simulacrum or ally—but characters who attack undesired targets may abort flurries after the first attack.

The simulacra have no substance to them, and no health levels. They constantly disperse and reform within the cloud. The cloud endures for the entire scene or until the sorcerer disperses it. It does not move with the sorcerer, but remains centered on where she stood at the moment of casting. Regular winds won't affect the cloud, but gusts of high-speed winds can shift its location at the Storyteller's discretion. Sustained high-speed winds can disperse the cloud.
"""

[[spell]]
id = "silent-words-of-dreams-and-nightmares"
name = "Silent Words of Dreams and Nightmares"
circle = "terrestrial"
cost = "10m"
keywords = []
duration = "Instant (social attack delivered through dream)"
target = "Person"
source = "The Books of Sorcery, Vol II"
pages = "59"
effect = "Send a social attack via dream"
description = """
This rite takes 10 minutes to perform. It requires a pair of silvered mirrors, incense made from rare lotuses (a Resources 3 purchase) and an arcane link to its target. The mirrors face each other with the arcane link between them. The sorcerer lights the incense. As she speaks the Five Words of Dreams, the incense smoke wafts toward the mirrors—and into them.

With this spell, the sorcerer can send the target any sort of dream. The caster's player can roll (Manipulation + Occult), difficulty equal to the target's Dodge MDV, to use the dream as an otherwise normal social attack. Applications including sending nightmares to erode Intimacies or "prophetic" dreams to convince the target to take a certain action. The dream-borne social attack may also prevent the victim from recovering Willpower the next morning. People cannot spend Willpower in their sleep to resist the spell's effects. The caster may attempt a single social attack through each use of this spell.
"""

[[spell]]
id = "sleep-of-stony-safety"
name = "Sleep of Stony Safety"
circle = "terrestrial"
cost = "15m + 5m per ally"
keywords = []
duration = "Until dawn or sorcerer wakes and ends it"
target = "Caster and up to (Willpower) additional willing subjects"
source = "The Books of Sorcery, Vol II"
pages = "60"
effect = "Stone dome shelters sleeping allies"
description = """
Sleep of Stony Safety takes a minute to cast and can be cast only at night. The sorcerer spreads fine white sand in a circle on the ground, large enough to encompass all the targets. The participants lie with their heads touching and their feet extended outward. The sorcerer chants the Irresistible Song of Stone used by earth elementals to while away the seasons. The white sand dissolves into a glowing mist that creeps upwards, arcing over the targets to solidify into a dome of white sandstone.

While within the sandstone dome, the participants of the spell can sleep even in the bulkiest armor, though the spell does not force slumber. Inconvenient natural processes are halted while participants rest in stone. The dome has 15L/15B soak, 5L/5B Hardness and 25/30 health levels. If it is attacked, a soft chiming within the dome rouses the sorcerer and any other sleepers. Sleep of Stony Safety ends when dawn arrives or when the sorcerer wakes up and chooses to end the spell. The sleepers rise at that point, brought instantly to their feet as the dome crumbles into harmless sand.
"""

[[spell]]
id = "song-of-the-waves"
name = "Song of the Waves"
circle = "terrestrial"
cost = "20m"
keywords = ["Compulsion"]
duration = "Successes over MDV actions"
target = "One opponent"
source = "The Books of Sorcery, Vol II"
pages = "60"
effect = "Compel target into berserk attack"
description = """
The sorcerer's anima flares upward to form a great phantom wave behind her. From it emerges the watery head and forelimbs of a huge horse that blasts the intended victim with a stream of water and ear-splitting symphonic noise. The weird, cacophonous display enchants a target into a berserk but directed rage, driving him to attack the sorcerer's enemies with abandon.

The sorcerer's player rolls (Manipulation + Occult), adding a number of automatic successes equal to her Essence. For every success rolled over the target's Dodge MDV, the target spends one action attacking the nearest enemy of the sorcerer. The target can resist this unnatural mental influence by paying four points of Willpower. After his last action under this Total Control effect, the target regains his self-control and remembers what he did—and who was responsible.
"""

[[spell]]
id = "sorcerers-irresistible-puppetry"
name = "Sorcerer's Irresistible Puppetry"
circle = "terrestrial"
cost = "25m (preparation) + 20m committed (to use gem)"
keywords = []
duration = "Indefinite (gem); 24 hours per use"
target = "Creature"
source = "The Books of Sorcery, Vol II"
pages = "60-61"
effect = "Possess prepared target via gem"
description = """
This spell prepares a creature for later possession by a spirit. The subject either must be willing or unconscious and immobilized during the first part of this spell, which takes an hour to cast. The sorcerer binds the target in ritual paper inscribed with the One Hundred Sigils of the Cunning Puppeteer and burns incense placed around the target in the Pattern of Command. The materials for this ritual are a Resources 2 purchase and are consumed in the spell.

At the height of the ritual, the sorcerer directs his Essence to seize part of the target's spirit and materialize it into a gemstone on the subject's brow. This gemstone resembles a hearthstone. The sorcerer uses it later to seize control over the target. When pressed to the sorcerer's brow, the jewel adheres automatically. It also fits into the hearthstone socket of an artifact attuned by the sorcerer. Doing so, however, grants no benefit beyond the ability to use the gem without touching it.

Charms such as All-Encompassing Sorcerer's Sight do not reveal the target's enchantment until the gem itself is used, though arcane senses register the gem as some sort of magical object. This spell works only on creatures with an Essence rating, and it has no effect on the undead, automata, plants and dematerialized spirits.

To use the gem, the sorcerer invests it with 20 motes (committed). Doing so provokes a resisted and extended (Willpower + Essence) roll between the players of both sorcerer and target. The first side to acquire three net successes wins. If the target wins, she may roll (Wits + Occult), difficulty equal to the sorcerer's Essence, to realize something just tried to control her. The sorcerer may not attempt control again for 24 hours. If the sorcerer wins, he takes complete control of the target's body for 24 hours, with access to its memories.

The sorcerer can use the target's Abilities or his own, whichever are greater. The possessed victim retains Strength, Dexterity, Stamina, Perception and Appearance, but uses the sorcerer's Intelligence, Wits, Charisma and Manipulation. The sorcerer can use the target's special natural senses but does not have access to the target's magical abilities, spells or Charms. Both cease normal Essence recovery while the possession lasts. If the target takes damage, the sorcerer suffers equal unsoakable bashing damage. If the creature dies while possessed, the jewel shatters and the sorcerer loses three points of Willpower.

While controlling the target, the sorcerer must remain in one place concentrating. He may break concentration at will and re-occupy later during the 24-hour period. The target has no control or conscious knowledge of its possession. Countermagic against either the gem or the possessed victim can break the spell and destroy the gem.
"""

[[spell]]
id = "spirit-of-might"
name = "Spirit of Might"
circle = "terrestrial"
cost = "10+m"
keywords = ["Obvious"]
duration = "Occult actions"
target = "Caster"
source = "The Books of Sorcery, Vol II"
pages = "61"
effect = "Massive Str bonus for Occult actions"
description = """
The Invocation of the Titan channels magical power through the sorcerer's anima, manifesting in his body as tremendous physical strength. For a number of actions equal to his Occult rating, the sorcerer's strength is increased and his anima flares to full roaring manifestation. Iconic animas often seem to help perform these feats of strength, whether a great angelic being reaches down to help pull a door from its hinges, or a bear-totem anima helps the sorcerer push a boulder out of the way.

For the purposes of the Feats of Strength chart (see Exalted, p. 127), the sorcerer gains a bonus to his (Strength + Athletics) equal to his (Willpower + Essence). For every two additional motes spent on the spell, the sorcerer adds one to this bonus, to a maximum of +10 (for 30 motes).
"""

[[spell]]
id = "spirit-sword"
name = "Spirit Sword"
circle = "terrestrial"
cost = "20m"
keywords = ["Obvious"]
duration = "One scene"
target = "Caster"
source = "The Books of Sorcery, Vol II"
pages = "61"
effect = "Sword that strikes spirits/ignores armor"
description = """
This spell uses the Sword-God Mudra, the sacred hand-sign that the least gods of all the swords in Creation make anytime one of the Incarnae takes up his or her blade. The spell's Essence forges a shard of the caster's own soul into a blade that shimmers with a thousand hues and rings like an iron bell when it strikes. The sorcerer may use either Melee or Occult to wield the sword, which lasts for one scene or until countered. The magical blade requires minimum Strength 1.

The spirit sword reveals much about the caster: Solars create swords of magnificent golden opalescence, while Lunars evoke sleek weapons of shimmering moonlight. Abyssal blades are jagged black weapons of howling nothingness, and Sidereals wield rapiers of glimmering starlight. Dragon-Blooded sorcerers reveal their elemental affinity: blades of red flame, rippling water, polished wood, razor-like ice or chipped flint. Regardless, spirit swords have the same traits: Speed 4, Accuracy +2, Damage (Willpower)L, Defense +2, Rate 3.

The blade, as a thing of spirit, strikes only spirit. The sword can strike dematerialized spirits if the wielder can perceive them. Moreover, it passes through mundane armor to strike at the spirit-infused flesh of the target beneath it. By the same token, however, the blade cannot parry mundane weapons. Any weapon or armor crafted of the magical materials and/or which is committed using Essence provides defense against the spirit sword, because it carries the spiritual Essence of its owner.
"""

[[spell]]
id = "spoke-the-wooden-face"
name = "Spoke the Wooden Face"
circle = "terrestrial"
cost = "10m to cast, 5m to activate"
keywords = []
duration = "Permanent (until tree dies)"
target = "Living tree"
source = "The Books of Sorcery, Vol II"
pages = "61-62"
effect = "Use carved tree as remote face"
description = """
The sorcerer turns a tree into a conduit through which she may communicate over long distances. First, the sorcerer must carve a likeness of her face into a living tree. This ritual lasts from sundown to sunup, during which the sorcerer spends 10 motes and her player rolls (Dexterity + Craft [Wood]). Should the roll fail or the sorcerer be interrupted, the motes are lost. The sorcerer can try again the next night and need not select a new tree.

Thereafter, from any distance in Creation and for as long as the tree lives, the sorcerer may concentrate and spend five motes to see and hear from the carved image's point of view and speak through its mouth. While inhabiting her wooden likeness, the sorcerer loses awareness of her body and surroundings, so all attacks upon her become unexpected. If she suffers such an attack and wants to maintain concentration, her player must succeed at a (Stamina + Resistance) roll with a difficulty equal to the levels of damage inflicted.

A sorcerer can place as many wooden faces as she wishes, and a single tree can host the faces of more than one sorcerer. Tales from the First Age tell of groves of trees covered in these carvings, used by sorcerers to converse at pre-scheduled times. Lunar Exalted sorcerers still enchant smaller groves in remote locations, enabling them to pass news across Creation.
"""

[[spell]]
id = "sprouting-shackles-of-doom"
name = "Sprouting Shackles of Doom"
circle = "terrestrial"
cost = "10m"
keywords = []
duration = "One scene (or until dispersed/destroyed)"
target = "One creature"
source = "The Books of Sorcery, Vol II"
pages = "62"
effect = "Vines clinch a foe in place"
description = """
The sorcerer casts this spell with the gesture that vines make as they climb. The Essence of the spell evokes a magical automaton from local vegetation, so that thick vines rise up and seize a target no more than 30 yards away. The spell can draw upon any plant life, as well as lichens and fungi, but fails if there are no suitable life forms in the area whatsoever.

The conjured tendrils seize the target in a clinch and squeeze until he is Incapacitated. After that, the tendrils simply hold the target. The magical vines have a reach equal to the caster's Essence in yards, and they continue to writhe and snatch at the target if he moves out of their reach. The sprouting shackles exist for a scene or until they are dispersed (by the sorcerer), dispelled or destroyed.

The Shackles of Doom automaton has the following traits: Strength 5, Dexterity 1, Stamina 6; Clinch attack: Speed 6, Accuracy 11, Damage 5B, Rate 1, Range 30; Soak 3L/6B; Health Levels -0/-0/-0/-1/-1/-1/Incap; Dodge DV 2; Willpower 10; Essence 1.
"""

[[spell]]
id = "the-spy-who-walks-in-darkness"
name = "The Spy Who Walks in Darkness"
circle = "terrestrial"
cost = "15m committed (creation) + 5m to possess"
keywords = []
duration = "Intelligence + Occult days"
target = "Conjured servant"
source = "The Books of Sorcery, Vol II"
pages = "62-63"
effect = "Shadow-puppet servant; possess it"
description = """
The sorcerer transforms his own shadow into an automaton extension of his will. This ritual takes three hours to cast, requires the aid of an assistant and must be performed on the night of the full moon.

The sorcerer stands with his back to the full moon, casting a shadow on the floor in front of him. His assistant paints his shadow with a black paste of pitch, frankincense and clay from a cave that has never seen the sun's light (a Resources 2 purchase). The caster infuses the shape with the spell's Essence and invokes Five Days' Darkness, the shadow-progeny of the Unconquered Sun, as the assistant sets the painted shape on fire. The painted shadow burns for five minutes with a gray, darkening luminescence until the shadow automaton rises, still smoking, to bow before its master.

The darkling servant looks like an inky black, elongated version of the caster, without facial features or distinguishing marks, soft yet solid to the touch. The shadow automaton lasts for a number of days equal to the caster's (Intelligence + Occult). During this time, the sorcerer casts no shadow.

At the end of the spell's duration, the automaton collapses into a puddle of wet clay, and the caster's normal shadow reappears. If the spell is countered or the spy slain, the caster loses one point of temporary Willpower and takes two levels of bashing damage.

Anytime during the automaton's existence, the sorcerer may spend five motes to possess it. While possessing the spy, the caster may take no other actions and is oblivious to surroundings. The spy is almost invisible when moving among mundane shadows. It can slip through cracks in doors and windowsills. While in possession, the sorcerer uses the automaton's Physical and Social Attributes and his own Abilities. He cannot use Charms but may draw on his own Essence pool to cast spells that do not require long rituals.

The spy has three innate Charms: Invasion of Darkness (5m: flatten and squeeze through any gap air can pass; +2 successes on grapple checks); Swallow the Breath (10m: suffocate clinched targets, 2L/action unsoak-able, victims cannot cry out); Traverse the Depths of Night (7m, 1wp: step into one shadow and emerge from another within 5 miles).

If the sorcerer is possessing the spy when it is destroyed, his consciousness flashes back into his body. He suffers levels of bashing damage equal to total damage taken by the spy and loses two points of temporary Willpower.
"""

[[spell]]
id = "sting-of-the-ice-hornet"
name = "Sting of the Ice Hornet"
circle = "terrestrial"
cost = "15m"
keywords = []
duration = "Until target struck, target out of range, or 30 ticks elapsed"
target = "One creature"
source = "The Books of Sorcery, Vol II"
pages = "63"
effect = "Swarm of ice shards chases foe"
description = """
The sorcerer evokes a grayish cloud of Essence, speaks the Word of Sudden Frost—which deities in the North use to create blizzards—and points at a visible target within 300 yards. The Essence crystallizes into a swarm of ice shards that launch themselves at the target. These ice shards are about four inches long and half an inch thick. Although they shatter against steel, these slivers can chip stone surfaces and pierce wood up to one inch thick.

The sorcerer's player rolls (Perception + Occult) as an attack, adding a number of automatic successes equal to his Essence. This attack cannot be parried, and Dodge DVs decrease by two against it. The swarm of ice needles inflicts 12 levels of lethal damage and travels at 20 yards per tick until it reaches its target. The shards can follow their target up to 500 yards from the sorcerer, ignoring cover and other obstacles in their flight. The ice hornets remain in existence until either they attack their target, the target moves out of range, or a maximum of 30 ticks has elapsed, at which point they melt away.
"""

[[spell]]
id = "storm-rider-enchantment"
name = "Storm Rider Enchantment"
circle = "terrestrial"
cost = "20m"
keywords = []
duration = "3 days or until storm ends"
target = "Ship"
source = "The Books of Sorcery, Vol II"
pages = "64"
effect = "Ship immune to a storm 3 days"
description = """
On encountering a storm at sea, the sorcerer appeases the storm mothers by shaping a simulacrum of a red-haired woman from his own anima and casting it out of the ship. It's a cheat, but by fooling a storm mother for a moment, the sorcerer can steal some of her power. For three days or until the end of the storm (whichever comes first), the ship is immune to the storm mothers' wrath. Lightning does not strike it, nor does water drag it down. It will not even sail off course as long as the helmsman succeeds at a ([Wits or Stamina] + Sail) roll, difficulty dependent on the storm's ferocity. Indeed, if the storm follows the vessel's charted course, it will speed the journey by a few days.
"""

[[spell]]
id = "summoning-of-the-harvest"
name = "Summoning of the Harvest"
circle = "terrestrial"
cost = "15m"
keywords = []
duration = "Instant (effects are permanent)"
target = "Area"
source = "The Books of Sorcery, Vol II"
pages = "64"
effect = "Force crops/animals to ripen"
description = """
The sorcerer weeps a single tear and uses it to trace a glyph of Sextes Jylis on the ground. The tear imbues fertility into all the vegetation and animals within 50 yards of the caster. Within a minute, plants mature and bring forth bountiful crops, and pregnant animals birth their offspring. No affected living thing is harmed in any way by this spell. Summoning of the Harvest does not affect intelligent creatures. The spell can be used only once per year on the same patch of land. Additional attempts in that time fail automatically—even those cast by other sorcerers. Sorcerers often use this spell on areas afflicted with drought, as it forces a successful harvest even in the absence of proper irrigation.
"""

[[spell]]
id = "summoning-the-lesser-minions-of-the-eyeless-face"
name = "Summoning the Lesser Minions of the Eyeless Face"
circle = "terrestrial"
cost = "25m"
keywords = []
duration = "One year and a day (or until slain or new batch summoned)"
target = "Summoned minions"
source = "The Books of Sorcery, Vol II"
pages = "65"
effect = "Summon mute minions (year+day)"
description = """
This spell requires a pool of expensive, black, scented oil (Resources 3) and a ritual lasting six hours. In the course of the ritual, the sorcerer reaches through the oil into Elsewhere and draws forth mewling, servile creatures long-banished from Creation. The creatures absorb the oil as the sorcerer pulls them through it, and once she calls forth a number of lesser minions equal to her (Charisma + Essence), the ritual ends and the oil is expended, save for the residue on her arms and hands.

The lesser minions of the Eyeless Face are humanoid in form. They have black skin like iridescent tar, set with ridges and protrusions—but their faces are smooth and white as maggots' skins, lacking facial features of any sort. Minions range from seven to four and a half feet tall. The whimpering they make during the summoning, before their bodies are fully set, is the last vocalization they will ever produce. They cannot speak, though they can see, hear, touch and smell as well as any mortal. To communicate, they dance, pantomime and cringe in unnaturally expressive fashion.

The lesser minions are naked and sexless when called, but they can use any equipment allowed by their Abilities and are sufficiently plastic to squeeze into any reasonably sized armor. A sorcerer can have only one batch of lesser minions under her control at a time. Once pulled from Elsewhere, minions live for a year and a day, or until slain, or until the sorcerer casts the spell again to call a new batch. Upon death, they crumble into stinking dust. A lesser minion does not bleed, suffer from infection or from Poison or Sickness effects, but it cannot heal or be healed.

Lesser Minion stats: Strength 3, Dexterity 3, Stamina 3; Charisma 1, Manipulation 2, Appearance 0; Perception 2, Intelligence 2, Wits 3; Virtues: Compassion 1, Conviction 3, Temperance 2, Valor 4; Abilities: Athletics 3, Awareness 2, Dodge 4, Linguistics 1 (Pantomime +3), Martial Arts 2, Melee 3, Presence 2, Ride 1, Stealth 2, War 3; Soak 5L/5B (Rubbery hide 4L/2B); Health Levels -0/-0/-0/-1/-1/-2/-4/Incap; Dodge DV 3; Willpower 7; Essence 1.
"""

[[spell]]
id = "theft-of-memory"
name = "Theft of Memory"
circle = "terrestrial"
cost = "15m"
keywords = []
duration = "Instant (memory trapped in gem permanently)"
target = "Person"
source = "The Books of Sorcery, Vol II"
pages = "65-66"
effect = "Steal a memory into a gem"
description = """
The Theft of Memory spell permits the sorcerer to snatch a memory from his victim, though it acts subtly—a rarity among spells. The sorcerer must bear an emerald (of at least Resources 2 value) in his hand and touch it to his target. He makes the Mudra of Remembrance and Forgetting with his other hand and releases the Essence of the spell. The spell's Essence display can manifest as any number of noticeable phenomena—simple alchemical pyrotechnics from a street performer, weather effects or the light of the sun playing across the area. In order to conceal the casting of this spell, the caster's player must succeed at a (Wits + Larceny) roll. People watching the scene realize the character just cast a spell if their players gain more successes on a (Perception + Occult) roll than the sorcerer's roll to conceal the spell.

Moreover, all the legerdemain in the world will not conceal this spell from creatures able to view the flows of Essence. To Essence sight or Charms such as All-Encompassing Sorcerer's Sight, it is very clear that the sorcerer just cast a spell.

The sorcerer must know what memory he wants to steal. When he touches his victim, his player rolls (Charisma + Occult) as a social attack against the target's Dodge MDV. If the attack succeeds, the target relives the memory for a moment and then it is gone, trapped in the gemstone. Failure indicates that the sorcerer does not steal that memory, cannot steal any other memory from that victim and suffers a -2 internal penalty on all Mental Attribute-based rolls for the rest of the scene. Theft of Memory cannot be cast in combat. Memories are either buried beneath the disciplined mind of a warrior or lost amid the fear most other creatures feel in such situations.
"""

[[spell]]
id = "thunder-wolfs-howl"
name = "Thunder Wolf's Howl"
circle = "terrestrial"
cost = "10m"
keywords = []
duration = "Instant"
target = "An area 20 yards across, within 100 yards of the sorcerer"
source = "The Books of Sorcery, Vol II"
pages = "66"
effect = "Sonic boom: bashing area attack"
description = """
In the ancient days of the First Age, the great Lunar general Shu-lin hunted the behemoth Thunder Wolf, who roamed the Far North eating men and beast alike. Though Shu-lin wished to tame him, the two struggled, painting a snowy mountainside crimson, until they died. Shu-lin's widow created this spell in memory of the struggle.

The sorcerer shapes his Essence with the Howling Word the great Animal Fathers of the North used to warn of Thunder Wolf's approach. A terrible howl then rips through an area 20 yards in diameter, up to 100 yards away. The shock smashes fragile objects and pulps internal organs. This attack cannot be parried or dodged at all. The caster's player rolls (Intelligence + Occult) to inflict a number of levels of bashing damage equal to the character's (Essence + successes); the sonic attack ignores worn armor. Undead and inanimate objects receive only half their normal soak against the howl.

All living creatures in the area of effect are also deafened and disoriented. They suffer a -2 internal penalty on all actions for five ticks per success on the casting roll. The players of Exalted and other wielders of Essence may attempt a reflexive (Stamina + Resistance) roll. Each success on this roll reduces the period of disorientation by five ticks.
"""

[[spell]]
id = "the-titans-icy-breath"
name = "The Titan's Icy Breath"
circle = "terrestrial"
cost = "10m"
keywords = []
duration = "Instant (penalties last remainder of scene)"
target = "Area"
source = "The Books of Sorcery, Vol II"
pages = "66"
effect = "Ice giant breath: lethal area"
description = """
The sorcerer calls up the head and shoulders of an icy giant, which rises from the ground before her and exhales a stream of freezing air that solidifies into an icy shell around anyone caught within an area 10 yards wide and high, extending 100 yards from the caster. The titan bellows a second after the exhalation, shattering the ice, and then vanishes.

Roll the sorcerer's (Wits + Occult) and add a number of automatic successes equal to her Essence, as an attack against everyone in the spell's area. Characters cannot block this attack, though they may dodge it.

The spell has a raw (lethal) damage of six dice plus attack successes. Anyone who suffers even a single level of damage from this spell has his movement rates halved and the Speed of all his actions increased by one for the remainder of the scene. Multiple applications of this spell cannot add more than one, total, to the Speed of a character's actions or reduce his movement rate to less than half its normal value.
"""

[[spell]]
id = "unbreakable-bones-of-stone"
name = "Unbreakable Bones of Stone"
circle = "terrestrial"
cost = "20m"
keywords = []
duration = "Until the sun crosses the horizon twice"
target = "Caster"
source = "The Books of Sorcery, Vol II"
pages = "66"
effect = "+Ess Str/Sta; halve wound penalties"
description = """
The sorcerer begins the Irresistible Song of Stone, the song that earth elementals sing to themselves while they sit deep in the soil (also used in the Sleep of Stony Safety). She sings it wrong, however, and the local earth elementals—perfectionists unable to resist correcting such a thing—croon the song to her correctly. The sorcerer's silver-burning Essence absorbs the corrected song, turning the sorcerer's bones to stone until the sun crosses the horizon twice.

The spell adds an amount equal to the sorcerer's permanent Essence rating to her Strength and Stamina Attributes. Moreover, any wound penalties are halved, rounded down, for the duration of the spell. Any damage taken from falling is also cut in half, rounding up. The sorcerer's eyes turn the color of granite, her skin becomes cold, tough and ashen, and her weight increases by 50%.
"""

[[spell]]
id = "unconquerable-self"
name = "Unconquerable Self"
circle = "terrestrial"
cost = "1m"
keywords = []
duration = "Instant"
target = "Caster"
source = "The Books of Sorcery, Vol II"
pages = "66-67"
effect = "Caster self-immolates utterly"
description = """
Also called the Spell That Is Not A Spell, Unconquerable Self is actually a mangling of the processes of sorcery. The spell turns Essence inward, burning away the sorcerer until nothing remains but white ash.

With a silent act of will that is considered a Shape Terrestrial Circle Sorcery action, the savant gathers his Essence. He need not speak a word, nor gesture. The sorcerer can accomplish this while bound and gagged or paralyzed, as long as his mind is clear enough to concentrate. His anima flares iconic and terrible as Essence erupts from him, incinerating himself and all his possessions, including any artifacts to which he is attuned. He dies.

The caster's body and spirit are utterly consumed, leaving behind neither corpse nor ghost, though a Celestial Exaltation returns to Yu-Shan for eventual reassignment. No memories of that Exalt's incarnation remain for future hosts. The spell wipes all traces of the sorcerer's existence from the Exaltation. Objects in contact with the Exalt but not possessed by him are unharmed. Creatures who witness the event might spend a moment blinded by the eruption of Essence, but otherwise take no damage.

Because this spell is absurdly simple, Unconquerable Self takes merely a day of training time and half the normal experience points to learn.
"""

[[spell]]
