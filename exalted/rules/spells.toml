effect = "Summon a champion automaton"
description = """
This spell works only when cast under the open sky. The sorcerer speaks several of the Five Hundred Words of War and draws a latticework of Essence around herself. During the day, sparks of sunfire swirl down from the sky to join the lattice, while at night, the sorcerer's anima catches glowing motes of moonlight or starlight.

As the magic builds, the sorcerer rises into the air. Dozens of distant voices rise in an indistinct war chant. Least gods from objects in a 50-yard radius awaken, leave their objects and fly toward the Essence-lattice of this spell, where the light of the Incarnae forges them into plates of thick armor, forming a mighty scout- or common-class warstrider around the sorcerer. This warstrider lasts for one hour, though the sorcerer may extend its duration by spending 10 motes per additional hour. (See Wonders of the Lost Age for complete descriptions of warstriders and their equipment.)

Armament for the warstrider costs additional committed motes of Essence: one mote per dot of cost for mundane weapons, or two motes per dot for artifact weapons, all suitably scaled for an 18-foot-tall humanoid war machine.

If the sorcerer spends an additional five motes at casting (which are not committed), the warstrider gains the benefits of the magical material aligned with the sorcerer's Exaltation, but only if the warstrider is crafted of the appropriate sort of light. Solars gain this benefit only from casting this spell during the day, for example, while Lunars and Sidereals gain this benefit from spells cast at night.

When this spell's duration elapses, the least gods return to their objects, imparting in the object a slight glow of sun, moon or starlight that fades in a week. They are completely unharmed.
"""

[[spell]]
id = "hidden-judges-of-the-secret-flame"
name = "Hidden Judges of the Secret Flame"
circle = "celestial"
cost = "30m"
keywords = []
duration = "Sunrise to sunset"
target = "Summoned Judge"
source = "The Books of Sorcery, Vol II"
pages = "72-73"
effect = "Conjure judges who interrogate"
description = """
There are seven ancient judges, tall, cloaked and hooded in black, each of whose limbs have withered to darkened bones and whose face is but a single blue flame. The Hidden Judges each carry one of the Swords of the Secret Flame and have the right to destroy even gods and Exalted who forget their responsibilities. The Judges have no names but are addressed by the names of their swords, such as Hekateron, Amantythae, Sebelle, Kasimodente and Pheberester. In Yu-Shan, they enforce the peace at the Calibration festival. Any other times of the year, they can be called to Creation to punish transgressions against the Divine Law—but never compelled.

The spell lasts from sunrise to sunset. It requires a complex, seven-fold diagram and seven new candles. When the Hidden Judge arrives, the sorcerer must tell it (in Old Realm) who has broken the celestial laws, and how. Yet when the Unconquered Sun turned his face from the world in disgust over Solar excesses, all the Chosen lost the faith of Yu-Shan. Therefore, working against an Exalt is no longer a crime against Divine Law. Hidden Judges are willing to give advice about what is an offense against Heaven, however.

A Judge can be persuaded that an innocent person has committed crimes against Heaven, but a Hidden Judge always discovers the truth in the end. Should a Judge find that it was set to attack an innocent, then all seven Judges hunt the informer until she is dead or has defeated all seven. Honest mistakes are no excuse, though possibly grounds for appeal to the Unconquered Sun.

Normally, however, only one Judge pursues a miscreant at a time, and defeating a Judge in battle redeems even the worst of criminals. Judges can be harmed only by weapons anointed with the blood of a person who has never broken the laws of Heaven and who offers his blood willingly.
"""

[[spell]]
id = "hideous-confusion-of-tongues"
name = "Hideous Confusion of Tongues"
circle = "celestial"
cost = "35m"
keywords = ["Obvious"]
duration = "(Essence x 2) hours"
target = "Area and infected creatures"
source = "The Books of Sorcery, Vol II"
pages = "74"
effect = "Babel-confuse a crowd's speech"
description = """
The sorcerer makes the Sign of the Shattered Tower into the spell's Essence. The resulting burst of turquoise light carries a linguistic curse. Everyone who was within 100 yards of the sorcerer speaks gibberish from then on, though they are not aware of this fact. Once an affected creature attempts to communicate with someone else, that character's player may roll (Perception + Awareness), difficulty 3, once per minute of interaction, for the character to realize he's speaking nonsense. A (Perception + Occult) roll may also be made at the time of casting to understand what the spell did, without needing to speak. The curse lasts (caster's Essence x 2) hours, and it affects only a victim's ability to communicate. Charm use and spell casting are not affected, unless they rely on communication.

Moreover, this curse is contagious. People who hear the victims' gibberish are themselves affected by it, though they resist infection with a successful (Stamina + Linguistics) roll, with a difficulty equal to the sorcerer's Essence. The curse can even re-infect a victim after its first effects have worn off. Like a person directly cursed by the spell, infected victims may realize how the Hideous Confusion of Tongues has passed to them.

Sapphire Countermagic can remove the curse from an individual, but the only time it can affect the spell as a whole is when the curse is being cast. Victims cured by Sapphire Countermagic become immune to subsequent re-infection from that casting's effect. Hideous Confusion of Tongues also does not affect the caster or any creature with an Essence greater than the caster's own.
"""

[[spell]]
id = "imbue-amalgam"
name = "Imbue Amalgam"
circle = "celestial"
cost = "15+m"
keywords = ["Shaping"]
duration = "Permanent"
target = "One mortal creature"
source = "The Books of Sorcery, Vol II"
pages = "74"
effect = "Forge spirits into an amalgam being"
description = """
With this spell, a Celestial sorcerer may imbue a servant, pet or guardian with tremendous power and ability, enabling it to serve her better. The ritual itself takes one full day to cast and requires a statue of the form the sorcerer wishes to give her target. This statue must be carved of stone quarried from the Blessed Isle, gilded and inlaid with a variety of jewels arranged in occult patterns across the body (a Resources 4 cost). During the ritual, the target remains prone and naked, with identical gems placed in the same places on its body. When the spell is complete, the jewels are consumed, and the target's form changes to match that of the statue, while the statue appears in the target's original form (and may, in fact, be used in a subsequent casting of this spell to return the subject to normal).

Imbue Amalgam is a Shaping effect. It does not work on any creatures with an active Essence pool, including minions empowered by this spell (except to return them to their natural form).

The empowered minion treats every command from the sorcerer as if it were an unnatural mental Servitude effect. The amalgam can spend a point of Willpower to disobey the understood intention of the sorcerer's commands, but it must do so anew each time it receives objectionable commands—any lasting rebellion will have to be subtle. The statue of the amalgam's original form provides an arcane link to the amalgam. It allows the sorcerer to cast spells upon the target that require such a link. Moreover, by spending five motes while touching the statue, the sorcerer can mentally speak with the amalgam for up to a single scene, as long as they are both in Creation.

The changes wrought to an amalgam are amazing, and they are always obvious. The subject usually receives Abilities and appearance based on a "theme" of some sort, whether a bizarre, insectoid creature, a clockwork servitor, a creature all of jutting bone and raw muscle or a sleek, beautiful creature made of gleaming silver. Even at their most human looking, amalgams look like Wyld-tainted mutants or spirits, so most sorcerers do not bother trying hiding their nature. The spell cannot give an amalgam a truly natural shape.

Enhancement options (mote costs committed at casting):
• Basic Abilities (15m): The amalgam bleeds, heals, fights infection and disease and resists Charms and magic as though it were Exalt. It is also considered an Exalt for the purposes of counting 10s and stunting. A (Perception + Occult) roll, difficulty 2, can reveal what kind of Exalt created the amalgam.
• Attributes (2m per dot): The sorcerer can raise the amalgam's Attributes by (at most) a number of dots equal to the sorcerer's (Essence + Occult), allocated however he wants.
• Abilities (1m per dot): The sorcerer may increase the amalgam's Abilities by (at most) a number of dots equal to the sorcerer's (Essence + Occult).
• Essence (4m per dot): The sorcerer may increase the amalgam's Essence to a maximum of (sorcerer's Essence – 1).
• Essence Pool (4m per five motes in pool): The amalgam's Essence pool is used to fuel any Charms it uses and may be used to attune artifacts. Its pool cannot exceed (its Essence x 10) motes.
• Charm (3m or 8m per Charm): Amalgams may be given any sort of Charms, including supernatural Martial Arts or Terrestrial Circle Sorcery. If the creator knows the Charm, the cost is three motes per Charm. Other Charms cost eight motes per Charm.
• Willpower (4m per dot): The sorcerer can raise the amalgam's Willpower, to a maximum of 10.
• Soak (1m per +1L/+1B): The sorcerer may increase the amalgam's natural armor, to a maximum bonus equal to the sorcerer's (Essence + Occult).
• Natural Attacks (1m per change): Each type of natural attack (punch, kick or clinch) may be altered. Changes include: convert bashing to lethal (1m), -1 Speed (1m), +1 Accuracy (1m), +1 Damage (1m), +1 Defense (1m), +1 Rate (1m). Rate and Speed changes may be purchased only once.
• Natural Ranged Attack (1m): Speed 5, Accuracy +0, Damage +0, Rate 1, Range 100. Range can be increased by an additional 100 per 1m.
"""

[[spell]]
id = "insidious-tendrils-of-hate"
name = "Insidious Tendrils of Hate"
circle = "celestial"
cost = "20m"
keywords = []
duration = "Essence days or until caster is slain"
target = "People in area"
source = "The Books of Sorcery, Vol II"
pages = "76"
effect = "Tendrils spread hate in target"
description = """
The sorcerer feeds a brazier with the skins of a dozen exotic snakes (a Resources 3 purchase, or a Resources 2 purchase in large cities of the South). After a three-minute invocation of hate, a grasping hand of smoke rises from the brazier, and the sorcerer gives it arcane links to each of the intended targets. The hand returns to the flames, which burn a sickly green and then smother as smoky tendrils leap through Elsewhere toward the targets. The spell affects a number of sentient creatures up to the caster's (Manipulation + Essence), all of whom must be within 30 yards of each other at the time of casting.

At that moment, the vision of the targets dims for about five seconds as the tendrils wrap around their hearts. The targets' players all attempt Willpower rolls, with a difficulty of the sorcerer's Essence. If a roll succeeds, the spell does not affect that character. If the roll gains three or more successes over the difficulty, the target knows he was just the target of some kind of emotion-manipulating spell.

Characters whose rolls failed suffer the effects of the spell. Every interaction they have with other people seems twisted: Victims believe enemies surround them. They take anything said to them in the worst possible way, as an insult, threat or lie. A victim may spend a Willpower to avoid misinterpreting a single statement by someone to whom he has an Intimacy, but even the voices of those he loves soon seem to drip with sarcasm and hate.

Insidious Tendrils of Hate lasts for a number of days equal to the sorcerer's Manipulation rating or until the caster is slain. By then, a diplomatic meeting might have ended in declaration of war, or a family might have torn itself apart. Countermagic can free a single given target from the spell, but only someone present at the spell's casting can use countermagic to wreck the spell in its entirety.
"""

[[spell]]
id = "ivory-orchid-pavilion"
name = "Ivory Orchid Pavilion"
circle = "celestial"
cost = "20m"
keywords = ["Obvious"]
duration = "24 hours"
target = "Conjured pavilion"
source = "The Books of Sorcery, Vol II"
pages = "76"
effect = "Conjure a defended pavilion"
description = """
The sorcerer weaves her Essence into the shape of a gleaming white orchid bud as she sings the last stanza of Welcome to the Highest, the song that least gods sing silently to herald the arrival of an Incarna. As the song ends, the sorcerer raises her hands and claps them overhead. The blossom unfolds around her into a magnificent palace, ornately carved and pillared, smelling of orchids. This wondrous pavilion can entertain up to (Essence x 100) guests in high style. Gods find themselves at ease, for the pavilion radiates an aura that feels like Yu-Shan. This aura also puts most mortals in a state of awe.

The building itself is crafted of pale, translucent ivory through which the light of the sun and moon diffuses. It holds the finest furniture, silk curtains and bedding, with tables laden with fresh fruits, nuts and bowls of wine that never run empty. The ivory walls are thin, however (Soak 5L/5B, Health Levels 3/10).

The Ivory Orchid Pavilion lasts for 24 hours before it crumbles to white orchid petals. For five years after the spell is cast, white orchids grow on that location. Countermagic can destroy the pavilion, and it burns easily, though its size is such that flame takes several minutes to engulf the entire structure.
"""

[[spell]]
id = "magma-kraken"
name = "Magma Kraken"
circle = "celestial"
cost = "35m"
keywords = ["Obvious"]
duration = "One scene"
target = "Area"
source = "The Books of Sorcery, Vol II"
pages = "76"
effect = "Magma kraken erupts and rampages"
description = """
The sorcerer combines the Prayer to the Kraken with the Mudra of Burning Earth that volcano gods make when their mountains spew fire. Red strands of Essence then lance toward the targeted area, which begins to rumble.

Five ticks after the sorcerer's Cast Sorcery action ends, tentacles of lava erupt from the ground. The sorcerer can place these writhing limbs anywhere in a circle 50 yards wide, at most 500 yards away. Anyone in the area when this happens is knocked prone unless their players succeed at a reflexive (Dexterity + Athletics) roll, difficulty 2. The tentacles are magical constructs that Join Battle on the tick they appear and lash out at anyone the sorcerer names an enemy, either to strike or grapple. These act with Strength 10, Dexterity 4 and Martial Arts 4. They use Dexterity to initiate grapples, but Strength to maintain them.

Tentacle Strike: Speed 6, Accuracy 8, Damage (15 + sorcerer's Essence)L, Rate 1
Tentacle Clinch: Speed 6, Accuracy 8 (initiate)/16 (maintain), Damage (15 + sorcerer's Essence)L, Rate 1

The damage inflicted by the tentacles is considered partial fire damage: Targets that are immune to heat and fire halve any damage taken, after soak. The tentacles never dodge or parry; they have 10L soak and are immune to bashing damage. Ten levels of damage destroy a tentacle, but at the beginning of every action, surviving tentacles regenerate all damage they have taken up to that point.

The sorcerer can also direct tentacles using a special Control Tentacle action. A sorcerer can direct one more Magma Kraken tentacle with each Control Tentacle action, up to an amount equal to his Perception score. Directing multiple tentacles does not count as a flurry.

Control Tentacle (Speed 6, DV -1): The sorcerer can direct a tentacle to strike, clinch or perform some other simple task, such as to lift a heavy object. It acts on the sorcerer's actions, even if it has not yet recovered from its previous action. A tentacle uses the sorcerer's (Wits + Martial Arts) to attack but suffers a -1 internal penalty per 50 yards between the sorcerer and the battle. While controlling a tentacle, the sorcerer can take only reflexive actions. If the sorcerer's struck, his player must roll to maintain concentration, just as for interrupted spell casting. Should the sorcerer break concentration, any tentacles he's directing immediately end their clinches. A Join Battle roll follows, using the sorcerer's (Wits + Awareness), for them to rejoin combat as normal.

The tentacles last for an entire scene, unless destroyed or countered. When the spell ends, the tentacles harden into impressive serpentine shapes of obsidian.
"""

[[spell]]
id = "mercurys-deliverance"
name = "Mercury's Deliverance"
circle = "celestial"
cost = "30m"
keywords = []
duration = "Until the sun next crosses the horizon"
target = "Area"
source = "The Books of Sorcery, Vol II"
pages = "77"
effect = "Reflexive teleport (Wits+Occult)"
description = """
Mercury's Deliverance grants defense against all spells of the Emerald and Sapphire Circles. Before casting the spell, the sorcerer must etch a circle around the area to defend. The maximum diameter is (caster's Essence x 100) yards. She marks it at the five points of a pentagram with small hexagrams the size of her hand, and she scribes a sixth hexagram in the direct center of the circle. Within each hexagram, she writes a symbol of the Maiden of Journeys. This painstaking process takes about half an hour.

The sorcerer must touch the center hexagram while she casts the spell. Essence floods through the lines of the circle. Five ticks after her Cast Sorcery action, a lance of saffron light rises from the first hexagram. Every five ticks thereafter, a spear of light rises from another hexagram, moving clockwise around the circle: beams of crimson, cerulean, emerald and deep violet. Five ticks after the violet ray, a pure white lance of light rises from the center hexagram and the five colored beams bend inward until they arc into the midst of the white light. Scintillating waves of multi-hued Essence wash over the circle to form a dome of a thousand colors—then it goes out.

Until this happens, the ward does not function—but from then on until the spell expires, no spells of the Emerald or Sapphire Circles, nor spells of the Shadowlands Circle of necromancy, can pass the outer barrier. Spells function normally within and outside the invisible dome, but should any sorcerer attempt to affect anyone on the other side of the boundary, it flares to life again, negating the spell and warning anyone who can see the dome that magic is afoot.

The spell also blocks all scrying, teleportation and similar long-distance effects, as well as preventing items that are enchanted or created by sorcery from crossing the boundary. From outside the dome, only Adamant Countermagic can destroy the spell, but Sapphire Countermagic can dispel it from inside. Otherwise, it lasts until the sun next crosses the horizon. The circle can be reused as long as the diagram remains intact. Destroying the diagram once the spell has been cast has no effect.
"""

[[spell]]
id = "outside-worlds-within"
name = "Outside Worlds Within"
circle = "celestial"
cost = "25m"
keywords = []
duration = "One month (renewable)"
target = "Room"
source = "The Books of Sorcery, Vol II"
pages = "77"
effect = "Step into pocket dimension"
description = """
This spell transforms a chamber's interior into a perfect duplicate of any environment in Creation, from the strange fields of white flame in the Far South to the frigid ice caves of the North. This spell takes three hours to complete.

The chamber cannot exceed (Essence x 100) yards in any direction. It must be clean and empty, and the sorcerer enters it naked, bearing the implements of the ritual. The chamber is sealed against intrusion: No light, air or particles of dust must enter from without. Then, the sorcerer must cleanse himself within the chamber and prepare a ritual candle (created with herbs and oils used in occult exorcisms, a Resources 2 purchase). When all is ready, the sorcerer ignites the candle with his anima.

First, the sorcerer uses the spell's Essence to scour the room into a sorcerous tabula rasa, ready to accept the new template of Creation he desires. Then the sorcerer closes his eyes and visualizes any location in Creation he has seen before, willing the Essence of the room to reshape itself into that place. If the sorcerer wishes to create a terrain he has never visited before, he must enter the chamber with a sample from that locale—a bit of soil or stone, say, or a handful of leaves, a container of water or a bit of an animal that dwells there.

The room reshapes itself around this material or memory template. The ceiling becomes clear, showing the appropriate sky above (though the ceiling is still visible, like a pane of glass between the room and the sky), while the floor crumbles into dirt or hardens into stone. Plants sprout as appropriate. The walls are remade with appropriate features, such as cliffs of sandstone, ice or coral, or covered by crawling vines. The light of the candle shifts into the ambient light and temperature of the locale, and winds blow through the chamber.

If the place is taken from memory, the climate of the area matches that memory. If the spell uses a sample, however, the room acts as a pocket of that locale, its weather mimicking that spot in Creation.

Once the ritual is complete, the chamber remains in its new condition for one month. After this time, the sorcerer can renew the spell by entering the chamber and expending 25 motes of Essence. If the spell is not renewed, the chamber returns to normal over the course of three days.
"""

[[spell]]
id = "the-princes-of-the-fallen-tower"
name = "The Princes of the Fallen Tower"
circle = "celestial"
cost = "30m"
keywords = ["Obvious"]
duration = "Essence hours"
target = "Conjured automata"
source = "The Books of Sorcery, Vol II"
pages = "78"
effect = "Summon spirit princes as advisors"
description = """
The sorcerer evokes a doorway of dark, rippling water in midair. Through the sheet of water lurch manlike creatures made of living, compacted rust. They number twice the sorcerer's permanent Essence. The creatures kneel once, then wait for the sorcerer to tell them what to destroy. Their long, rusty claws deal terrible wounds—while metal rusts, stone crumbles, wood rots and leather and cloth falls to dust. These automata have poor combat skills, but they can wreck a town or fortress.

A prince of the fallen tower's touch deals eight levels of lethal damage, just like its clawing attack, but it ignores the first six points of an object's soak. A touched object continues to take this same attack every five ticks, for the next two minutes (120 ticks, or 24 increments of damage). Enchanted objects or items made from the magical materials are immune to this erosion. So are living creatures. The princes attack people if the sorcerer specifically commands it or if the person interferes with their attempts at destruction. On its own, though, a prince will disintegrate the clothes off a person but leave him unharmed.

The princes of the fallen tower exist for a number of hours equal to the sorcerer's Essence, unless someone uses countermagic to dispel them (one at a time) or someone simply destroys them. They never stop looking for more things to destroy. A careless sorcerer who doesn't supervise them might find the princes demolishing his manse.
"""

[[spell]]
id = "raise-the-puissant-sanctum"
name = "Raise the Puissant Sanctum"
circle = "celestial"
cost = "30m"
keywords = ["Shaping"]
duration = "Permanent"
target = "Demesne"
source = "The Books of Sorcery, Vol II"
pages = "79"
effect = "Raise a stone manse-tower"
description = """
The Lunar and Sidereal Exalted rarely have the luxury of huge crews of workmen to build their manses. The Lunars demand self-sufficiency, and the Sidereals desire secrecy. This rite provides both. A sorcerer can raise a manse from a demesne rated no higher than (her Essence – 2).

Armed with a design for the manse she wishes to create (see Exalted, p. 133 for the rules on designing manses), the sorcerer enters the demesne. For a number of weeks equal to the rating of the manse to be raised, she studies the plans and visualizes the structure she intends to create. The sorcerer must remain attuned to the demesne for this entire time of reflection and interact with no companion but the manse's designer (if she didn't design it herself).

Once she is prepared, the sorcerer casts the spell and feeds her Essence into the demesne. The land then reshapes itself. Stone rises to form walls, sand crystallizes into glass, and plants grow into the geomantic patterns needed to channel the demesne's Essence. This Shaping effect takes six hours per dot of the intended manse and requires incredible concentration on the part of the sorcerer.

During this process, the demesne must remain undisturbed, with no intruders. The arrival of another sentient being can destroy the subtle flows of Essence (as if an attack had come during the Shape Celestial Circle Sorcery actions). When the new manse is complete, the sorcerer sits in the room where its hearthstone is starting to form (though the magical stone takes the normal time to develop).

Should the sorcerer not possess a set of plans, she may still create a manse. In this case, however, she cannot cap demesnes rates more than (her Essence – 3). Seating herself in the demesne, she casts the spell as normal. Instead of following the schematics of a savant-engineer, however, she lets Creation itself shape the manse, based on what hearthstone she wants it to create. Such a manse lacks the amenities of man-made structures. Floors are seldom flat, doorways and windows are rarely placed for convenience, and indoor plumbing is impossible.
"""

[[spell]]
id = "rolling-earth-carpet"
name = "Rolling Earth Carpet"
circle = "celestial"
cost = "20+m (committed)"
keywords = ["Shaping"]
duration = "Concentration"
target = "Area"
source = "The Books of Sorcery, Vol II"
pages = "79"
effect = "Earth rolls beneath you (fast travel)"
description = """
The Mudra of the Auspicious Journey releases deep-blue Essence that flows outward, reshaping the land so that it becomes easy to travel through. The land becomes smooth, while puddles of water and mud dry up. This field moves with the sorcerer as he travels, remaking the land before him into perfect traveling territory. Terrain left in his wake returns to normal. This Shaping effect is large enough to encompass 100 marching humans (mounted riders count as two men). For every additional 10 motes spent when casting the spell, the radius increases, allowing the spell to support 50 additional man-sized travelers.

The Rolling Earth Carpet leaves no traces of its passage. Mortal trackers have no chance of following the group's trail, while supernatural trackers do so at a +3 difficulty—even scents and mystical traces are suppressed. The area inside the field is like a warm spring day, with no precipitation or wind above a light breeze (though weather outside the field can still limit vision). Large or artificial terrain features such as hills or buildings are not affected by this spell. Most plants are pushed aside and then return to their natural position, leaving no trail.
"""

[[spell]]
id = "sapphire-circle-banishment"
name = "Sapphire Circle Banishment"
circle = "celestial"
cost = "15+m"
keywords = []
duration = "Instant"
target = "Demon or demons"
source = "The Books of Sorcery, Vol II"
pages = "80"
effect = "Banish a Second Circle demon"
description = """
This spell has special timing rules. The character can cast it as two reflexive Shape Celestial Circle Sorcery actions that take 0 ticks. It has a range of (Essence x 15) yards.
The sorcerer makes the Seven Devils Rebuking sign just before the Victory over Primordials Mudra. Sapphire Circle Banishment forces a single First Circle demon back to Malfeas, without a contest of wills. It can banish a Second Circle demon, but doing so forces a contest of wills, handled as for Emerald Circle Banishment (see p. 44). If the demon wins, it remains in Creation, and the sorcerer cannot attempt to banish it again for five days.
The spell can also banish a group of First Circle demons. This contest is handled as for a Second Circle demon, but the group uses the most powerful demon's (Willpower + Essence) as the base pool and then adds one to the pool per additional demon. If the sorcerer defeats the group (accumulating successes equal to the highest demon's Essence), every demon in the group is banished simultaneously. If the demons accumulate a number of successes equal to the sorcerer's Essence, they remain. In that case, the sorcerer may not attempt to banish any of them (singly or as a group) for five days unless he uses Adamant Circle Banishment.
In war, successful use of this spell can reduce a unit of First Circle demons by a single point of Magnitude.
"""

[[spell]]
id = "servant-of-infallible-location"
name = "Servant of Infallible Location"
circle = "celestial"
cost = "15m"
keywords = []
duration = "Until target is found or dismissed"
target = "One conjured creature"
source = "The Books of Sorcery, Vol II"
pages = "80"
effect = "Conjure infallible tracker/finder"
description = """
Combining the Prayer for Guidance with the Flutter-Wing Mudra, the sorcerer shapes her Essence into a small sparrow of blue flame. The sparrow can find any item, person or place the sorcerer has previously encountered or to which she bears an arcane link. She may also name anything she wants to find, as long as it is within 500 yards and objectively definable: "The nearest man" or "the exit from this maze" is sufficient. "My closest ally" or "a safe place" is not.
The sparrow locates unhidden or mundanely concealed things automatically. Moreover, it is a supernatural tracker with a tracking dice pool of equal to the sorcerer's (Wits + Occult + Essence). The sparrow does not speak or sing, and it cannot travel farther than a few yards from the sorcerer. It tends to fly back and forth to the limits of its reach. The more excited and frantic the little bird's fluttering becomes, the nearer the target lies. The sparrow lasts until the sorcerer finds her target, dismisses the bird or dies. The sparrow is just a puff of shaped Essence, so it neither attacks nor takes damage if it is attacked.
"""

[[spell]]
id = "shadow-theft"
name = "Shadow Theft"
circle = "celestial"
cost = "30m"
keywords = ["Compulsion"]
duration = "Until released, countered, or orb destroyed"
target = "One creature"
source = "The Books of Sorcery, Vol II"
pages = "80"
effect = "Steal target's shadow (long-term)"
description = """
This spell traps a victim's shadow in a crystal orb. The spell requires a small globe of rock crystal (costing Resources 2) set inside an orichalcum cage (costing Resources 4, but reusable).
The spell itself takes one hour to complete. At its end, the target's shadow disappears, and inky blackness swirls in the center of the orb. The sorcerer can then remove the crystal ball from the orichalcum cage.
The target's shadow remains trapped until the caster releases it, Sapphire Countermagic targets the globe, or the orb is destroyed.
As long as the globe holds the shadow, the victim feels a Compulsion to recover it. She can tell what direction her shadow lies just by closing her eyes and thinking about it. The victim can ignore the Compulsion for 28 days by spending a point of Willpower. However, every two months that pass without recovering her shadow halves the duration for which a Willpower expenditure grants reprieve. After the first two months, spending Willpower grants immunity for 14 days, then 7 days, until the tenth month, when the victim can resist the Compulsion for one day by spending Willpower.
On the one-year anniversary of the loss of her shadow, the victim's Motivation goes into abeyance and a new Motivation takes its place: "Recover my shadow." Once she fulfils this artificial Motivation, her old one returns. A character gains no benefit from fulfilling this artificial Motivation (such as it counting as training time for raising permanent Essence).

Using the Shadow-Orb:
Cost: 5m (committed)
Target: The creature whose shadow is within the orb
A sorcerer can merely hold a person's shadow for ransom, but the orb possesses two other functions.
• The trapped shadow serves as an arcane link to the victim. It can replace any other arcane link a spell may require. The target always knows if her shadow is used as a sorcerous link back to her.
• The sorcerer may spend five motes to see through the target's eyes. This shared vision lasts for one minute, but that is often enough to discern the target's location and her current activities. The sorcerer's player rolls (Perception + Occult) to do so, and this roll may benefit from Excellencies. The target receives a reflexive (Wits + [Integrity or Occult]) roll to resist. Regardless of whether the victim wins this contest, her player also attempts a reflexive (Perception + Occult) roll, with a difficulty equal to the sorcerer's Essence, to realize that her shadow was just used to see through her eyes.
"""

[[spell]]
id = "shadows-of-the-ancient-past"
name = "Shadows of the Ancient Past"
circle = "celestial"
cost = "25+m"
keywords = []
duration = "Willpower minutes"
target = "Area"
source = "The Books of Sorcery, Vol II"
pages = "81"
effect = "Replay past events as shadow show"
description = """
Essence remembers. The dragon lines of an area preserve subtle records of every event. The sorcerer using this spell sends shimmering threads of silver-blue Essence into the dragon lines of an area, delving into its past, then resurfacing as a silvery fog that spreads (Essence x 20) yards from the caster. This area does not move thereafter. A scene from the past plays out on this mystic screen as a ghostly overlay on the sorcerer's present surroundings.
The sorcerer has a choice. She can specify a time in the past, such as "50 years ago, third day of Resplendent Earth, four hours after sunrise," or she can specify an event that involved a particular object in the area, such as "When you died," (for a skull she unearthed) or "When your construction was complete" (for a manse). In the former case, the sorcerer knows when a scene happened, but doesn't know in advance whether she will see something important. In the latter case, the sorcerer can aim for an important event, but doesn't know when it actually happened. Either way, the sorcerer must give some objective definition of a time. The sorcerer is also limited to scenes that occurred at most (Occult x 100) years in the past. If the Wyld passed through an area, however, it shattered the memory of the dragon lines there, and the spell can only view the time after the Wyld receded.
Shadows of the Past runs for a number of minutes equal to the sorcerer's Willpower. In this time, the sorcerer or other people can move around the scene to look at details and other angles. By spending another five motes, the sorcerer can freeze the action for one minute to examine something more closely, but doing so does not extend the spell's total duration. The sorcerer can move no faster than a normal Move action. If the sorcerer is attacked, her player must roll just as if the spell were interrupted during the Shape Celestial Circle Sorcery actions. Failure means the spell ends.
"""

[[spell]]
id = "summon-ghost"
name = "Summon Ghost"
circle = "celestial"
cost = "15m"
keywords = []
duration = "Up to one month"
target = "Ghost"
source = "The Books of Sorcery, Vol II"
pages = "81"
effect = "Summon and bind one ghost"
description = """
This spell works like the necromancy version (see The Black Treatise, pp. 34-35), but the ghost may not be compelled to serve for longer than a month. The rite also takes three hours instead of one, and the caster sprinkles honey, wine and barley upon the ground as well as blood.
"""

[[spell]]
id = "summon-spirit-boat"
name = "Summon Spirit Boat"
circle = "celestial"
cost = "30m"
keywords = []
duration = "One journey"
target = "Summoned ship"
source = "The Books of Sorcery, Vol II"
pages = "81"
effect = "Summon a sailing spirit-vessel"
description = """
As the sorcerer wades out from the beach, a ship builds itself from the sun's light upon the waves, becoming a sparkling, translucent white bireme under her feet. She may speak the name of any maritime location from where she stands on the deck, and the spirit boat rows her there.
The bireme serves tempting repasts to the sorcerer and her guests and can create individual rooms for as many people as it can carry. The sentient boat is clever enough to avoid submerged hazards such as reefs or shoals, and it requires no crew to row or direct it beyond the sorcerer herself. The sorcerer may delegate command to someone else, as long as that person has at least one dot of Sail and has always treated the ship with respect. She may place conditions upon that command, however.
Countermagic does not dispel the bireme, for it is summoned rather than conjured. That means, however it was summoned from somewhere—namely the private boathouse of the Dragon Fakharu, Celestial Censor of the West (see Exalted, p. 302). Fakharu does not mind lending his biremes to sorcerers, but he automatically knows the name, status and current whereabouts of anyone who borrows one of his ships.
Note also that the ship cannot ferry a sorcerer to a location Fakharu does not know. This limiting factor is almost never relevant, though. Many sorcerers don't even realize it exists.

Spirit Boat Stats:
Speed: 30/60 mph
Maneuverability: +4S
Endurance: One journey
Crew: 1/2 (only the sorcerer)
Cargo: One talon of infantry, or equivalent mass and volume
Armor: 20L/20B
Health Levels: Ux25/Mx10/Cx10/Ix5/D
Weapons: None
Other Notes: The bireme's hull functions like a First Age hull, so it doesn't take on water like a normal ship.
"""

[[spell]]
id = "summon-the-heavenly-portal"
name = "Summon the Heavenly Portal"
circle = "celestial"
cost = "35m"
keywords = []
duration = "5 minutes"
target = "Summoned Calibration Gate"
source = "The Books of Sorcery, Vol II"
pages = "82"
effect = "Open a gate to Yu-Shan or elsewhere"
description = """
Once a year, on the third night of Calibration, the Celestial City of Yu-Shan revels in the Carnival of Meeting. In ages past, mortal and Exalted dignitaries would be invited to Heaven to join the festival, but in these debased times, the gods of Yu-Shan neglect the world.
The starmetal Calibration Gate still appears in Creation once a year to admit mortals to the Carnival, though the gods send out no invitations. During that night, it cannot be summoned. For the rest of the year, though, a sorcerer may call it with this spell.
The sorcerer evokes a foot-wide patch of rippling gold, like sunlight on water. He reaches into it, feels for a handle, and pulls. A celestial bell chimes. A minute later, the Calibration Gate appears. It materializes with equal aplomb outside, indoors, underwater or even in midair. It remains open for five minutes before vanishing again, and it cannot be re-summoned to any place within a mile of that location until a day and night have passed.
No known force can damage the gate. Any number of characters can pass through the Calibration Gate, although they cannot leave Heaven by the same route. What's more, if they have no official place or legitimate business in the Celestial City, they need quite an argument to persuade the three giant orichalcum lions on the near side to let them pass. These celestial lions respect honor and justice but are nigh-undefeatable in battle and immune to mind-affecting magic. (And there are six more waiting on the other side of the door.)
Many of the Sidereal Exalted know this spell and use it to return from their assignments within Creation. A few Lunar sorcerers know it too and use it to confer with allies in the celestial Bureau of Nature. Sidereal leaders worry what Solar sorcerers might learn if they obtain access to Yu-Shan. Any Abyssal Exalt who tried using the Calibration Gate would likely regret it in very short order—nine orichalcum lions notwithstanding.
"""

[[spell]]
id = "summoning-the-greater-minions-of-the-eyeless-face"
name = "Summoning the Greater Minions of the Eyeless Face"
circle = "celestial"
cost = "30+m"
keywords = []
duration = "Until dismissed or killed"
target = "Summoned minions"
source = "The Books of Sorcery, Vol II"
pages = "83"
effect = "Summon greater Eyeless minions"
description = """
The greater minions of the Eyeless Face are pulled into Creation through a pool of oil in a ritual much like lesser minions of the Eyeless Face are (see p. 65). The greater minions possess mouths, though only some possess lips. Sometimes, their mouths are vertical splits running down the center of their blank faces. Nevertheless, they do not speak. A few greater minions possess blackened bulges or indentations at the sides of their head, in multiples of two, as if they had tried to form pairs of eyes or ears during their evocation. During the summoning, greater minions do not whimper. Like the lesser minions, they emerge naked and sexless.
The sorcerer calls forth a number of greater minions equal to her (Charisma + Essence), plus one more for each additional five motes she spends during the casting. Unlike lesser minions, the sorcerer's player defines the traits for the greater minions as if they were heroic mortals. Though they receive no Backgrounds, greater minions have 15 bonus points plus one additional bonus point per extra mote spent during the casting. (These bonus points may not be spent on Backgrounds.) The player may create each greater minion with separate and unique traits. Greater minions benefit from the same immunity to bleeding, infection and Poison and Sickness effects as lesser minions, but they heal as Exalts do. Since they are magical beings, round up when calculating the greater minions' DVs. Greater minions have Essence 2 and the Motivation, "Serve the sorcerer who pulled me from imprisonment."
The greater minions try to create identities for themselves before they die. They often decorate themselves with improvised piercings or jewelry when the sorcerer isn't looking, and they defy any commands to remove these marks of individuality. A sorcerer can have one batch of minions of the Eyeless Face under her control at any given time. Summoning the greater minions of the Eyeless Face kills her lesser minions, and vice versa.
"""

[[spell]]
id = "summoning-the-heart-of-darkness"
name = "Summoning the Heart of Darkness"
circle = "celestial"
cost = "30m"
keywords = ["Obvious"]
duration = "24 hours"
target = "Area"
source = "The Books of Sorcery, Vol II"
pages = "83"
effect = "Summon Heart of Darkness servitor"
description = """
The sorcerer knots strands of Essence infused with silence, darkness, confusion and terror. A black pillar explodes upward, surrounding the caster and extending outward a mile in every direction and 10 miles into the air.
Within this pillar of darkness, blind terror reigns. Sounds become muffled and seem to come from everywhere at once. Only screams ring out clearly, though they still seem to come from all around. In a large group, victims need successful Valor checks, difficulty 3, lest they give in to panic. Entire armies have slaughtered themselves when caught by the Heart of Darkness.
The ebon column does not have a solid boundary, though. Anyone can enter the area, and anyone who finds its edge can escape it.
Creatures with supernaturally enhanced senses or that can perform supernatural tracking may operate within the darkness at a -2 internal penalty to all actions. (The zone is still unnerving and disorienting.) Creatures without such senses become lost within the darkness, wandering around in confused circles or stumbling into one another (often with bloody results). Such creatures have the difficulty of all actions they take increased by an amount equal to the sorcerer's Essence.
The caster is not immune to these effects. Unless countered, Heart of Darkness lasts for 24 hours, even if the caster is slain.
"""

[[spell]]
id = "swift-spirit-of-winged-transportation"
name = "Swift Spirit of Winged Transportation"
circle = "celestial"
cost = "25m"
keywords = ["Obvious"]
duration = "Until destination reached, destroyed, countered, or released"
target = "Vessel"
source = "The Books of Sorcery, Vol II"
pages = "83"
effect = "Conjure a flying spirit-steed"
description = """
The sorcerer stands on the target vessel or within a number of yards of it equal to his Essence. This vessel may be a ship, a wagon or even a small building. The Sign of Ten Thousand Feathers shapes his Essence into an automaton that appears as a mass of huge, feathered wings. It has no head, eyes or other features, save for a pair of gigantic, five-taloned claws. The Swift Spirit is 500 feet long and 200 feet wide, and it can carry up to 1,000 tons. Old texts call it a demon or spirit, but the thing is an automaton: It has no existence outside of its creation by this spell.
The automaton lifts the vessel and presses it along its underside, creating a strange canopy of wings that protects the vessel from wind and weather. The automaton flies up to a mile high and 200 miles per hour. If the sorcerer is not aboard the vessel, he must give the swift spirit a destination when he creates the automaton. It flies off for that destination without pause. If the sorcerer is aboard the vessel, he may order the automaton to change direction and destination as he pleases. He can order it to set the vessel on land or sea or even to drop it from a great height. Only flat-bottomed vessels can land intact on dry ground; other vessels are likely to break up or fall over when set down.
The largest flat-bottomed vessels appropriate for the use of this spell in Creation today are wide-beamed merchant freighters. Such ships are 300 feet long, 120 feet wide and can carry up to 400 people and hundreds of tons of cargo. The automaton exists either until it reaches its destination and lands the vessel, until it is destroyed or countered, or until the sorcerer releases it.

Automaton Stats:
Motivation: To carry the vessel to its destination
Attributes: Strength 55, Dexterity 5, Stamina 20; Charisma 2, Manipulation 2, Appearance 5; Perception 2, Intelligence 3, Wits 2
Virtues: Automaton: Never fails Valor checks, never makes others.
Abilities: Athletics 10, Awareness 3, Dodge 4, Martial Arts 5, Resistance 10
Join Battle: 5
Soak: 10L/20B
Health Levels: -0x4/-1x6/-2x8/-4x4/Incap
Dodge DV: 6
Willpower: 10 (0 against the sorcerer)
Essence: 3
Other Notes: The automaton gains a +35 to all Feats of Strength that involve lifting. It also flies at 200 miles per hour (or 100 yards per tick).
"""

[[spell]]
id = "threefold-binding-of-the-heart"
name = "Threefold Binding of the Heart"
circle = "celestial"
cost = "30m"
keywords = ["Compulsion", "Emotion", "Servitude"]
duration = "Indefinite (see text)"
target = "One being"
source = "The Books of Sorcery, Vol II"
pages = "84"
effect = "Lock target's Intimacy in 3 ways"
description = """
Ropes of orange and yellow light coil around the target and wrap around her spine, ending in three knots through the heart of the victim of the type fishermen of the Coral Archipelago swear will never work loose.
Mortals are snared automatically. Against Essence wielders, the sorcerer attempts a magical social attack. His player rolls (Manipulation + Occult), adding a number of automatic successes equal to his Essence, against the target's Dodge MDV. If this attack succeeds, the victim is under an unnatural mental influence that creates a Compulsion effect (a powerful Intimacy to the sorcerer), an Emotion effect (love) and a Servitude effect. Since powerful beings often have ways to resist these effects, sorcerers prefer to cast Threefold Binding of the Heart on Essence wielders who are asleep or unconscious, rendering the target's Mental DV inapplicable.
A victim of this binding falls madly in love with the sorcerer. This love can manifest as anything from a lover's sexual passion to a soldier's patriotic loyalty, depending on what cues the sorcerer gives the victim. The victim feels these emotions are true and genuine, but others can see how the victim is ensorcelled. This devotion is absolute, and the victim might go out of her way to remove anything that distracts or contradicts her connection with the sorcerer—even murdering people she used to love if they try to keep her from her beloved master.
A spellbound victim can spend a point of Willpower to resist a direct command or three Willpower to resist the sorcerer's control for a scene, but she needs an overwhelming reason to do so—such as being ordered to do something against her core morals or something she knows will harm the master's interests. Eroding the spell-forged Intimacy is quite difficult. Doing so requires a number of successful social attacks equal to the sorcerer's (Occult + Essence) to break the Intimacy. For each day that passes, one successful attempt is negated, "regenerating" the Intimacy.
On the subject's birthday, however, she is granted an unconscious attempt to break free from the Threefold Binding. Savants attribute this reprieve to the gods of the days. Each day in the year has a god, and these gods note the fates written in the stars for everyone born on their day. Threefold Binding of the Heart forces a blatant change to a victim's fate, unlike the more subtle changes to destiny that Sidereals create. Such clumsy changes anger the day gods, so on the day it is most powerful, the victim's day god tries to unravel the knots through the target's heart. On this day, the target's player makes a reflexive (Wits + Integrity) roll, with a difficulty equal to the sorcerer's Essence. This roll may not be augmented by Charms, channeling Virtues or spending Willpower, though. The subject doesn't want to break the bond and does not even know the opportunity has occurred. If the roll succeeds, however, the Threefold Binding frays, and she is freed… to realize what the sorcerer did to her.
"""

# Pages 86-90: More Celestial Circle spells and beginning of Solar Circle

[[spell]]
id = "torrential-cascade"
name = "Torrential Cascade"
circle = "celestial"
cost = "30m"
keywords = ["Obvious"]
duration = "Essence x 5 ticks"
target = "One body of water"
source = "The Books of Sorcery, Vol II"
pages = "85"
effect = "Tidal wave area attack"
description = """
The sorcerer hurls a ball of blue Essence-flame into a sea, lake, river or other large body of water that must be within 100 yards. White-capped waves form, and the roar of rushing water fills the air. On his second Shape Celestial Circle Sorcery action, the sorcerer raises his arms to the sky as a wall of water 20 yards high and 100 yards long rises from the body of water. Everyone within five miles receives a reflexive (Perception + Awareness) roll to notice this very loud event.
On his Cast Sorcery action, the sorcerer points in the direction he wishes the torrential cascade to flow and the wall of water surges outward on its journey. It travels at 50 yards per tick for (sorcerer's Essence x 5) ticks, remaining 20 yards high and 10 yards thick as it moves.
The torrential cascade destroys small buildings outright, and buildings larger than a single story take 45 levels of bashing damage as the cascade passes. For the purpose of moving large things, the torrent has a (Strength + Athletics) total of 35. Creatures caught in its path take environmental damage (5B/tick, Trauma 4). See Exalted, p. 130 for environmental damage rules. Escaping the torrent requires a ([Strength or Dexterity] + Athletics) roll, difficulty 4.
When the torrential cascade reaches its full length, the wall of water collapses, and the water drains naturally from that point. An affected region on land remains soaked and devastated; once-dry earth becomes deep mud or scoured arroyos. The area may take weeks to return to normal (if it ever does). Countermagic can collapse the wave prematurely.
"""

[[spell]]
id = "unity-of-dreams"
name = "Unity of Dreams"
circle = "celestial"
cost = "10m per participant"
keywords = []
duration = "Essence months (after required nightly castings)"
target = "Caster and allies"
source = "The Books of Sorcery, Vol II"
pages = "85"
effect = "Link sleepers in a shared dream"
description = """
The sorcerer binds the dreams of the ritual's participants (including herself) to one another using the Sign of Venus. Unity of Dreams must be cast once a night per participant for the magic to take hold, with everyone in the same room. The spell's Essence settles on participants as saffron motes of light. After the required number of castings over consecutive nights, the spell lasts for a number of months equal to the sorcerer's Essence.
The participants' dreams intermingle and allow them to communicate while sleeping, as long as they are all in Creation. Not only does the fluid nature of dream consciousness not hamper this dream communication, but participants have trouble hiding important facts and events from each other. A closeness develops on a subconscious level. People linked in this spell have their Intimacies for one another augmented. Eroding Intimacies to other dreamers now takes a number of successful social attacks equal to the character's (Willpower + Conviction).
Unity of Dreams extends to understanding what will best aid another participant while awake, too. All participants gain a one-die bonus to all actions when working or fighting beside each other.
At any time when all the participants are asleep and dreaming, one of the dreamers may ask the others to join her. The bond of the spell then transports the other sleepers to the character who requested their presence. All participants must agree or none will arrive. Several seconds later, they all awaken to find themselves together. Invoking this transportation has a cost, though. It consumes the energies of the spell, ending it prematurely. Moreover, this spell does not help the dreamers return home.
"""

[[spell]]
id = "voices-of-distant-regard"
name = "Voices of Distant Regard"
circle = "celestial"
cost = "25m"
keywords = []
duration = "Until next sleep"
target = "Caster"
source = "The Books of Sorcery, Vol II"
pages = "85"
effect = "Speak long-range to all known names"
description = """
The word that describes a god's ability to hear petitioners' prayers doesn't have a translation. It is an onomatopoeia of the buzzing mumble that gods hear when they attend to their worshipers' prayers. A sorcerer who knows this spell can speak this word, infuse it with his own Essence and emulate the divine ability until the next time she sleeps.
While the spell is active, the character hears any people who talk about her, as clearly as if she stood beside them. A conversation does not need to include the sorcerer's name. The caster knows the approximate distance and direction of each conversation and can recognize voices she has heard before.
If multiple conversations occur at once, the sorcerer's player rolls (Perception + Awareness), with a difficulty equal to the number of simultaneous conversations she hears. Alternatively, she may ignore all but one, negating the need for a roll. The sorcerer can also listen and talk to a person in her company while she's listening to these remote conversations by increasing the above roll's difficulty by 1, though she will seem somewhat distracted.
"""

[[spell]]
id = "wheel-of-the-turning-heavens"
name = "Wheel of the Turning Heavens"
circle = "celestial"
cost = "35m"
keywords = ["Illusion", "Obvious"]
duration = "Essence x 30 minutes"
target = "Area"
source = "The Books of Sorcery, Vol II"
pages = "85"
effect = "Vast spinning wheel grants insight"
description = """
This spell cannot be cast during the day. When cast, the sorcerer's Essence shoots upward as a brilliant beam of white light and explodes like a fireworks display visible to every creature within (Essence x 100) yards who can see the sky. Instead of fading, the sparks slowly swirl clockwise in kaleidoscopic displays that last (Essence x 30) minutes. In the center floats the sign of the Maiden of Serenity. The interlacing sparks trace out many astrological sigils the Sidereals would rather keep to themselves… but no one will remember them.
All sentient creatures are entranced by the display and forget what they were doing. They take no actions. When the spell ends, they do not remember what happened while they stared at the sky. People outside the area just see pretty lights (though the display might attract them into the spell's area). The sorcerer himself is immune. Once he casts the spell, he may take other actions normally.
Players of Essence wielders may roll (Wits + Integrity), difficulty equal to the caster's Essence, to break free and look away from the blazing display. This roll must be repeated each time the character sees the sky during that period. Averting one's gaze inflicts a -2 dice penalty to all actions taken in locations where the sky is visible. Instead, Essence wielders may spend three Willpower to resist the Illusion effect for a scene. The spell ends if Sapphire or Adamant Countermagic targets the sorcerer, if the caster is slain, or if any creature enchanted by the spell is harmed while entranced.
This spell was actually developed for entertainment. If the sorcerer spends only 15 motes, the result is a beautiful, distracting but harmless display.
"""

[[spell]]
id = "whirlwind-of-fate"
name = "Whirlwind of Fate"
circle = "celestial"
cost = "20m"
keywords = []
duration = "Essence hours"
target = "Caster"
source = "The Books of Sorcery, Vol II"
pages = "86"
effect = "Whirlwind of fate scatters foes"
description = """
By standing motionless during the casting of this spell, the caster observes the weaves of Fate. In the light of her anima, the caster can see how every creature and object in her immediate vicinity is tied to every other and interpret how those interactions can be turned to her own advantage.
When the sorcerer casts the spell, she names a goal, and the whirlwind of information can then be read to aid in this goal. The caster's player rolls (Intelligence + Occult). Each success on this roll adds two to a finite pool of bonus successes. The player may take bonus successes from this pool and add them to any roll that furthers the goal he stated when casting the spell. The pool lasts for a number of hours equal to the sorcerer's Essence.
A maximum number of bonus successes equal to the caster's Essence may be added to any given action, but they may explicitly stack with bonus dice or successes gained from other sources, such as Excellencies. These bonus successes may be added to any roll, including damage rolls.
If the sorcerer's stated goal is not completed by the time the spell's duration ends, she suffers an internal penalty to all actions equal to the number of bonus successes she already used, until she can meet the goal (or the next sunrise in any case).
"""

# Solar Circle (Adamant) spells begin here

[[spell]]
id = "abjuration-of-the-maidens"
name = "Abjuration of the Maidens"
circle = "solar"
cost = "40m + 1lhl"
keywords = []
duration = "5 days (renewable)"
target = "Area (Essence) miles in diameter"
source = "The Books of Sorcery, Vol II"
pages = "86"
effect = "Banish a Third Circle demon"
description = """
Creation's sky holds 25 constellations of special import: five sets of five, each set in the domain of one of the Maidens of Fate. The sorcerer takes five hours to mark each constellation's sigil in an enormous circle upon the Earth, one with a diameter that stretches a number of miles equal to his Essence. The sorcerer then may call upon the power of all Five Maidens to defend that place. A small, central circle holds the Unspoken Word, a glyph every thinking creature understands but none may speak.
Once this spell has been invoked, the 25 great signs—above and below—begin to glow, though the constellations' gleam is seen only within the spell's area. The caster cuts her hand and pours her blood upon the central sign. Strands of her blood become light as they fall from her fingers, as matching radiance shoots into the sky from the 25 signs and surrounds the warded area's boundary with an iridescent flare.
For five days, neither Charms nor sorcery may pass the circle's boundary. Powers that create an area of effect may be used outside it even if their area would normally extend into the protected space, but the magic fails at the barrier and within. Hearthstones and their effects, the magical materials and the abilities of spirits with a higher Essence than the sorcerer are all unaffected by Abjuration of the Maidens, but no Essence wielder may use any other magic within its bounds. Only a sorcerer whose Essence surpasses the caster's may destroy this spell with Adamant Countermagic, and that only while standing upon the central rune. The spell may be renewed for another five days at any time, for the same Essence cost.
"""

[[spell]]
id = "adamant-circle-banishment"
name = "Adamant Circle Banishment"
circle = "solar"
cost = "20+m"
keywords = []
duration = "Instant"
target = "A demon or demons within (Essence x 15) yards of the sorcerer"
source = "The Books of Sorcery, Vol II"
pages = "87"
effect = "Banish a Third Circle demon"
description = """
As the Emerald Circle Banishment, the sorcerer may use this spell to remove demons from Creation. The Victory over Primordials Mudra, augmented by the Calibration-Denying Sign, can expel a demon of the Third Circle, making it as though the Calibration during which it was summoned had never happened.
This spell has special timing rules. The character can cast it as three reflexive Shape Solar Circle Sorcery actions that take 0 ticks. It has a range of (Essence x 15) yards.
Adamant Circle Banishment automatically casts a Second Circle demon or a group of First Circle demons back to Malfeas. It can banish a Third Circle demon, but doing so forces a contest of wills, handled exactly as for Emerald Circle Banishment (see p. 44). If the demon wins, it remains in Creation and the sorcerer cannot attempt to banish it again for five days.
The spell can also banish a group of Second Circle demons. This contest is handled as for a Third Circle demon, but the group uses the most powerful demon's (Willpower + Essence) as the base pool, then adds +1 to the pool per additional demon. If the sorcerer defeats the group by accumulating successes equal to the highest demon's Essence, the demons are all banished. If the demons accumulate a number of successes equal to the sorcerer's Essence, they remain. In that case, the sorcerer may not attempt to banish any of them (singly or as a group) for five days.
In war, successful use of this spell can reduce a unit of First or Second Circle demons by a single dot of Magnitude.
"""

[[spell]]
id = "atrocious-fire-transformation"
name = "Atrocious Fire Transformation"
circle = "solar"
cost = "35m"
keywords = ["Shaping"]
duration = "Essence hours"
target = "Body of water"
source = "The Books of Sorcery, Vol II"
pages = "87"
effect = "Vast firestorm, scene-long"
description = """
In the uttermost South, lakes and rivers of fire flow like water. The sorcerer copies the Essence of the South's liquid fire and casts it into a body of water—and 10-yard-high scarlet flames sweep over its surface. The resultant burning water flows and eddies, just as normal water does, but it also ignites everything it touches that could conceivably burn. Everything caught in the flames is destroyed, except enchanted objects or those made from the magical materials. The flaming water deals environmental damage (6A/action, Trauma 5).
The burning water cannot be quenched. Other water that comes in contact with it will be vaporized. If the added water is a truly enormous quantity—if, for example, a transformed fire-river flows into a lake of normal water—then the water will heat, but not boil, with the burning water floating on top of it.
Atrocious Fire Transformation lasts a number of hours equal to the sorcerer's Essence, and the caster herself is immune to the flames. This spell works on any body of water, even that created or enhanced with magic. The flames extend one mile outward from the caster. On still waters the effect is static; on a river, the flaming water flows downstream, and new flames continually appear at the point of casting. A medium-sized river—for these purposes, any river that does not appear on the map printed on the Exalted endpapers—can be covered in flames from bank to bank.
For the duration of this spell, elementals associated with the transformed body of water become fire elementals. All their traits remain the same, but their Charms become fire-based and their attitudes, appearances and emotions fluctuate violently, at the Storyteller's discretion.
"""

[[spell]]
id = "benediction-of-archgenesis"
name = "Benediction of Archgenesis"
circle = "solar"
cost = "40m"
keywords = ["Shaping"]
duration = "Permanent (first year supernatural, thereafter natural)"
target = "Area"
source = "The Books of Sorcery, Vol II"
pages = "88"
effect = "Flood a region with new life"
description = """
Within herself, a Solar Circle sorcerer holds a living power to compare with the fury of a tsunami, the force of an earthquake—or the still, quiet resilience of an ancient forest. As she chooses to give herself to the land around her, the Solar grants it all the bounty and vitality of her own Exalted Essence. Whether a stinking, rotting swamp or a barren, rocky plateau, any land may be remade, lush and arable. The benediction covers up to (Essence x 100) square miles of consistent terrain—all desert, all mesa, all marshland or the like.
At sunset on the new moon of Ascending Water, the character begins casting Benediction of Archgenesis from the geomantic center of the domain she wishes to revitalize. Shaping this spell is a dramatic action that lasts until sunrise. The sorcerer cuts her bare feet so that her blood falls upon the ground. From then on, she walks in an expanding spiral, pouring her life into the earth drop by drop, sacrificing five levels of aggravated damage. At sunrise, clouds gather overhead and release a soft, warm rain to wash the sorcerer's blood into the land.
The effects of the benediction become apparent to the naked eye just after the rain stops. Any snow or ice on the ground has melted completely, and for a few days thereafter, any flowering plants already in the region will bloom. By Resplendent Earth, all the plants throughout the region grow larger and healthier. Animals come to nest and play. By summer, the place is transformed. Desert becomes soil; bogs drain. The Blessed Isle never saw such lush growth. The weather is more temperate, the days blessed only by the briefest of showers. Both local animals and people bear unprecedented numbers of healthy offspring. This effect reduces the difficulty of all Survival rolls in the region by one and increases the typical Compassion of extras from that region by one dot. Transforming wasteland into land where people and wholesome creatures can easily live is a Shaping effect.
Only Adamant Countermagic can disrupt the new environmental harmony if someone uses it for that purpose within the first year. Otherwise, the place remains a lush and fertile land. Although the region's initial, supernatural fecundity will not continue after the first year, the blessed region will remain arable forever, with proper care.
Gaia's gifts have limits, though. Using Benediction of Archgenesis on land that can already be farmed gives one year of frenzied, hyper-normal fertility—followed by 10 years of deadly famine from the exhausted earth.
"""

[[spell]]
id = "chariot-of-the-blazing-sun"
name = "Chariot of the Blazing Sun"
circle = "solar"
cost = "45m"
keywords = ["Obvious"]
duration = "Until sunset or destination reached"
target = "Summoned chariot"
source = "The Books of Sorcery, Vol II"
pages = "88"
effect = "Summon blazing solar chariot"
description = """
The sorcerer sends a triple helix of red, white and golden Essence toward the sun. Out of the sun ride five horses of white fire, pulling a chariot of pure, golden Essence—a copy of the chariot used by the Unconquered Sun himself, pulled by celestial stallions from his own stables.
The sorcerer needs at least one dot of Ride to control the powerful, spirited sun horses. The caster must include a controlling Ride action in a flurry if she wishes to perform any other action while driving. If the caster performs no other action that would require a dice roll, the chariot is quite safe to drive and requires no roll.
Since the chariot travels at 750 miles per hour, few opponents could keep up with the sorcerer and her passengers. Should an angry celestial dragon or the like do so, then the searing white flames around the chariot inflict three levels of aggravated damage after every hand-to-hand attack. The same flames devour any missiles save those made of a magical material or those fortified by Essence. Against these, the chariot provides 90% hard cover (see Exalted, p. 147) to its passengers. If something forces the chariot to crash, everyone on board takes 45 levels of lethal damage.
The chariot (and its passengers) are not affected or delayed by extremes of environment, even the terrors of the Wyld. It can penetrate to Yu-Shan or the elemental poles, and it deflects any sorcery of the Emerald or Sapphire Circles. The horses continue to run proudly through the sky until they reach the sorcerer's destination or the sorcerer dismisses them, at which point they let their passengers out safely and gallop back to their grooms in Yu-Shan. The horses will not serve after sunset, however, and if the sorcerer tries to force them to, they buck, slip their traces and the chariot crashes. Dispelling the chariot causes it and the horses to disappear, with the same results on passengers as a crash.

Chariot Stats:
Speed: 360/750mph
Maneuverability: -3
Endurance: Until sunset
Crew: 1/2 (only the sorcerer)
Cargo: Five people, or 2,000 pounds
Armor: Infinite
Health Levels: Infinite
Weapons: None
"""

[[spell]]
id = "cleansing-solar-flames"
name = "Cleansing Solar Flames"
circle = "solar"
cost = "50m + 10m per 50 square miles beyond the first"
keywords = ["Obvious", "Shaping"]
duration = "Permanent"
target = "Touched shadowland"
source = "The Books of Sorcery, Vol II"
pages = "89"
effect = "Holy solar flames cleanse area"
description = """
This spell must be cast during the day at the geomantic center of a shadowland—that place through which all its Essence flows are poisoned. As the sorcerer casts Cleansing Solar Flames from that point, sunlight pierces the shadowland's miasma, shining warmly upon the caster and collecting in growing clouds until a thunderhead of light rises above her, visible for miles. And then, the sorcerer lifts her head in a piercing cry as the sun-cloud impales her with a bolt of golden lightning that passes through her into the ground and explodes outward in a glittering wave. The solar lightning holds the sorcerer for 10 minutes per 50 miles of shadowland she converts. When she is done, the sun-cloud dissipates, and normal sunlight shines over land that is now severed from the Underworld and fully part of Creation once more.
If the sorcerer is moved or her attention wavers at any time during the cleansing, then this entire spell fails. Black storm winds of deathly Essence rip across the sky and scatter the sun-cloud in a terrifying (though harmless) backlash.
"""

[[spell]]
id = "curse-of-unyielding-mist"
name = "Curse of Unyielding Mist"
circle = "solar"
cost = "40m"
keywords = []
duration = "Until condition is met (potentially permanent)"
target = "Area"
source = "The Books of Sorcery, Vol II"
pages = "89"
effect = "Region locked in cursed mist"
description = """
As the sorcerer stands within the area she hates (which must all, in the local tongue, fall under a single name), the sorcerer intones the reason for her rage and names a condition that will alleviate her curse. This condition may be as simple—"The king of this country must kneel before me, and kiss my feet"—or as arcane—"Everyone within this land must speak nothing but the exact truth for a month"—as the sorcerer wishes, as long as it could conceivably be fulfilled within the land's borders. The spell fails if the condition requires actions from the Incarnae, major spirit courts or anyone else with no particular connection to the region.
As the sorcerer speaks, purple lightning flickers in her anima. She catches these sparks and ties them into 15 knots. Tendrils of fog reach from her anima and spread through the cursed land. Dank gray mist fills the land from the ground to 100 feet above. Nothing, even the most immediate of objects, is clearly visible, and even the vague shadows of one's surroundings fade into the grayness within 10 feet. Day or night makes no difference, for the fog shines with its own faint, eldritch radiance. Characters within the mist quickly grow dispirited, inflicting a -2 internal penalty on all social interactions therein. (Essence wielders may avoid this penalty by succeeding on a daily Valor check.)
The mist covers (Essence x 10) square miles. Within a month, all the plants that grow within that place have withered and begun to rot. Bizarre fungi grow and spread rapidly, from films of mold to gigantic shelf fungi and puffballs. The fungi will not grow on the flesh of living creatures, but it will grow on their clothes and fingernails, and in their hair. The ecology of decay will eventually eat up anything organic within the mist, but it cannot grow outside the mist and is destroyed by the slightest touch of sunlight.
Invulnerable to all outside forces save the will of the Incarnae—including, once it has been cast, Adamant Countermagic—the mist forever will darken the lives and hearts of everyone within, unless and until the sorcerer's condition is met. If everyone leaves in despair, the mist shall never lift. The evil mist has shrouded few horror-haunted provinces since the First Age, and no one now knows how to lift the curse.
"""

# Pages 91-95: Continuing Solar Circle spells

[[spell]]
id = "enemy-of-nature"
name = "Enemy of Nature"
circle = "solar"
cost = "50m"
keywords = []
duration = "One month, or until name is forgotten"
target = "One entity or social group"
source = "The Books of Sorcery, Vol II"
pages = "90"
effect = "Nature itself attacks the cursed"
description = """
At the end of a chant that invokes the rage of all things natural, the sorcerer utters a name that resounds across the nearby hills and valleys. Some say that a careful listener can hear it whispering through the trees and grasses from over 1,000 leagues away. It must be the specific name of a person or creature, a region or a group no larger than Magnitude 9 (Magnitude 3 in the Mandate of Heaven). At that moment, the owner of that name becomes anathema to all things living. Plants strain to trip or strangle the targets, and even the most docile beast of burden attempts to bite and trample her. All creatures who sense a target of this spell become ferocious and uncontrollable, and they do their very best to kill her with no regard for their own lives. In lands completely devoid of life (only the Underworld and Essence-blasted wastelands really meet this criterion), a target is potentially safe. In other regions, she suffers the following effects:
• She suffers a -1 to -3 external penalty to all actions as swarms of vermin and masses of plants impede her, based on the region's fecundity. All but the least hospitable regions of Creation host creatures or roots enough to inflict the least penalty. Lava rats live in the Southern expanses of volcanic stone, for instance, while ice hornets nest in the worst wastes of the North. In the jungles or forests of the West and East, life is so abundant it becomes difficult to accomplish anything at all. Although this penalty represents the difficulty for powerful entities (an Exalt, a city) to act under such conditions, the massed assault of vermin and insects can kill individual mortals.
• Larger animals attack the target on sight. Massed creatures attack as an unordered mass combat unit with Drill 0. Plants with enough size and maneuverability may also attack. When the target is a social group, creatures only enter mass combat with units of comparable size. Very large creatures can count as mass combat units all by themselves.
• Unless a victim travels through a lifeless region, the harassment and danger impedes travel. Halve all travel rates, or consider all terrain extreme when using complex travel.
The Solar has a choice how long the curse lasts. She may curse the target for one month. Alternatively, the sorcerer can decree a curse that lasts as long as the targeted name endures. An individual is almost doomed to be tormented by hateful creatures and plants wherever she goes, however long she lives. Changing her name would certainly be a legendary quest, for names are recorded in the stars. Military units, cities and societies can earn different names over time, but the curse endures until no living creature still thinks of the social group by the accursed name. Once a sorcerer casts Enemy of Nature, she cannot revoke the curse.
"""

[[spell]]
id = "essence-inversion"
name = "Essence Inversion"
circle = "solar"
cost = "50m"
keywords = []
duration = "Until countered, ended by caster, or target dies"
target = "One creature"
source = "The Books of Sorcery, Vol II"
pages = "90"
effect = "Invert target's Essence (devastating)"
description = """
Twisting her fingers together and flicking them toward her enemy, the sorcerer releases a roiling black and violet beam that penetrates his target's chest. Only Charm-enhanced parries or dodges may resist the beam, in which case the sorcerer's player rolls (Intelligence + Occult) to aim it. Otherwise, this is a perfect attack. Beginning on the action after he's hit, the target suffers 10 dice of lethal damage every five ticks as the Essence of his life rips from his body and twists into black and violet streamers of death. This damage may be soaked only with Stamina and Charms. The curse persists until Adamant Countermagic dispels it, the sorcerer decides to end his torment, or her foe finally dies. As the last of the victim's life erupts and inverts, the death-cloud rushes back into the corpse and dissolves it to nothing.
"""

[[spell]]
id = "evocation-from-the-mirror"
name = "Evocation from the Mirror"
circle = "solar"
cost = "40m"
keywords = ["Shaping"]
duration = "Until mirror-person touches his own reflection"
target = "One creature"
source = "The Books of Sorcery, Vol II"
pages = "91"
effect = "Mirror-double of self appears"
description = """
Some societies fear mirrors, and this spell could explain why. It magically evokes a duplicate of a targeted person from his mirror reflection, while imprisoning the original within the mirror. To cast the spell, the sorcerer must be within 100 yards of her target and have a mirror at least the size of her hand within 20 yards. The victim must be conscious and see the mirror, but he can be drugged, bewitched or otherwise restrained. The sorcerer incants a ritual palindrome while making the Mudra of Opposition, only one hand makes the gesture in reverse, while dozens of images of her flicker through her anima.
When the spell is released, the players of the sorcerer and her target make a resisted (Willpower + Essence) roll. If the sorcerer's player loses or ties the roll, the mirror shatters, and the spell fails. If the sorcerer's player rolls more successes, however, the target and the mirror both flash with iridescent Essence and… nothing seems to have happened. Close observation will show, however, that the person has been reflected left to right.
This mirror-person has the same traits and Charms as the original. He also has reversed versions of the victim's clothing and mundane possessions. Any magical possessions transfer from the original to the mirror-person. The duplicate is a complete moral opposite of the original. His Motivation and Intimacies are reversed, so what the original loved the duplicate hates, and vice versa. He will act as his reversed morals dictate, with one addition. He is also the sorcerer's devoted slave, ready to do almost anything she commands. (He might hesitate at working against his Motivation, as even the most loyal servant might.)
The spell traps the victim in an Elsewhere inhabited only by himself and anyone else trapped by this spell. Nothing else exists except when the duplicate's image appears in a reflective surface such as an actual mirror, a pool of water or a pane of glass. Then, the duplicate's surroundings appear (reversed) in the Elsewhere, and the original person can look out the mirror to the real world and be seen there as well. The original does not have to mimic the mirror-person's actions. He can mouth appeals for help, wave his hands and so on.
The mirror-person avoids reflections whenever possible because he doesn't want other people to see his original—and because his own reflection provides the original with a means of escape. If the mirror-person touches a reflection that includes the spell's target, the image and the original resume their proper places.
Adamant Countermagic will also break the spell if cast on either the mirror-person or the reflection that contains his original.
Evocation of the Mirror is much less effective against spirits or any other entity that can dematerialize (including Exalts with suitable spells). The spirit just dematerializes and walks out the first reflective surface that holds his image, as if it were the door to his own sanctum. Then the original and the reflection both exist in Creation. A duplicate is also not destroyed by being forced back to the other side of the mirror. In zones of severely diminished reality such as a Middlemarch or Fair Folk freehold, the reflection can escape the mirror to bedevil the life of his original. On the other hand, if the mirror-person enters such a zone, his original can also escape from Elsewhere with a successful (Willpower + Essence) roll.
"""

[[spell]]
id = "gaias-rebuke"
