Alternatively, the character may cast the sphere at a specific ghost within 15 yards as a (Dexterity + Occult) attack. If it hits, bands of glaring necrotic energy pulse around the victim. When the energy fades, it permanently severs the connection between the ghost and any Fetters it carries or whose token it carries. Fetters whose tokens the ghost had hidden elsewhere are safe.
"""

