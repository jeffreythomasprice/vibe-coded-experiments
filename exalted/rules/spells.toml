description = """
The earth itself rejects the sorcerer's enemy, along with the very ground he stands on. As this spell is cast, the sorcerer indicates a target and grandly sweeps her arms together. The ground under her enemy's feet shudders, jagged chasms abruptly surround it, and a circle of it—one yard in diameter wider than the target and 10 yards thick—hurls itself into the sky, trailing a streamer of red and yellow Essence. Living creatures other than the target are shaken free near the ground, landing unhurt. The unfortunate himself, however, finds the column of earth flipping over once it reaches a mile in the air, then driving back down to the ground just as quickly. The ascent and crash take five ticks each, which is all the time the victim has to think of some escape before the chunk of earth smashes into the ground with him underneath it. The victim and his belongings take 150 dice of lethal damage, leaving nothing behind but a pile of rubble as his cairn.
