[[spell]]
id = "pyre-flame-guardian"
name = "Pyre-Flame Guardian"
circle = "void"
cost = "50m"
keywords = ["Obvious"]
duration = "1 hour (Underworld)"
target = "Caster"
source = "The Books of Sorcery, Vol II"
pages = "156-158"
effect = "Conjure pyre-flame guardian"
description = """
The caster must possess and swallow a soulsteel vial—one the size of a pinky finger joint—that contains pyre flame. Once she performs that action and finishes the spell's casting, the necromancer swells to twice her normal size. The screams of a dozen random and unlucky ghosts in the Underworld resound around her. Each shrieking ghost is instantly shaped into soulsteel that fuses to the caster's skin, face, hair and eyes. Once she is protected, the caster's skin bursts into a sickly green bonfire of pyre flame.
Her new skin gives the character +15L/+15B soak and 12 Hardness. She adds to her Strength rating a value equal to her Essence, and the corrosive flame that engulfs her inflicts three dice of aggravated damage on anyone foolish enough to attack her barehanded. Foes who strike her with a weapon not forged of a magical material end up with weapons burning in their hands, soon to be consumed. Even the mightiest artifact weapons of the Exalted become dangerous, because even though they burn slowly, they can carry the flame to other targets. A character who continues to wield a weapon after it has been smeared with the sticky fire suffers its basic environmental damage unless he wears gauntlets of the magical materials or is otherwise immune to pyre flame, at least until he scrapes it off. Victims of the necromancer's barehanded attacks are likewise afflicted with the touch of the pyre flame.
As an attack action, the character can vomit a sticky wad of furiously burning pyre flame at her enemies, using a (Dexterity + Thrown) dice pool. This projectile inflicts six levels of aggravated damage, plus extra successes, and it cannot be parried. Where the green balls of flame land, they leave circles or streaks of green fire. These flames are likely to kill extras before they can hope to scrape off the flames.
The spell ends either when the caster chooses, when someone targets it with Obsidian Countermagic, or when one hour has passed in the Underworld. The spell's end causes the necromancer's soulsteel skin to explode off of her. Thousands of fragments of shrieking black shrapnel coated in green flame fill the area around her, inflicting five levels of lethal damage and two levels of aggravated damage to all viable targets within 30 yards. Only perfect defenses can block or evade this debris.
"""

[[spell]]
id = "risen-and-screaming"
name = "Risen and Screaming"
circle = "void"
cost = "40m"
keywords = []
duration = "Permanent curse until dispelled"
target = "Area"
source = "The Books of Sorcery, Vol II"
pages = "158"
effect = "Raise screaming undead army"
description = """
After the Cast Necromancy action, the necromancer paces out a path in Creation, dropping a small dusting of salt crystals every 30 steps. The trail he walks blackens and dries out, as if it had been burned and salted by enemies. Once he rejoins his beginning, the spell's effects appear to end.
The area enclosed by his travel has been poisoned with a lasting curse of undeath. Roiling necromantic energy lies concealed just below the surface. Any time a living creature dies within its boundary, the ground softens and crumbles to absorb it. The corpse rises again a few minutes later, its skin years rotted but its bones strong and claws sharp.
Zombies created by this spell are under the caster's control. Any zombies left in the region without their master's attention burrow into the ground, which accepts them easily. A buried zombie knows when a living creature comes within 20 yards. It can rip its way out of the ground as part of its Move action before attacking. Noticing a hidden zombie requires a (Perception + Awareness) roll, difficulty 2.
These zombies scream loudly when they attack living creatures, and they move at twice the speed of normal zombies. Otherwise, they are identical to zombies on p. 314 of Exalted. Only Obsidian Countermagic, focused, long-term geomancy or repeated applications of Adamant Countermagic can remove this deadly curse.
"""

[[spell]]
id = "sins-of-the-father"
name = "Sins of the Father"
circle = "void"
cost = "50m, 1 permanent wp"
keywords = []
duration = "Permanent (until dispelled)"
target = "One living person"
source = "The Books of Sorcery, Vol II"
pages = "157-158"
effect = "Curse target's lineage"
description = """
Concluding the spell, the caster reaches out and lightly caresses the face of her victim. Her Essence-charged touch sears the person, leaving a scar that no magic or medicine can heal. A (Dexterity + Martial Arts) roll is needed for the necromancer to touch her victim if that person tries to avoid her.
Over the next week, identical brands appear on all the target's children, and any of his later descendants are born displaying the mark. Otherwise, someone so marked suffers no other effects during his lifetime.
After death, however, the character automatically rises as a ghost in the Underworld after the normal three days. As a ghost, his Motivation becomes "Serve She Who Cursed Me," he gains an Intimacy to "She Who Cursed Me," and the necromancer who cursed him becomes a mighty Fetter for him. Finally, he is compelled to seek out his new master after his death, and he must obey her commands. All his descendents suffer the same fate.
Even the caster's death does not free the accursed family. Instead, their loyalties transition seamlessly to the next incarnation of the necromancer's Essence. (For an Abyssal, this becomes the next person to receive her Exaltation.) If no such incarnation appears after a year and a day, the ghost-slaves are released from their eternal bondage. Obsidian Countermagic can free a single individual and all that person's offspring from the curse, but none of his siblings, cousins or other lateral relations. Adamant Countermagic can free a single victim of the curse, but it invariably kills the target unless a Zenith Caste priest holds the target in his anima. The Unconquered Sun himself can also lift the curse off a person and his descendants, if one can reach him and prove oneself worthy.
Exaltation protects an individual and his soul from this manner of enslavement, but a person who was cursed before his Exaltation can still pass the curse to his children. Creatures without souls or those whose souls never enter the Underworld are immune to the spell's effects.
"""

[[spell]]
id = "summon-hekatonkhire"
name = "Summon Hekatonkhire"
circle = "void"
cost = "40+m"
keywords = []
duration = "Year and a day"
target = "Summoned hekatonkhire"
source = "The Books of Sorcery, Vol II"
pages = "158-162"
effect = "Summon a hundred-handed colossus"
description = """
Hekatonkhire is the general term for the largest and most powerful dead things that refuse to stop moving. They are behemoths, slain but too invested with meaning to fade away completely. They are the memories and nightmares that stir the Neverborn in their sleep, shaking the Labyrinth enough to spawn a monster from their imaginations or, perhaps worse, their fears. And they are the residual remains of the Primordials' subsidiary souls as they were slain and fell through Creation into the new sunless realms—necromantic analogues of Second or Third Circle demons.
Casting this spell requires a six-hour ritual, in which the character sacrifices both a mortal and a ghost (or a single Ghost-Blood). The ritual involves a great deal of ritual paraphernalia, none necessary but all advantageous: Casting this spell without at least Resources 3 worth of prepared ingredients and reusable tools worth at least Resources 4 levies a -1 external penalty on the caster's first roll to dominate the creature's will.
When the named hekatonkhire appears, it and the necromancer begin a contest of wills. Their players begin an extended, resisted roll of (Essence + Willpower) as a Speed 5, -1 DV action. The roll is reflexive, but neither party may engage in any non-reflexive action, or they forfeit the contest. The hekatonkhire takes a -1 internal penalty on the roll for every seven additional motes the caster spent with the initial shaping action. The contest continues until one side accumulates three net successes over the other. If the necromancer wins, the hekatonkhire serves him for a year and a day. Hekatonkhire who win usually consume their summoners then return to slumber or brood in their dark homes.
Although hekatonkhire resent bondage like any entity does, they enjoy spreading death and horror through Creation. Some feel animosity toward their captors after the year and a day, but others quickly forgive or forget. Hekatonkhire vary widely in raw power and particular abilities. Some can be easily defeated by a single experienced Solar or a Dragon-Blooded sworn brotherhood, but the most powerful could potentially stand against the Incarnae or the mightiest Demon Princes. Regardless, hekatonkhire never really die. When defeated, they re-form in the Underworld. Some become weaker for a time, but most of them lose none of their power.
"""

[[spell]]
id = "void-cocoon-warrior"
name = "Void Cocoon Warrior"
circle = "void"
cost = "33+m (committed)"
keywords = ["Obvious"]
duration = "2 hours (extendable)"
target = "Summoned warstrider"
source = "The Books of Sorcery, Vol II"
pages = "160"
effect = "Cocoon emerges as Void warrior"
description = """
Like Rattled Bones of War (pp. 43-44), Void Cocoon Warrior creates a warstrider for the character to pilot in battle. The necromancer's words and mudras call a great black nothingness out of the world around her. Blobs of gray-black metal appear about her and lock into place, lifting her into the air until she sits in the cockpit of a 20-foot tall noble warstrider, interfacing with it through tendrils of solidified Void that burrow into her brain and spine. She may choose to sacrifice a lethal health level in the casting, which causes her to cough up impossible volumes of blood into the gray-black Oblivion the spell sheathes around her. The spell-forged metal turns a red-stained black and swells, growing another five feet in height or thickening and becoming more squat—the character makes the warstrider into either a colossus or a royal. The sacrificed health level does not heal until after the spell ends.
The Void Cocoon Warrior appears with a grand daiklave, humming softly as it annihilates the air around it with the power of the Abyss. At the caster's option, she may adorn her construct with Void-crafted artifacts of war. She can summon into existence a black, Oblivion-twisted version of any ranged artifact or Essence weapon that can normally be mounted on warstriders. Doing so increases the spell's cost (and commitment) by the Essence required to attune a mounted version of that weapon.
Finally, the character may add an integrated flight system to the noble or royal warstriders for another eight motes added to the spell's cost and commitment. The warstrider also possesses one of the effects bestowed by Oblivion's Avatar (see pp. 54-55).
After two hours of operation, the Void-born warstrider begins to vibrate dangerously, then rocks the battlefield in a series of Abyssal explosions. Any creatures within 20 yards take twenty levels of lethal damage that cannot be dodged, and anyone between 20 and 50 yards suffers 10 levels of lethal damage. (The caster herself is unharmed.) The necromancer can extend the warstrider's period of operation for another hour by reflexively spending a number of motes equal to half its committed cost. See the appendix of Wonders of the Lost Age for detailed information about warstriders.
"""
