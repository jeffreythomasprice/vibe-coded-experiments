[[spell]]
id = "god-forged-champion-of-war"
name = "God-Forged Champion of War"
circle = "celestial"
cost = "20+m (committed)"
keywords = ["Obvious"]
duration = "One hour (extendable at 10m per additional hour)"
target = "Caster"
source = "The Books of Sorcery, Vol II"
