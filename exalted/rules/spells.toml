effect = "Holy light cleanses scene"
description = """
As the sorcerer casts this spell, the golden rays of the Unconquered Sun coalesce around him in a night-tangible nimbus before he finally releases their fury. Pure and deadly sunshine bursts in a circle outward from the caster. Where it touches anything unloved by the sun, that cursed thing suffers (Essence x 2) dice of aggravated damage as the sun's gaze burns it away. This damage ignores armor. The spell affects all creatures of darkness and objects of similar origin within a number of miles equal to the caster's Essence. Anything destroyed dissolves in a wash of light, and everything in the area of effect looks faded and sun-bleached.
After a casting of this spell, the light within 100 yards dims, having spent its wrath. There's still plenty of light to see by, but the dimming hinders anything requiring truly bright light. Until the light returns to its full potency with the next sunrise, Light of Solar Cleansing cannot be cast within the area.
