[[spell]]
id = "bone-puppet-dance"
name = "Bone Puppet Dance"
circle = "shadowlands"
cost = "16m"
keywords = []
duration = "Instant"
target = "One skeleton"
source = "The Books of Sorcery, Vol II"
pages = "125-126"
effect = "Animate corpses as puppets"
description = """
The necromancer utters a single syllable of deathly command, and a symbol representing the spell ripples toward its target and brands itself in the center of the skeleton's ribcage. The caster now commands that skeleton… not good if a person lives around it.
The skeleton moves as the caster wills, from dancing a jig to murdering a child, for a number of hours equal to the caster's (Charisma + Occult). The skeleton acts with either its normal dice pools or those of its normal, fleshly owner. Living targets suffer an internal penalty on these actions equal to their Essence. A living target may resist, using muscles to struggle against the deathly force that animates his bones. Each action in which he does so, he suffers one level of unsoakable lethal damage. Doing so also consumes much more of the spell's energy, reducing the duration by one hour. When the remaining duration reaches zero hours, the spell ends.
Skeletons that kill their contravening hosts claw their way free of the body and become permanent walking dead under the caster's control. Similarly, casting this spell on an existing skeleton raises it as a permanent zombie. Targeting a skeleton that is already an active walking dead rips its control from its current master.
"""

[[spell]]
id = "bonfire-visions"
name = "Bonfire Visions"
circle = "shadowlands"
cost = "13m"
keywords = []
duration = "3 hours"
target = "One bonfire"
source = "The Books of Sorcery, Vol II"
pages = "125-126"
effect = "Scry the past via a bonfire"
description = """
Bones of creatures that once lived are rare finds in the Underworld, but this spell requires one. The necromancer casts the bone on the ground and spits on it to evoke a large, blue bonfire that burns for three hours. The fire burns brightly for a thing of the dreary Underworld. It is visible for miles, and its vibrant glow attracts ghosts. Ghosts who peer into the fire can see their Fetters with perfect clarity. Ghosts are often willing to pay a necromancer for such a chance to check on the status of their Fetters.
"""

[[spell]]
id = "death-flies-two-sails"
name = "Death Flies Two Sails"
circle = "shadowlands"
cost = "14m (7m committed)"
keywords = []
duration = "Indefinite"
target = "One sailing vessel"
source = "The Books of Sorcery, Vol II"
pages = "125-126"
effect = "Mark ship for ghost-pirate doom"
description = """
Sailing on the Sea of Shadows, the Underworld equivalent to the Inland Sea, is a dangerous prospect. Spectres sail the black waves on ectoplasmic flotsam, the sea's black waters seep in with their nightmares and poisons, and hekatonkhire rise from the depths for food.
As the waters of the Underworld lap at her feet, the caster sings a lullaby to the dead. After seven minutes of song, a sailing ship rises to the waters' surface. Its sail is patched with human skin, and its hull repaired with pale bone. Its figurehead is a spectre, bound there to sing for the ship's protection.
The craft comfortably fits two passengers, but five can crowd aboard. The ship won't move without the caster aboard. The spectre's dirge and the wake of bile-tainted blood the ship leaves temporarily quenches any hunger of the water's inhabitants. Characters sailing on this ship have less chance of dangerous encounters on the Sea of Shadows, and they add three dice to all social rolls required to negotiate with its native creatures.
The ship exists as long as the caster commits the Essence. Casting this spell in Creation doubles the Essence cost (though not the commitment) and may only be done at night. If true sunlight strikes the ship, the vessel boils away to nothing within one minute.
The ship has these traits:
Speed: 15/30mph; Maneuverability: +2S (Sail 2); Endurance: Necromancer must maintain a seven-mote commitment and not allow sunlight to touch the vessel; Crew: 2/2; Cargo: 3 more people or 600 lbs.; Armor: 10L/10B; Health Levels: Ux5/Mx10/Cx3/Ix2/D; Weapons: None.
"""

[[spell]]
id = "death-inversion-loop"
name = "Death Inversion Loop"
circle = "shadowlands"
cost = "18m"
keywords = []
duration = "Instant"
target = "One ghost"
source = "The Books of Sorcery, Vol II"
pages = "125-126"
effect = "Loop target's near-death moment"
description = """
A ghost's death was usually horrible—otherwise, the ghost would not have passions left unfulfilled or Fetters binding her to her unlife. Catching the gaze of a ghost, the caster can force her to experience that moment of death once more. The necromancer's player rolls (Willpower + Essence) against the ghost's Willpower. If the caster wins the contest, the ghost relives her death over and over again. Targets of this spell become Inactive immediately, but they may act normally on the next action. Each net success reduces the ghost's permanent Willpower by one. Lost Willpower returns at the rate of one dot per week. Ghosts reduced to 0 Willpower by this spell dissolve into permanent haunts of the site of their deaths.
If the ghost's player wins the resisted roll, the ghost forces the effect back on the caster. The necromancer suffers a -2 internal penalty on his next action as vague and disturbing visions of his own death beset him. Whether these visions are truly prophetic is subject to some debate.
"""

[[spell]]
id = "death-mask"
name = "Death Mask"
circle = "shadowlands"
cost = "14m"
keywords = []
duration = "Indefinite"
target = "Caster"
source = "The Books of Sorcery, Vol II"
pages = "126-127"
effect = "Don face of the recently dead"
description = """
To cast this spell, the necromancer must first oversee the painful sacrifice of a living human. As life flees the body, the caster invokes Death Mask to capture her victim's higher soul and wash away its sentience, leaving an empty shell of soul-stuff. (Victims of this spell never rise as normal ghosts, but their lower souls usually become hungry ghosts.) The spell then hides the cloak of ghostly plasm Elsewhere.
Later, the caster can invoke the spell again and spend 10 minutes easing the soul-shell from Elsewhere and donning it. Acting too quickly can tear the soul and render it useless. While wearing the soul-cloak, the necromancer appears to all eyes like a normal ghost. A successful (Perception + [Awareness or Occult]) roll at a difficulty equal to the caster's Essence allows an onlooker to recognize an impostor spirit. Living creatures cannot see the plasmic disguise at all without using techniques to see Essence.
Any lethal or aggravated damage the caster suffers while wearing the cloak also affects the disguise. Once it suffers four levels of damage, it falls off in tatters and reveals the necromancer. In order to use the spell again, the necromancer must prepare another soul. If the death mask is not destroyed, however, it recovers one health level per full week it remains Elsewhere. Worn in Creation, the cloak is intangible and takes damage only from attacks that harm dematerialized spirits.
"""

[[spell]]
id = "door-of-the-dead"
name = "Door of the Dead"
circle = "shadowlands"
cost = "18m"
keywords = []
duration = "3 actions"
target = "One reflective surface"
source = "The Books of Sorcery, Vol II"
pages = "127-128"
effect = "Open gate to the Underworld"
description = """
Reflections look alive but are not alive, and this property gives the surfaces that create them an affinity with the Underworld. Caressing a reflective surface as he casts this spell, the necromancer opens a quicksilver doorway between Creation and the analogous point in the Underworld—or vice versa. Travel between the two is instantaneous, and the passage remains open for the caster's next three actions. Things can come through the other way, too. Once the connection fades, the road closes viciously. Mirrors crack, water boils, and silver tarnishes.
"""

[[spell]]
id = "drawing-blind-edge"
name = "Drawing Blind Edge"
circle = "shadowlands"
cost = "20m"
keywords = ["Obvious"]
duration = "Indefinite"
target = "One ghost"
source = "The Books of Sorcery, Vol II"
pages = "127-128"
effect = "Strike at intangible/dead"
description = """
On her Cast Necromancy action, the caster bites her lip and blows a frigid red mist, which pales into crystalline pink rime, onto her hand. On her next action, she then plunges her frost-covered hand into a ghost's corpus as a (Dexterity + Martial Arts) attack (which may target immaterial ghosts). On a successful strike, the caster draws from the ghost a transparent blade that dances with pale blue flame—this blade is Blind Edge. Failing to affect a ghost with the spell—i.e., failing the roll—inflicts one level of unsoakable bashing damage on the caster every minute, as the cold spreads throughout her body. This damage accumulates until the necromancer succeeds in drawing the blade from a ghost or until it freezes her to death.
The weapon's base traits are those of a reaver daiklave (see Exalted p. 385). Each dot of her target's Essence lets the caster add one point to the weapon's Accuracy, Damage, Defense or Rate, but no individual trait may be raised above the necromancer's (Essence + Occult). This weapon inflicts half damage, calculated before soak, against living targets. Against the dead, it deals aggravated damage and can strike even immaterial ghosts.
Any ghost slain by the blade is sucked into it with a shriek and a burst of blue flame. Spirits consumed in this manner are doomed. For each ghost the blade devours, the caster may add to the blade's traits a number of additional points equal to the victim's Essence. The blade can destroy any number of ghosts, but the limit of (Essence + Occult) remains for each trait. Blind Edge remains until someone uses countermagic against it or until the caster stops using it, at which point the bluish-white blade turns deepest black and its captives are drawn, howling, into the Void.
"""

[[spell]]
id = "dusk-eyes"
name = "Dusk Eyes"
circle = "shadowlands"
cost = "10m"
keywords = []
duration = "1 hour"
target = "Caster"
source = "The Books of Sorcery, Vol II"
pages = "127-128"
effect = "See in any darkness"
description = """
Anointing his eyes with blood from a pricked finger, the caster uses it to see around the borders between life and death. While this spell is active, the character may see from the Underworld into the analogous part of Creation, or vice versa. He can see only one world at a time, however. If he peers into one world while doing something in the other world that requires attention, such as combat, he suffers the typical penalties for blindness (Exalted, p. 152).
Wards and spells against scrying can defeat this spell. Dusk Eyes lasts for one hour, during which time the caster may walk through a shadowland's border into either Creation or the Underworld without expending a mote. This spell has no real effect in shadowlands, where the two worlds are one.
"""

[[spell]]
id = "easing-the-forsaken-memory"
name = "Easing the Forsaken Memory"
circle = "shadowlands"
cost = "12m"
keywords = []
duration = "Instant"
target = "One haunt"
source = "The Books of Sorcery, Vol II"
pages = "128-129"
effect = "Steal/edit a ghost's memory"
description = """
Violent or emotional deaths can leave haunts, locations where the event's imagery replays itself over and again, often timed to a phase of the moon or other celestial event. In Creation, haunts fade over time or wise men can exorcise them. In the Underworld, haunts are nigh permanent and difficult to remove. A fastidious necromancer, however, might not want the echoing cries of a pitiful spirit's death to contaminate her décor or motifs. Casting this spell erases a single haunt or relocates it to any place within (Essence x 5) miles.
If she wishes, a necromancer can also use this spell to turn a cooperating ghost's memory into a haunt or create one from her own imagination. Creating a haunt requires a successful ([Intelligence or Manipulation] + Performance) roll from the ghost's or necromancer's player, depending on who designs the haunt. These rolls can be considered social attacks that inspire various emotions in beings that watch the haunt, or they can convince people that the haunt is evidence of a murder or a clue to a treasure. (The latter use would be a Manipulation-based roll.) In Creation, created haunts last for a number of months equal to the necromancer's Essence. In the Underworld, they are permanent. This use of the spell is often called Congealing the Last Thought, but it's the same spell.
"""

[[spell]]
id = "emperors-chains"
name = "Emperor's Chains"
circle = "shadowlands"
cost = "16m"
keywords = []
duration = "Instant"
target = "One ghost or multiple ghosts"
source = "The Books of Sorcery, Vol II"
pages = "128-129"
effect = "Bind a ghost to your command"
description = """
The necromancer claps his hands, and his Essence rings like a dull but very loud gong. When the sound strikes a ghost, the ghost becomes sluggish and has difficulty moving. All ghosts within 50 yards of the caster move at half speed (minimum one yard per tick) and double the Essence costs of all movement-related Arcanoi. Creation mutes the sound of the gong, reducing the range to 25 yards.
The caster may instead focus the spell on a single ghost in range. That ghost becomes unable to move at all, and the Essence costs of movement-related Arcanoi triple.
"""

[[spell]]
id = "faces-of-the-dead"
name = "Faces of the Dead"
circle = "shadowlands"
cost = "16m"
keywords = ["Obvious"]
duration = "1 hour"
target = "Caster"
source = "The Books of Sorcery, Vol II"
pages = "128-129"
effect = "Take face of any dead person"
description = """
Pulling his fingers as if drawing thread, the necromancer spins a shimmering silver line of Essence. It thickens into wire, then rotates into the third dimension to become a silver mace with a perfect, 12-faced head. The weapon is treated as an exceptional mace. Against ghosts and other spirits of the dead, the weapon adds a value equal to the necromancer's Essence to its base damage. Also, when a single blow with the mace inflicts levels of damage equal to or greater than a target's permanent Essence, the mace captures the ghost in one of its faces with a steely blue flash. The ghost then looks out from the face that captured it.
Either after one hour or when the necromancer commands it (whichever comes first), the mace's shaft dissolves into dust and disappears. The silver mace head transmutes into rock crystal, holding all the ghosts absorbed by the mace. It has 12L/12B soak and requires 20 levels of damage to break. Countermagic shatters the crystal. Otherwise, only the caster can release the ghosts without violent means. Ghosts freed from the crystal have empty Essence pools.
Faces of the Dead was once a tool of the Celestial Exalted in the First Age, as they first sought to explore and exploit the Underworld. Abyssal Exalted and nephwracks use it today to collect ghosts for various purposes, including raw material for soulsteel.
"""

[[spell]]
id = "field-of-fell-dreams"
name = "Field of Fell Dreams"
circle = "shadowlands"
cost = "16m"
keywords = []
duration = "Until midnight"
target = "Area"
source = "The Books of Sorcery, Vol II"
pages = "128-129"
effect = "Field induces nightmares in sleepers"
description = """
Laying his palm on the ground at the spell's climax, the caster scorches the earth with a black brand in the shape of his hand. Immediately afterward, hundreds of skeletal hands burst upward through the earth, stone or flooring to grab anyone present (except the caster), holding them with the strength of the dead.
Everyone within 50 yards of the palm-shaped brand suffers a -1 internal penalty to all Dexterity-based actions as they are forced to dance away from the clutching hands. People also suffer a two-yard penalty to movement. Each tick on which someone takes a Move or Dash action, that person suffers a clinch attack from the hands, made with an attack pool of (caster's Essence + 5). Anyone who falls or is knocked down is automatically grabbed, then the clinch proceeds normally. The hands use the same pool to maintain clinches, and they attempt only to restrain their victims without doing damage. They are easy to destroy—they never defend and they have only one health level—but they are replaced within moments.
The hands can capture immaterial beings as easily as any other target, and ghosts caught by the hands become visible. The hands release their grip and vanish at midnight (as measured in the Underworld), but the destruction they have caused remains.
"""

[[spell]]
id = "five-gifts"
name = "Five Gifts"
circle = "shadowlands"
cost = "12m"
keywords = []
duration = "1 day"
target = "One ghost"
source = "The Books of Sorcery, Vol II"
pages = "129-130"
effect = "Grant five lesser ghost gifts"
description = """
Strong passions and Fetters enable the dead to resist the sweet call of Lethe, but the Underworld is a dull place. Its winds and parties are tepid, food tastes like dust, and habits are carved into stone. By anointing a willing ghost with five drops of blood, the caster lets a ghost experience the world as he did while alive. Blood is bright instead of faded pink, and the sobs of the enslaved dead sound joyfully abominable. Foods of the Underworld actually taste of something, and sacrificed foods from the living world are as sweet or savory as if they were fresh from the oven.
Ghostly targets of this spell gain a number of Willpower points equal to the caster's Essence from the experience of the world to which they cling. This boon can take a ghost above his maximum Willpower. Both the enhanced senses and any Willpower above the maximum fade after one day.
Ghosts of moderate means might beggar themselves to purchase an invocation of this spell, and necromancers who know it have a powerful bargaining chip. Using this spell on ghosts makes them thankful… and pliable. Targets of this spell cut their MDVs in half with regard to the caster for a full week unless they spend two points of Willpower to resist the inclination the first time the caster makes a social attack. For ghosts who have experienced this spell in the past, holding Five Gifts over their heads during negotiation results in the same sway, unless they pay the same two Willpower points to clear their heads.
"""

[[spell]]
id = "flesh-and-bone-winds"
name = "Flesh and Bone Winds"
circle = "shadowlands"
cost = "18m"
keywords = ["Obvious"]
duration = "Indefinite"
target = "Caster"
source = "The Books of Sorcery, Vol II"
pages = "129-130"
effect = "Animate bone winds; tear flesh"
description = """
Gesturing at the ground around her, the necromancer makes it glow a faint ivory. One moment later, sharp knives of shattered bone and long, pink-and-red ribbons of flesh rupture the earth, rising to spin around the caster in a column one yard in radius. They obscure him and move with him, picking up the flesh and bone of the dead near him and shredding them to absorb them into the charnel whirlwind.
This spell adds a -1 external penalty to all close-combat attacks made against the caster and a -3 external penalty to all ranged attacks into or out of the maelstrom. Additionally, anyone caught in the death-storm suffers three dice of lethal damage each action she is exposed to it. Anyone the winds kill gets torn apart and added to the storm. Each body added to the storm thus increases the storm's radius by one yard. Every two bodies added to the winds increase both external penalties and the dice of damage by one. A maximum of (caster's Essence x 2) bodies can be added to the storm before it stabilizes and grows no larger.
"""

[[spell]]
id = "flesh-sloughing-wave"
name = "Flesh-Sloughing Wave"
circle = "shadowlands"
cost = "16m"
keywords = ["Obvious"]
duration = "Instant"
target = "Area"
source = "The Books of Sorcery, Vol II"
pages = "129-130"
effect = "Wave melts flesh from bone"
description = """
Although Flesh-Sloughing Wave was designed as a utility spell for cleaning the rotted meat from bones for constructing temples or war machines for the Deathlords, the spell can be lethal in the world of the living. The caster shapes an ivory ball of Essence in her hands, then hurls it to the ground. It shatters there and releases a translucent ivory wave out to a range of (Essence x 5) yards. As the dome expands, it washes flesh away from the bones it passes. Flesh from any corpse is torn away, as is any dead flesh on a living creature. The living suffer a brief moment of pain as the wave tries to peel away their skin, muscle and fat from the bones beneath.
Living creatures caught in the radius of the spell, excepting the caster, suffer ([Essence + Occult] x 2) dice of lethal damage. This effect can be dodged, but not parried. Fair Folk caught within this blast suffer double damage before soak, and those killed by the spell die in a rainbow flash as their thin veneer of order is torn away.
"""

[[spell]]
id = "gathering-a-ghosts-strings"
name = "Gathering a Ghost's Strings"
circle = "shadowlands"
cost = "10m or 20m"
keywords = []
duration = "Instant"
target = "One ghost"
source = "The Books of Sorcery, Vol II"
pages = "128-129"
effect = "Bind a ghost's threads"
description = """
The caster's eyes become black pits as they gather in all the information they need about one ghost within his sight. He conjures visions of the ghost's Fetters and Motivation, which come one for each inactive action the necromancer takes after his Cast Necromancy action. This knowledge does not grant any inherent power over the ghost, but the knowledge is an advantage with regard to social and political leverage. This effect costs 10 motes.
By spending an additional 10 motes, the necromancer may replace a target's Fetters and Motivation. Each one he wishes to change requires an inactive action after the Cast Necromancy action. To resist the necromancer's attempt to alter a Motivation the target's player rolls (Willpower) against a difficulty equal to the caster's Essence. The ghost's altered ties feel (and are) equally strong, but the ghost always knows they are of necromantic origin. Changes fade after a number of months equal to the caster's Essence.
"""

[[spell]]
id = "gentle-call-of-lethe"
name = "Gentle Call of Lethe"
circle = "shadowlands"
cost = "13m"
keywords = []
duration = "Permanent (until death)"
target = "One living creature"
source = "The Books of Sorcery, Vol II"
pages = "129-130"
effect = "Send a ghost gently to Lethe"
description = """
The necromancer marks a person's forehead with a stylized cicada, symbol of eternal life and says the Five Words of Release. He thus binds the creature into the cycle of reincarnation. The cicada-glyph shines for a moment before disappearing, after which it is visible only to Essence sight. Many of those who associate themselves with death understand the rune's power. When the person dies, the glyph shines again. She does not become a ghost. Her spirit enters Lethe at once, unless some extraordinary magic or effort of will hurls her into Oblivion.
Gentle Call of Lethe and Rune of Sweet Passing are incompatible spells. Unless the spell first cast is broken by countermagic, the other enchantment cannot be laid on an individual.
"""

[[spell]]
id = "hungry-creeping-shadow"
name = "Hungry Creeping Shadow"
circle = "shadowlands"
cost = "15m"
keywords = []
duration = "1 hour (or until target is killed)"
target = "One creature"
source = "The Books of Sorcery, Vol II"
pages = "130-131"
effect = "Creeping shadow drains targets"
description = """
Dragging from herself the worst of her inner darkness, the necromancer vomits a sticky, black ooze, which flows from her to attack an indicated visible enemy within 100 yards. The shadow has Physical Attribute and Martial Arts scores equal to the caster's Essence, health levels equal to her (Stamina + Essence) and can move at a dash. The viscous thing can be hurt only by magical attacks (against which it has no soak) or fire. The merest brush with an open flame will burn it up in seconds, leaving a tacky, noisome residue on everything it touched. A character clinched by the shadow while it burns takes six levels of lethal damage.
The ooze always seeks to immobilize a foe and creep down his throat. It only makes grapple attacks, electing to do damage when in control of the clinch. If its target flees, the shadow pursues unerringly, no matter where he goes. Once it kills its target, the shadow falls quiescent within him, leaving no trace but the residue on his body and utter, unreflecting blackness in his eyes. If a victim can evade it for an hour, however, the shadow evaporates.
"""

[[spell]]
id = "iron-countermagic"
name = "Iron Countermagic"
circle = "shadowlands"
cost = "10m or 20m"
keywords = ["Countermagic"]
duration = "Instant"
target = "Caster, or nearby Shadowlands Circle necromancy spell"
source = "The Books of Sorcery, Vol II"
pages = "130-131"
effect = "Counter Shadowlands necromancy"
description = """
The necromancer's quick gesture trails blackness behind it like a shredded banner and wraps her in its darkness. The chill upon her flesh lasts until her next action. Until then, Shadowlands Circle spells targeted against her freeze and crack, falling in bleeding pieces at her feet—but the cold penetrates to her core, imposing a -2 internal penalty upon all physical actions until the countermagic fades on her next action. Alternatively, the necromancer may project the darkness outward, using the spell to disrupt any Shadowlands Circle spell that is currently in progress within a number of feet equal to (her Essence x 50).
This spell has special timing rules. The character can cast it as a reflexive Shape Shadowlands Circle Necromancy action that takes 0 ticks. It follows all of the other rules for necromancy actions, and the character must take a Cast Necromancy action as her next normal action. Countermagic cannot banish ghosts, though it can destroy other current necromantic effects. Some spells can be countered after casting, if so noted in a spell's description.
"""

[[spell]]
id = "master-puppeteers-knife"
name = "Master Puppeteer's Knife"
circle = "shadowlands"
cost = "14m"
keywords = []
duration = "Instant"
target = "Area"
source = "The Books of Sorcery, Vol II"
pages = "131-132"
effect = "Knife controls a dead body"
description = """
Spreading her fingers wide and slashing a sharp object beneath it, the caster cuts the threads that bind a necrotic semblance of life into a lifeless corpse. This spell has special timing rules. The character can cast it as a reflexive Shape Shadowlands Circle Necromancy action that takes 0 ticks. Her next action must be a Cast Necromancy action. All animate dead within 15 yards and a 90-degree arc (in a direction of the caster's choice) collapse, fully dead once more. Zombies affected must be extras, like those created with Raise the Skeletal Horde and Arisen Legion, among others. Necromancers can use Master Puppeteer's Knife to destroy animated corpses of greater power or intellect, such as those created by Exquisite Undead Aide, by focusing the spell's power on one zombie at a time. The spell does not affect undead war machines.
"""

[[spell]]
id = "midnight-shadow-sun"
name = "Midnight Shadow Sun"
circle = "shadowlands"
cost = "8m"
keywords = []
duration = "(Essence x 5) minutes"
target = "Shadowland border"
source = "The Books of Sorcery, Vol II"
pages = "131-132"
effect = "Block sunlight in area"
description = """
Though deathknights and most denizens of the Underworld can force the border of a shadowland to obey their will, some necromancers need to move greater numbers of beings between realms. Channeling Essence through the Door-Opening Mudra forces the shadowland to deposit everyone who leaves in either Creation or the Underworld, as the caster chooses. The time of day or the individual's nature no longer matter. Midnight Shadow Sun affects 40 yards of border and ends once the caster is no longer within 100 yards of the spell or after (Essence x 5) minutes.
"""

[[spell]]
id = "mother-darkness"
name = "Mother Darkness"
circle = "shadowlands"
cost = "12m"
keywords = []
duration = "1 week"
target = "Area"
source = "The Books of Sorcery, Vol II"
pages = "131-132"
effect = "Conjure protective dark cloak"
description = """
Snapping her fingers and scuffing a Neverborn's sigil in the ground with her sandal, the necromancer changes her environs to better suit her temperament. Over the next minute, the sky clouds over and blocks out the sun. Flora grays and fauna leave or become sickly and surly. Dull white bones of dubious origin emerge from the ground, and stone becomes flaking obsidian. Mother Darkness affects an area with a radius equal to (caster's Essence x 50) yards, occasionally more or less due to natural boundaries.
Dead creatures are more comfortable in the area than they usually are in Creation. They recover one mote of Essence per full day spent in the area, and the Abyssal Exalted count the area as "trappings of the dead." The region returns to normal overnight after one week, unless the necromancer casts the spell in the Wyld. There, the Underworld's Essence deadens the region, reducing the Wyld's strength by one and remaining deathly until the Wyld reinfects it.
Demesnes are not valid targets for this spell. The aspected Essence already flowing through the environment is too strong for Mother Darkness to overwhelm.
"""

[[spell]]
id = "piercing-the-heel"
name = "Piercing the Heel"
circle = "shadowlands"
cost = "15m"
keywords = []
duration = "Permanent (until removed)"
target = "One ghost"
source = "The Books of Sorcery, Vol II"
pages = "131-132"
effect = "Strike target's Achilles weakness"
description = """
To cast this spell on a ghost, the necromancer first requires his victim's body—actually just the feet. The caster speaks the ghost's name, then ritually pierces the tendons above the heel of each foot with iron as he invokes the spell. From that point on, the ghost cannot harm the necromancer. If the ghost tries, either directly or indirectly, she immediately falls to the ground. Her legs do not support her, and she cannot move, even to speak, until she abandons the intention.
Countermagic breaks this binding, as will removing the iron from the feet of the ghost's corpse—though the ghost is bound not to do so herself. If the body decays to the point where the nails fall from the body naturally, only countermagic can end the spell. Similarly, when the body is too decayed for the nails to fit snugly through the tendons, it is too late for this spell to be laid. Luckily for necromancers, some First Age ghosts' bodies are very well preserved.
"""

[[spell]]
id = "piercing-the-shroud"
name = "Piercing the Shroud"
circle = "shadowlands"
cost = "25m"
keywords = []
duration = "30 seconds"
target = "Labyrinth"
source = "The Books of Sorcery, Vol II"
pages = "131-132"
effect = "See/strike through Underworld veil"
description = """
This spell can be cast only at night. A shimmering, faint shadow manifests in the air at waist height, like the reverse of light on water. As the necromancer chants for 10 minutes, the liquid shadow darkens, the earth trembles, and every animal nearby panics and tries to flee. At last, the necromancer slashes a blade into the inky surface, which falls and drains away. A rough-hewn onyx staircase now yawns at her feet.
The staircase remains open for 30 seconds (or ticks) before closing with a horrible, sucking sound. It leads to the Labyrinth, whence there is no easy escape. Even the portal created by this spell will not allow a person to return, once she has placed her foot upon the first step.
"""

[[spell]]
id = "raise-the-skeletal-horde"
name = "Raise the Skeletal Horde"
circle = "shadowlands"
cost = "10m + 1m per zombie"
keywords = ["Obvious"]
duration = "Until dawn (or permanent with Willpower commitment)"
target = "Corpses"
source = "The Books of Sorcery, Vol II"
pages = "132-133"
effect = "Animate skeletons into army"
description = """
As lightning flickers from a roiling, black ball of Essence in her hand, the necromancer calls fallen bodies to serve her as zombies, using any corpses within 100 yards. She can animate up to as many zombies as she has dots of (Intelligence + Occult + Essence), per casting. The corpses burst from their coffins, claw their way from the earth or simply lurch to their feet on her next action. Mausoleum doors, being buried six feet under and so on cannot impede the undead in their rush to serve their new master, but a significant force could do so—such as a dramatic character personally restraining them or a spell designed for this purpose.
Zombies stay animate for one scene if animated in daylight or until the next dawn. The necromancer can keep a permanent staff of zombies, but doing so requires committing one point of Willpower for every five zombies. If the necromancer spends those Willpower points, the zombies collapse, inanimate.
"""

[[spell]]
id = "ringing-rebuke"
name = "Ringing Rebuke"
circle = "shadowlands"
cost = "19m"
keywords = []
duration = "1 hour"
target = "Caster"
source = "The Books of Sorcery, Vol II"
pages = "132-133"
effect = "Ringing rebuke harms undead"
description = """
Looking much like a common charlatan magician, the caster pulls two iron rings from thin air. Struck against each other, both ring with a slightly different tone. Even though the caster makes them "disappear" again, the ringing sounds persist for the next hour. Ghosts find the combined tones abhorrent and have difficulty approaching the caster. To come within five yards, a ghost must expend two points of Willpower. Even then, it has trouble attacking the necromancer. The caster adds an effective +2L/+3B soak against all attacks from ghosts that come from within the five-yard radius. When the character walks into a crowd of ghosts, they part for him unless any decided to spend the Willpower to endure the constant ringing.
"""

[[spell]]
id = "rune-of-sweet-passing"
name = "Rune of Sweet Passing"
circle = "shadowlands"
cost = "15m"
keywords = []
duration = "Permanent (until death)"
target = "One living creature"
source = "The Books of Sorcery, Vol II"
pages = "132-133"
effect = "Curse target with lethargy/death"
description = """
With a mixture of honey, blood and graveyard earth, the necromancer spends an hour painting dozens of bees on her victim's flesh along with the Fettering Sign. These symbols soak in with an insistent drone. Once the painted insects penetrate his skin, the target's spirit is bound to them. They will pull it from him at his death to become a ghost, buzzing in a cloud from his mouth and eyes. Several bees will then fly with supernatural speed to the necromancer, instantly telling her of the subject's passing.
While the victim lives, countermagic can free his soul. Once he dies, nothing—not even the Zenith Caste anima power—can prevent his shade from rising. This spell does not otherwise bind or compel the new ghost.
Rune of Sweet Passing and Gentle Call of Lethe are incompatible. A person bound by one spell cannot be bound—or liberated—by the other.
"""

[[spell]]
id = "seat-of-deadly-splendors"
name = "Seat of Deadly Splendors"
circle = "shadowlands"
cost = "15m"
keywords = []
duration = "1 hour"
target = "Caster"
source = "The Books of Sorcery, Vol II"
pages = "132-133"
effect = "Throne of necromantic majesty"
description = """
The necromancer lets a drop of Essence-charged blood fall from her finger to the ground while she speaks the secret names of Stygia's monarchs. The ground shakes, and an enormous, skeletal fist bursts forth. Fingers uncurl to reveal jagged claws and the palm reclines until it is supine—the caster may then take her seat in the hand of a long-dead giant, beneath its niter-stained talons.
While sitting there, the character's player adds two dice to all rolls involving intimidation, persuasion or perceiving true motives or lies. She can also see dematerialized ghosts as though they were material. Increase the spell's bonuses to three dice when directed at ghosts. These magical effects last one hour, but the skeletal throne remains until someone cuts it down (treat as a stone statue, per the table on p. 154 of Exalted) and removes it. If the throne should be destroyed before the hour is up, the magic ends. Finally, the bone fist can be summoned only from the earth. A building's second story, a ship's deck and other such locales are exempt.
"""

[[spell]]
id = "shade-prison-amulet"
name = "Shade Prison Amulet"
circle = "shadowlands"
cost = "10m"
keywords = []
duration = "Permanent (until broken)"
target = "Bone"
source = "The Books of Sorcery, Vol II"
pages = "132-133"
effect = "Trap a shade in an amulet"
description = """
Hungry ghosts can be trapped, but only once-living bone can hold them. The necromancer cuts a rune into a piece of bone while infusing it with Essence. Thereafter, if it ever touches a hungry ghost, that ghost is sucked in and caught. Only if the trinket breaks will the ghost be released.
This spell may enchant a living creature's bone if the necromancer slices through its flesh to reach it, in which case the creature itself becomes a vessel for the next ghost it touches. This is not a comfortable experience for either the live victim or the hungry ghost. Although it feels fine during the day, the holding creature suffers anxiety, vicious urges and nightmares when the sun is down, and it will be rid of its captive only if the etched bone breaks.
"""

[[spell]]
id = "shattering-void-mirror"
name = "Shattering Void Mirror"
circle = "shadowlands"
cost = "20m"
keywords = ["Obvious"]
duration = "Instant"
target = "One living creature"
source = "The Books of Sorcery, Vol II"
pages = "133-134"
effect = "Mirror reflects fate back as harm"
description = """
Throwing his arm out toward his victim in an imperious gesture, the caster speaks words of dark power. Onlookers often see the image of a great, black-robed necromancer with violet-hued eyes towering behind him in the same posture. The target's colors appear to invert for a moment as her Essence is juxtaposed with an exact opposite drawn from the Void.
The spell is devastating to its victims' spiritual and physical well-being. Her bones shiver with the force brought against them, and her heart flutters with the cold of Oblivion. She suffers dice of raw lethal damage equal to twice her current remaining health levels, which ignores armor, and she loses motes of Essence equal to twice her permanent Essence (Peripheral before Personal).
If this spell kills its target, the inverted-color image shatters into a thousand slivers and flies away on the winds of the Underworld. The victim falls to the ground, drained of all color. This spell instantly kills extras.
"""

[[spell]]
id = "silent-masters-pollen"
name = "Silent Master's Pollen"
circle = "shadowlands"
cost = "18m"
keywords = []
duration = "Instant"
target = "One ghost or two ghosts"
source = "The Books of Sorcery, Vol II"
pages = "133-134"
effect = "Pollen silences/dazes targets"
description = """
The necromancer creates a pinprick-small hole in the world, leading directly into Lethe and the cycle of reincarnation. As the shining point of gray-white light hovers before her eyes, she may either take it in her hands or cast it toward a target within (Essence x 10) yards. Touching it, the necromancer's hands begin to glow. The next two times she touches a ghost, the ghost's player must roll (Willpower) at difficulty 3. Failure or a botch indicates that the call was too strong, and the ghost has moved on to Lethe. Touching a ghost might require a (Dexterity + Martial Arts) attack. Alternatively, the necromancer may launch the passage to Lethe at a single ghost within range. This (Wits + Occult) attack may not be parried except by a perfect defense (if a ghost can have such a thing).
Whether or not a target of this spell succumbs to Lethe, the spell breaks certain necromantic bindings on a ghost. It counters ghost-binding spells of the Iron Circle as well as Charms of Essence 3 or less.
"""

[[spell]]
id = "smoothing-the-crease-worn-mind"
name = "Smoothing the Crease-Worn Mind"
circle = "shadowlands"
cost = "20m"
keywords = []
duration = "Essence days"
target = "One creature"
source = "The Books of Sorcery, Vol II"
pages = "133-134"
effect = "Soothe a tormented ghost"
description = """
Nephwracks and other mad servants of the Void hear the whispers of Oblivion in their minds. It drives them beyond sanity and inspires their horrifying schemes. With a soft caress of silver-bright Essence, the necromancer can protect a ghost from this torment. The creature affected by this spell can no longer hear the maddening murmurs, and most targets even revert to the sanity they knew before. The silence lasts for a number of days equal to the caster's Essence. A successful Willpower roll enables affected nephwracks and other spectres to act for a while like the ghosts they once were. They cannot fail this roll on purpose. Spectres so affected do not forget what they learned while mad, though, which makes this spell a potential source of guides through the Labyrinth. Spirits who never knew sanity simply become quiescent.
Used on Abyssal Exalted or other characters with the Whispers Background, Smoothing the Crease-Worn Mind reduces the target's Whispers rating to 0 for its duration. Targets may reduce the duration of this effect by one day per point of Willpower spent for that purpose.
This spell cannot be part of a Martial Arts attack. If the spell's target resists or is not bound, levy a -1 external penalty to the spell attack.
"""

[[spell]]
id = "soul-brand"
name = "Soul Brand"
circle = "shadowlands"
cost = "15m"
keywords = []
duration = "Indefinite"
