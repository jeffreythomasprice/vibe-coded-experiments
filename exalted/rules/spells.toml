[[spell]]
id = "incantation-of-the-invincible-army"
name = "Incantation of the Invincible Army"
circle = "solar"
cost = "50m"
keywords = ["Obvious"]
duration = "While sun is above horizon and arms raised"
target = "One army"
source = "The Books of Sorcery, Vol II"
pages = "91"
effect = "Empower army: huge mass-combat boost"
description = """
The sorcerer stands at a high place overlooking her army, lifts her arms and turns her face to the sun. Her anima rises to the sky and meets an answering bolt from above, forming a clear pillar of golden light, threaded with scarlet for the Maiden of Battles. A matching banner of light briefly rises above every soldier who follows the sorcerer. The soldiers' blades spark golden, and their faces glow white with the glory of the Unconquered Sun. As long as the sun remains above the horizon and the sorcerer's arms remain raised toward it, units she can see receive bonuses to their Might scores equal to her Essence or their own Magnitude, whichever is lower. Furthermore, the units are considered to have Perfect Morale and to be composed of supernatural beings for the purposes of enemy rout checks. The blessing extends to (Essence x 5,000) soldiers, grouped in units no larger than legions.
Clouds will not naturally block the sun's light upon the battlefield. A long time standing with arms raised, however, can tax even a Lawgiver. For every hour the sorcerer holds her vigil, her player rolls (Stamina + Resistance) against a difficulty equal to the number of hours the spell has lasted already. If her arms do fall against her will, the light begins to fade, but the sorcerer has one action to reclaim it. Success on another (Stamina + Resistance) roll, at the previous difficulty + 1, allows her to lift her exhausted limbs again and call back the Unconquered Sun's favor. Otherwise, the spell ends only if she wills it, if Adamant Countermagic is cast, if the sun sets, or if the battle ends.
"""

[[spell]]
id = "invoking-the-eyeless-face"
name = "Invoking the Eyeless Face"
circle = "solar"
cost = "60m"
keywords = []
duration = "Until subject to Adamant Countermagic"
target = "Caster"
source = "The Books of Sorcery, Vol II"
pages = "92"
effect = "Summon the Eyeless Face entity"
description = """
Outside Creation, Elsewhere, lies a vast, long-banished intelligence: the Eyeless Face. In the time since the Solars banished it and its race from the world, its once-raging anger has cooled and frozen into an icy, abiding hatred. The Eyeless Face cannot escape the perfect bindings placed upon it, and though its servant-limbs are bound to the will of its jailers and may be pulled from its prison at whim, the behemoth itself cannot—must not—be released by external forces. Nevertheless, by the end of the First Age, its jailers' heirs had found a use for it.
The sorcerer makes the familiar pool of oil used to call forth the lesser and greater minions of the Eyeless Face, but instead of pulling anything out, she enters it herself. An hour passes, and she emerges… changed. Though she remains recognizable as the person she was, the skin of her body darkens and grows slightly reflective, while the skin of her face pales. Her eyes become sunken orbs of white as her pupils and irises vanish. She unconsciously mutes her motions, and her posture grows unnaturally still. At the back of her mind, she hears whispered hatreds and seductive assurances of her own superiority. While under the effects of the spell, she benefits from the following:
• If her Compassion is 3 or greater, she need no longer fail Compassion checks to avoid adhering to that Virtue. If Compassion is the Virtue associated with her Virtue Flaw, however, she automatically gains a point of Limit in situations where she would have had to roll.
• Calling forth a batch of greater minions of the Eyeless Face no longer murders any lesser minions she had under her power, and vice versa, though she may still have only one batch of greater minions and one batch of lesser at any one time. Lesser minions under her power begin to heal as mortals.
• The sorcerer gains perfect knowledge of the location of each of her greater and lesser minions, as well as peripheral awareness of their muted, enslaved hopes and fears. If anyone addresses one of her minions as if it were her, she knows it instinctively.
• By spending one mote, the character may shift her senses into the body of any of the minions of the Eyeless Face under her power. While this power is in effect, if the subject is a greater minion, she may speak in her voice through its mouth.
• By spending 20 motes, she may usurp the body of any of the minions of the Eyeless Face under her power, effectively taking its place. Her old body crumbles to dust while her Exaltation and both her souls depart, traveling instantly to her new body and bonding with it as it shifts in form to match her appearance. This journey/transformation moves only the sorcerer herself and not her apparel or any of her belongings. It breaks any artifact attunements she has but otherwise has no long-lasting side effects of which the Solars of the First Age were aware.
Invoking the Eyeless Face lasts until it is subject to Adamant Countermagic.
"""

[[spell]]
id = "light-of-solar-cleansing"
