[package]
name = "exalted"
version = "0.1.0"
edition = "2024"

[lib]
name = "exalted"
path = "src/lib.rs"

[[bin]]
name = "ecs"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }
clap = { version = "4", features = ["derive"] }
lopdf = "0.40"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1"
thiserror = "1"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"

# GUI editor
eframe = { version = "0.34", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.34"
egui_extras = { version = "0.34", features = ["svg"] }
rfd = "0.17"
directories = "6"

[[example]]
name = "dump_dots"
path = "examples/dump_dots.rs"
