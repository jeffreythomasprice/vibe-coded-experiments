[package]
name = "exalted"
version = "0.1.0"
edition = "2024"

[lib]
name = "exalted"
path = "src/lib.rs"

[[bin]]
name = "exalted"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "1"
