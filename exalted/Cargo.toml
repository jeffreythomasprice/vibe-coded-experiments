[package]
name = "exalted"
version = "0.1.0"
edition = "2024"

[lib]
name = "exalted"
path = "src/lib.rs"

[[bin]]
name = "exalted"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }
clap = { version = "4", features = ["derive"] }
lopdf = "0.40"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1"
thiserror = "1"
toml = "0.8"

[[example]]
name = "dump_dots"
path = "examples/dump_dots.rs"
