apiVersion: apps/v1
kind: Deployment
metadata:
  name: example
spec:
  replicas: 1
  selector:
    matchLabels: { app: example }
  template:
    metadata:
      labels: { app: example }
    spec:
      containers:
        - name: example
          image: example:v1 # never :latest, never untagged -- see push-image.sh
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: example
spec:
  selector: { app: example }
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: example
  annotations:
    # Start on -staging while testing (see README); Let's Encrypt's real-cert rate limits are easy
    # to burn through on a misconfigured Ingress. Flip to letsencrypt-prod once staging issues Ready.
    cert-manager.io/cluster-issuer: letsencrypt-staging
spec:
  ingressClassName: nginx
  tls:
    - hosts: [example.jeffrey.lol]
      secretName: example-tls
  rules:
    - host: example.jeffrey.lol
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: example
                port: { number: 80 }
