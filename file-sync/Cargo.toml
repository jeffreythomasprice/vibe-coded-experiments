[package]
name = "file-sync"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
glob = "0.3"
similar = "2"
ratatui = { version = "0.29", features = ["crossterm"] }
crossterm = "0.28"
filetime = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
tracing-appender = "0.2"
anyhow = "1"
dirs = "6"
