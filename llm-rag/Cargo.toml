[package]
name = "llm-rag"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
async-trait = "0.1"
bytemuck = "1"
clap = { version = "4", features = ["derive"] }
directories = "5"
futures = "0.3"
futures-util = "0.3"
libc = "0.2"
rig-core = "0.35"
secrecy = { version = "0.10", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
toml = "0.8"
tracing = "0.1"
turso = "0.4"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt", "registry", "time"] }

[dev-dependencies]
tempfile = "3"

[features]
mock-llm = []
