<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- White Bishop -->
  <defs>
    <linearGradient id="wb-body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff"/>
      <stop offset="100%" stop-color="#d4d4d4"/>
    </linearGradient>
    <linearGradient id="wb-shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8e8e8"/>
      <stop offset="100%" stop-color="#a0a0a0"/>
    </linearGradient>
  </defs>
  <!-- Base -->
  <ellipse cx="50" cy="88" rx="26" ry="7" fill="url(#wb-shade)" stroke="#555" stroke-width="1.5"/>
  <ellipse cx="50" cy="86" rx="26" ry="7" fill="url(#wb-body)" stroke="#555" stroke-width="1.5"/>
  <!-- Stem -->
  <path d="M36 86 Q34 72 38 58 L62 58 Q66 72 64 86 Z" fill="url(#wb-body)" stroke="#555" stroke-width="1.5"/>
  <!-- Collar -->
  <ellipse cx="50" cy="58" rx="14" ry="4.5" fill="url(#wb-shade)" stroke="#555" stroke-width="1.2"/>
  <!-- Mitre body -->
  <path d="M40 58 Q38 45 42 35 Q46 25 50 18 Q54 25 58 35 Q62 45 60 58 Z" fill="url(#wb-body)" stroke="#555" stroke-width="1.5"/>
  <!-- Mitre slit -->
  <path d="M46 42 L54 30" stroke="#555" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Top ball -->
  <circle cx="50" cy="15" r="4" fill="url(#wb-body)" stroke="#555" stroke-width="1.2"/>
  <!-- Highlight -->
  <path d="M45 55 Q44 45 47 32" stroke="#fff" stroke-width="1.5" fill="none" opacity="0.6" stroke-linecap="round"/>
</svg>
