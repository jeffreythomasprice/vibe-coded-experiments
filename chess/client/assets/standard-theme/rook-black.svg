<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Black Rook -->
  <defs>
    <linearGradient id="br-body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4a4a4a"/>
      <stop offset="100%" stop-color="#1a1a1a"/>
    </linearGradient>
    <linearGradient id="br-shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a3a3a"/>
      <stop offset="100%" stop-color="#111"/>
    </linearGradient>
  </defs>
  <!-- Base -->
  <ellipse cx="50" cy="88" rx="27" ry="7" fill="url(#br-shade)" stroke="#222" stroke-width="1.5"/>
  <ellipse cx="50" cy="86" rx="27" ry="7" fill="url(#br-body)" stroke="#222" stroke-width="1.5"/>
  <!-- Stem -->
  <path d="M35 86 Q33 72 37 58 L63 58 Q67 72 65 86 Z" fill="url(#br-body)" stroke="#222" stroke-width="1.5"/>
  <!-- Collar -->
  <rect x="34" y="55" width="32" height="5" rx="2" fill="url(#br-shade)" stroke="#222" stroke-width="1.2"/>
  <!-- Tower body -->
  <rect x="36" y="35" width="28" height="20" rx="1" fill="url(#br-body)" stroke="#222" stroke-width="1.5"/>
  <!-- Battlement top plate -->
  <rect x="33" y="33" width="34" height="4" rx="1" fill="url(#br-shade)" stroke="#222" stroke-width="1.2"/>
  <!-- Battlements -->
  <rect x="33" y="22" width="8" height="11" rx="1" fill="url(#br-body)" stroke="#222" stroke-width="1.2"/>
  <rect x="46" y="22" width="8" height="11" rx="1" fill="url(#br-body)" stroke="#222" stroke-width="1.2"/>
  <rect x="59" y="22" width="8" height="11" rx="1" fill="url(#br-body)" stroke="#222" stroke-width="1.2"/>
  <!-- Highlight -->
  <path d="M41 55 Q40 48 41 40" stroke="#666" stroke-width="1.5" fill="none" opacity="0.5" stroke-linecap="round"/>
</svg>
