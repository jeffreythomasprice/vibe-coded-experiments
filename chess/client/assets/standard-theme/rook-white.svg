<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- White Rook -->
  <defs>
    <linearGradient id="wr-body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff"/>
      <stop offset="100%" stop-color="#d4d4d4"/>
    </linearGradient>
    <linearGradient id="wr-shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8e8e8"/>
      <stop offset="100%" stop-color="#a0a0a0"/>
    </linearGradient>
  </defs>
  <!-- Base -->
  <ellipse cx="50" cy="88" rx="27" ry="7" fill="url(#wr-shade)" stroke="#555" stroke-width="1.5"/>
  <ellipse cx="50" cy="86" rx="27" ry="7" fill="url(#wr-body)" stroke="#555" stroke-width="1.5"/>
  <!-- Stem -->
  <path d="M35 86 Q33 72 37 58 L63 58 Q67 72 65 86 Z" fill="url(#wr-body)" stroke="#555" stroke-width="1.5"/>
  <!-- Collar -->
  <rect x="34" y="55" width="32" height="5" rx="2" fill="url(#wr-shade)" stroke="#555" stroke-width="1.2"/>
  <!-- Tower body -->
  <rect x="36" y="35" width="28" height="20" rx="1" fill="url(#wr-body)" stroke="#555" stroke-width="1.5"/>
  <!-- Battlement top plate -->
  <rect x="33" y="33" width="34" height="4" rx="1" fill="url(#wr-shade)" stroke="#555" stroke-width="1.2"/>
  <!-- Battlements (crenellations) -->
  <rect x="33" y="22" width="8" height="11" rx="1" fill="url(#wr-body)" stroke="#555" stroke-width="1.2"/>
  <rect x="46" y="22" width="8" height="11" rx="1" fill="url(#wr-body)" stroke="#555" stroke-width="1.2"/>
  <rect x="59" y="22" width="8" height="11" rx="1" fill="url(#wr-body)" stroke="#555" stroke-width="1.2"/>
  <!-- Highlight -->
  <path d="M41 55 Q40 48 41 40" stroke="#fff" stroke-width="1.5" fill="none" opacity="0.6" stroke-linecap="round"/>
</svg>
