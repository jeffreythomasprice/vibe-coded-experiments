<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- White King -->
  <defs>
    <linearGradient id="wk-body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff"/>
      <stop offset="100%" stop-color="#d4d4d4"/>
    </linearGradient>
    <linearGradient id="wk-shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8e8e8"/>
      <stop offset="100%" stop-color="#a0a0a0"/>
    </linearGradient>
  </defs>
  <!-- Base -->
  <ellipse cx="50" cy="88" rx="28" ry="7" fill="url(#wk-shade)" stroke="#555" stroke-width="1.5"/>
  <ellipse cx="50" cy="86" rx="28" ry="7" fill="url(#wk-body)" stroke="#555" stroke-width="1.5"/>
  <!-- Stem -->
  <path d="M34 86 Q32 70 36 55 L64 55 Q68 70 66 86 Z" fill="url(#wk-body)" stroke="#555" stroke-width="1.5"/>
  <!-- Collar -->
  <ellipse cx="50" cy="55" rx="16" ry="5" fill="url(#wk-shade)" stroke="#555" stroke-width="1.2"/>
  <!-- Upper body -->
  <path d="M38 55 Q36 42 40 32 L60 32 Q64 42 62 55 Z" fill="url(#wk-body)" stroke="#555" stroke-width="1.5"/>
  <!-- Crown rim -->
  <rect x="37" y="30" width="26" height="5" rx="2" fill="url(#wk-shade)" stroke="#555" stroke-width="1.2"/>
  <!-- Crown points -->
  <path d="M39 30 L37 20 L42 25 L46 17 L50 25 L54 17 L58 25 L63 20 L61 30 Z" fill="url(#wk-body)" stroke="#555" stroke-width="1.2" stroke-linejoin="round"/>
  <!-- Cross -->
  <rect x="47.5" y="8" width="5" height="14" rx="1.5" fill="url(#wk-body)" stroke="#555" stroke-width="1.2"/>
  <rect x="44" y="11" width="12" height="5" rx="1.5" fill="url(#wk-body)" stroke="#555" stroke-width="1.2"/>
  <!-- Highlight -->
  <path d="M44 60 Q43 50 45 38" stroke="#fff" stroke-width="1.5" fill="none" opacity="0.6" stroke-linecap="round"/>
</svg>
