[workspace]
resolver = "2"
members = ["shared", "server", "client", "engine"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
rand = "0.8"
uuid = { version = "1", features = ["serde", "v4"] }
chrono = { version = "0.4", features = ["serde"] }
