[package]
name = "exalted-battle-wheel"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.22"
console_error_panic_hook = "0.1.7"
js-sys = "0.3"
leptos = { version = "0.8.20", features = ["csr"] }
qrcodegen = "1.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tracing-web = "0.1.3"
wasm-bindgen = "0.2.127"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3.104", features = [
    "Crypto",
    "DomException",
    "DomRect",
    "Document",
    "Element",
    "History",
    "KeyboardEvent",
    "Location",
    "MediaQueryList",
    "MediaQueryListEvent",
    "MessageEvent",
    "Node",
    "RtcConfiguration",
    "RtcDataChannel",
    "RtcDataChannelEvent",
    "RtcIceGatheringState",
    "RtcIceServer",
    "RtcPeerConnection",
    "RtcSdpType",
    "RtcSessionDescription",
    "RtcSessionDescriptionInit",
    "Storage",
    "StorageEvent",
    "UrlSearchParams",
    "Window",
] }
