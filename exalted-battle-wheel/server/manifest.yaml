apiVersion: apps/v1
kind: Deployment
metadata:
  name: exalted-server
spec:
  # Must stay 1: room broadcast fans out through an in-process sender registry keyed by
  # connection id (see `server/src/ws/hub.rs`), and every room mutation is serialized by a single
  # in-process lock. A second pod would neither receive broadcasts meant for connections on the
  # first, nor actually serialize writes against it -- multi-replica needs a real pub/sub and
  # locking layer this app doesn't have.
  replicas: 1
  selector:
    matchLabels: { app: exalted-server }
  template:
    metadata:
      labels: { app: exalted-server }
    spec:
      containers:
        - name: exalted-server
          image: exalted-server:v1 # never :latest, never untagged -- see push-image.sh
          imagePullPolicy: IfNotPresent
          env:
            - name: AWS_REGION
              value: us-east-1
            - name: ACCESS_CODES_TABLE
              value: exalted-battle-wheel-access-codes
            - name: ROOMS_TABLE
              value: exalted-battle-wheel-rooms
            - name: CONNECTIONS_TABLE
              value: exalted-battle-wheel-websocket-connections
          envFrom:
            - secretRef: { name: exalted-server-aws } # AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY, from deploy.sh
          ports:
            - containerPort: 8001
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { memory: 128Mi }
          readinessProbe:
            httpGet: { path: /health, port: 8001 }
            initialDelaySeconds: 1
          livenessProbe:
            httpGet: { path: /health, port: 8001 }
            initialDelaySeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: exalted-server
spec:
  selector: { app: exalted-server }
  ports:
    - port: 80
      targetPort: 8001
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: exalted-server
  annotations:
    # Start on -staging while testing (see README); Let's Encrypt's real-cert rate limits are easy
    # to burn through on a misconfigured Ingress. Flip to letsencrypt-prod once staging issues Ready.
    # cert-manager.io/cluster-issuer: letsencrypt-staging
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # Multiplayer will ride a long-lived connection (websocket or similar) once it exists; these
    # cost nothing today and avoid a confusing ~60s-disconnect debugging session later.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [exalted-api.jeffrey.lol]
      secretName: exalted-api-tls
  rules:
    - host: exalted-api.jeffrey.lol
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: exalted-server
                port: { number: 80 }
