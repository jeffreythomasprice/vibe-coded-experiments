[package]
name = "server"
version.workspace = true
edition.workspace = true

[dependencies]
aws-config = { version = "1", default-features = false, features = ["rt-tokio"] }
aws-sdk-dynamodb = { version = "1", default-features = false, features = ["rt-tokio"] }
aws-smithy-http-client = { version = "1", default-features = false, features = ["rustls-ring"] }
axum = { version = "0.8", features = ["ws"] }
dotenvy = "0.15"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
jsonwebtoken = { version = "9", default-features = false }
serde.workspace = true
serde_json.workspace = true
shared.workspace = true
thiserror.workspace = true
time.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "signal", "net", "sync", "time"] }
tower-http = { version = "0.6", features = ["trace", "cors"] }
tracing.workspace = true
tracing-subscriber.workspace = true
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
