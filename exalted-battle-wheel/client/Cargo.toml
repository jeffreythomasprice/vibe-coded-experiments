[package]
name = "client"
version.workspace = true
edition.workspace = true

[dependencies]
console_error_panic_hook = "0.1.7"
gloo-net = { version = "0.6", default-features = false, features = ["http", "json"] }
leptos = { version = "0.8.20", features = ["csr"] }
serde.workspace = true
serde_json.workspace = true
shared.workspace = true
thiserror.workspace = true
time.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-web = "0.1.3"
web-sys = { version = "0.3.104", features = [
    "CloseEvent",
    "DomException",
    "DomRect",
    "Document",
    "Element",
    "KeyboardEvent",
    "MediaQueryList",
    "MediaQueryListEvent",
    "MessageEvent",
    "Node",
    "Storage",
    "StorageEvent",
    "WebSocket",
    "Window",
] }

[build-dependencies]
dotenvy = "0.15"
thiserror.workspace = true
