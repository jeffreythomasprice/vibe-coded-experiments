[package]
name = "client"
version.workspace = true
edition.workspace = true

[dependencies]
console_error_panic_hook = "0.1.7"
gloo-net = { version = "0.6", default-features = false, features = ["http", "json"] }
js-sys = "0.3"
leptos = { version = "0.8.20", features = ["csr"] }
# `default-features = false` deliberately excludes petname's own RNG-backed `namer`/`petname` API:
# that path drags in `getrandom` (via `rand`'s `sys_rng`/`thread_rng`), which does not compile for
# wasm32-unknown-unknown without an extra rustflag. `names.rs` indexes the public `adjectives`/
# `nouns` word lists directly with `js_sys::Math::random()` instead.
petname = { version = "3.2.0", default-features = false, features = ["default-words"] }
serde.workspace = true
serde_json.workspace = true
shared.workspace = true
thiserror.workspace = true
time.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-web = "0.1.3"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3.104", features = [
    "Clipboard",
    "CloseEvent",
    "DomException",
    "DomRect",
    "Document",
    "Element",
    "History",
    "HtmlInputElement",
    "KeyboardEvent",
    "Location",
    "MediaQueryList",
    "MediaQueryListEvent",
    "MessageEvent",
    "Navigator",
    "Node",
    "Storage",
    "StorageEvent",
    "UrlSearchParams",
    "WebSocket",
    "Window",
] }

[build-dependencies]
dotenvy = "0.15"
thiserror.workspace = true
