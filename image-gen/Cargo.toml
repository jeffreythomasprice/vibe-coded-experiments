[package]
name = "image-gen"
version = "0.1.0"
edition = "2024"
default-run = "image-gen"

[features]
ollama-tests = []
sd-server-tests = []

[[bin]]
name = "fake-sd-server"
path = "tests/fixtures/fake_sd_server.rs"
required-features = ["sd-server-tests"]

[dependencies]
async-trait = "0.1.89"
base64 = "0.22.1"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "6.0.0"
hf-hub = { version = "0.4.3", default-features = false, features = ["ureq"] }
image = "0.25.10"
indicatif = "0.17"
libc = "0.2.189"
reqwest = { version = "0.12.24", default-features = false, features = ["json", "rustls-tls"] }
schemars = "1.0.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tempfile = "3.27.0"
thiserror = "2.0.20"
tokio = { version = "1.48.0", features = ["rt-multi-thread", "macros", "fs", "io-util", "time", "process"] }
toml = "1.1.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ureq = { version = "2.12.1", features = ["json"] }
viuer = { version = "0.11.0", features = ["icy_sixel"] }
zip = { version = "8", default-features = false, features = ["deflate"] }

[dev-dependencies]
wiremock = "0.6.5"
